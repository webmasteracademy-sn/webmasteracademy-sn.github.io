<head>
<meta charset="UTF-8">

<meta name="description" content="Cours de 2ᵉ année DT Informatique et Webmaster : 12 matières, chapitres, exercices corrigés et quiz.">
<meta name="theme-color" content="#0D0B1E">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTJDMkI1IiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PHBhdGggZD0iTTE0IDh2Nk0yNCA4djZNMzQgOHY2TTQ0IDh2Nk01MCAxNGg2TTUwIDI0aDZNNTAgMzRoNk01MCA0NGg2TTggMjBoNk04IDMwaDZNOCA0MGg2TTggNTBoNk0yMCA1MHY2TTMwIDUwdjZNNDAgNTB2NiIvPjwvZz48cmVjdCB4PSIxNCIgeT0iMTQiIHdpZHRoPSIzNiIgaGVpZ2h0PSIzNiIgcng9IjgiIGZpbGw9IiMxNzEzMkYiIHN0cm9rZT0iI0U2MDA3RSIgc3Ryb2tlLXdpZHRoPSIzIi8+PHBhdGggZD0iTTIwIDI0bDUgMTcgNy0xMiA3IDEyIDUtMTciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0Y0QjQwMCIgc3Ryb2tlLXdpZHRoPSI0LjUiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjwvc3ZnPg==">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* « Nuit de Thiès » : indigo profond, magenta hibiscus, bleu lagon, or du Sahel ; pages de lecture lavande très claire.
     Accueil plein écran en 3D, puis colonne de lecture avec rail de chapitres. */
  --night:#0D0B1E; --night2:#17132F; --hibiscus:#E6007E; --lagon:#12C2B5; --sahel:#F4B400;
  --paper:#F6F4FB; --surface:#FFFFFF; --ink:#17132B; --muted:#625D78; --line:#E1DCEE;
  --display:"Syne", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--hibiscus)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sahel);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.04;text-wrap:balance;margin:0;letter-spacing:-.015em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.boot{padding:40px;text-align:center;color:var(--muted)}
.mono{font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--hibiscus);border-color:var(--hibiscus);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.ghost:hover{border-color:#fff}
.btn.ok{background:#0E9C77;border-color:#0E9C77;color:#fff}
.btn.small{padding:8px 13px;font-size:15px;border-radius:10px}

/* en-tête sombre */
.top{background:rgba(13,11,30,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:34px;height:34px}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.brand b span{color:var(--sahel)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav .btn{background:transparent;color:#cfc9e6;border-color:transparent}
.nav .btn:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.nav .btn.cur{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
@media (max-width:560px){.hide-sm{display:none!important}.nav .btn{padding:7px 9px;font-size:14px;white-space:nowrap}.brand b{font-size:16px}}

/* séquence de démarrage façon BIOS */
#post{position:fixed;inset:0;z-index:100;background:#05040D;color:#9FF3E9;font-family:var(--mono);font-size:14px;padding:28px 22px;line-height:1.7;transition:opacity .5s}
#post .ok{color:var(--sahel)}
#post .skip{position:absolute;right:16px;bottom:16px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
#post.out{opacity:0;pointer-events:none}

/* accueil 3D */
.hero3d{position:relative;background:radial-gradient(90% 70% at 50% 35%,#251c52 0%,var(--night) 62%);color:#fff;overflow:hidden}
.hero3d .scene{position:relative;height:clamp(460px,74vh,720px)}
.hero3d canvas{width:100%!important;height:100%!important;display:block;touch-action:pan-y}
.hero3d .nogl{position:absolute;inset:0;display:grid;place-items:center}
.hero3d .nogl img{width:min(42%,260px)}
.hero3d .cap{position:absolute;left:50%;transform:translateX(-50%);top:16px;font-family:var(--mono);font-size:12.5px;color:#d9d3f2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.hero3d .copy{position:relative;margin-top:-140px;padding-bottom:40px;pointer-events:none}
.hero3d .copy>*{pointer-events:auto}
.hero3d .copy::before{content:"";position:absolute;inset:-60px -40vw 0;background:linear-gradient(180deg,rgba(13,11,30,0) 0%,var(--night) 46%);z-index:-1}
.kicker{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--lagon);font-weight:600}
.hero3d h1{font-size:clamp(42px,7.4vw,92px);font-weight:800;margin:10px 0 14px;max-width:12em}
.hero3d h1 .g{background:linear-gradient(90deg,var(--hibiscus),var(--sahel));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero3d .lead{color:#cfc9e6;font-size:19px;max-width:34em;margin:0 0 22px}
.facts{display:flex;flex-wrap:wrap;gap:26px;margin-top:28px}
.facts div{font-size:14.5px;color:#a9a2c7}
.facts b{display:block;font-family:var(--display);font-size:36px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}

.todaybox{background:var(--night2);color:#fff;border-radius:16px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 0;border:1px solid rgba(255,255,255,.08)}
.todaybox .d{font-family:var(--display);font-size:22px;font-weight:800;margin-right:6px}
.todaybox a{background:rgba(255,255,255,.08);color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px;border-left:3px solid var(--c,var(--lagon))}
.todaybox a small{font-family:var(--mono);opacity:.7;margin-left:6px}

section.band{padding:60px 0}
section.band.white{background:var(--surface)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sh h2{font-size:clamp(32px,4.4vw,48px);font-weight:800}
.sh p{color:var(--muted);margin:6px 0 0;max-width:40em}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:min(380px,100%)}
.search input{flex:1;border:0;outline:none;background:none;padding:12px 0}
.results{display:grid;gap:8px;margin-bottom:14px}
.results a{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.results small{color:var(--muted);font-family:var(--mono)}

/* grille des matières */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px 20px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .2s,box-shadow .2s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--c) 70%,transparent)}
.mcard .num{position:absolute;right:16px;top:12px;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:color-mix(in srgb,var(--c) 22%,#fff)}
.mcard .day{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mcard h3{font-size:24px;font-weight:800;max-width:80%}
.mcard p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.mcard .foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:auto}
.bar{height:6px;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c)}
.mcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}

.price{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.price{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.big{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
footer{background:var(--night);color:#a9a2c7;padding:26px 0;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

/* emploi du temps */
.sub{color:var(--muted);margin:0 0 22px;max-width:46em}
.sched{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sched table{border-collapse:collapse;width:100%;min-width:760px}
.sched th,.sched td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
.sched th{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#FAF9FD}
.sched th.now{color:var(--hibiscus)}
.sched td.h{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.slot{display:block;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,#fff);border-left:4px solid var(--c);color:var(--ink);text-decoration:none;font-weight:700;font-size:14.5px;line-height:1.25}

/* page matière */
.shead{background:var(--night);color:#fff;position:relative;overflow:hidden}
.shead::before{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent) 0%,transparent 65%)}
.shead .wrap{position:relative;padding-top:30px;padding-bottom:30px}
.back{font-family:var(--mono);font-size:13px;color:#cfc9e6;text-decoration:none}
.shead h1{font-size:clamp(38px,6.4vw,66px);font-weight:800;margin:10px 0 8px}
.shead .intro{color:#cfc9e6;margin:0;max-width:44em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:14.5px}
.chip i{width:9px;height:9px;border-radius:50%}
.role{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin:26px 0 8px}
@media (max-width:900px){.role{grid-template-columns:1fr}}
.role>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.role h3{font-size:18px;margin-bottom:8px;color:var(--c)}
.role p{margin:0;font-size:16px}
.role ul{margin:0;padding-left:18px;font-size:15.5px}
.role li{margin:3px 0}
.course{display:grid;grid-template-columns:260px minmax(0,1fr);gap:30px;margin-top:26px}
.course>*{min-width:0}
@media (max-width:1100px){.course{grid-template-columns:minmax(0,1fr)}}
.toc{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;align-self:start}
@media (max-width:1100px){.toc{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.toc button{display:flex;gap:10px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.3;color:var(--muted);flex:none}
@media (max-width:1100px){.toc button{max-width:220px;border-color:var(--line);background:var(--surface)}}
.toc .n{font-family:var(--mono);font-size:12px;min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.toc button.on{color:var(--ink);background:var(--surface);border-color:var(--line)}
.toc button.on .n{background:var(--c);border-color:var(--c);color:#fff}
.toc button.done .n{background:#DDF6EE;border-color:#bfeadb;color:#0E9C77}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 34px;max-width:840px}
@media (max-width:600px){.doc{padding:22px 18px}}
.kick{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.doc h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin:6px 0 18px}
.doc h3{font-size:22px;font-weight:700;margin:28px 0 8px}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:22px}
.tbl{overflow-x:auto;margin:4px 0 18px;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:15.5px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:#FAF9FD;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.formula{font-family:var(--mono);font-size:15.5px;background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);border-radius:12px;padding:11px 14px;margin:0 0 16px;overflow-x:auto}
.tip,.warn{border-radius:12px;padding:11px 14px;margin:0 0 16px;font-size:16px}
.tip{background:#FFF7DB;border:1px solid #F3DF94}
.warn{background:#FDEAF3;border:1px solid #F5BFD9}
.tip b,.warn b{font-weight:800;margin-right:4px}
pre{font-family:var(--mono);font-size:14px;line-height:1.55;background:var(--night);color:#E3DEF7;border-radius:12px;padding:14px 16px;overflow-x:auto;margin:0 0 16px}
.exs{margin-top:30px;border-top:1px solid var(--line);padding-top:6px}
.exi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.exi .q{display:flex;gap:12px}
.exi .q b{font-family:var(--mono);font-size:13px;color:var(--c);flex:none;padding-top:3px}
.exi summary{cursor:pointer;margin-top:10px;font-weight:700;color:var(--hibiscus);font-size:15px;list-style:none;display:inline-block}
.exi summary::-webkit-details-marker{display:none}
.exi summary::before{content:"▸ "}
.exi details[open] summary::before{content:"▾ "}
.exi .a{margin-top:10px;padding:12px 14px;background:#F1FBF8;border-radius:10px;border:1px solid #CDEEE4}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:28px}
.qi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.qi p{font-weight:700;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#FBFAFE;cursor:pointer}
.opts button:hover{border-color:var(--ink)}
.opts .ok{border-color:#0E9C77;background:#E3F7F0}
.opts .ko{border-color:var(--hibiscus);background:#FDEAF3}
.expl{font-size:15px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* comptes, accès, administration */
.btn.bad{color:#C62C5B;border-color:#F3C3D6}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 24px));box-shadow:0 30px 80px rgba(13,11,30,.45);color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(13,11,30,.6)}
dialog .x{position:absolute;right:8px;top:6px}
dialog .x button{background:none;border:0;font-size:20px;cursor:pointer;padding:6px 10px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:18px 10px 14px;font-weight:800;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hibiscus)}
.form{display:flex;flex-direction:column;gap:6px;padding:18px 22px 24px}
.form label{font-weight:700;font-size:15px;margin-top:8px}
.form input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#FBFAFE;font-size:16px}
.form input:focus{outline:none;border-color:var(--hibiscus);box-shadow:0 0 0 3px rgba(230,0,126,.15)}
.form .btn{margin-top:14px}
.fine{font-size:14px;color:var(--muted);margin:8px 0 0}
.link{background:none;border:0;color:var(--hibiscus);cursor:pointer;padding:6px 0;font-weight:700;text-align:left}
.msg{font-size:15px;margin:6px 0 0;min-height:1.2em}.msg.err{color:#C62C5B}.msg.okk{color:#0E9C77}
.gate{max-width:640px;margin:48px auto;padding:0 20px}
.gate .panel{padding:28px}
.gate h1{font-size:clamp(30px,5vw,42px);font-weight:800;margin:10px 0 12px}
.gate p,.gate li{color:var(--muted)}
.gate .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.badge{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.badge.pending{background:#FFF4CC;color:#7A5B00}.badge.approved{background:#DDF6EE;color:#0E9C77}.badge.blocked{background:#FDE4EF;color:#C62C5B}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{background:none;border:0;padding:9px 13px;cursor:pointer;font-weight:700;font-size:14.5px}
.seg button.on{background:var(--night);color:#fff}
.ulist{display:grid;gap:10px}
.urow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.urow span{color:var(--muted);font-size:14.5px}
.urow .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

</style>
</head>
<body>
<div id="app"><p class="boot">Chargement…</p></div>
<dialog id="auth" aria-label="Connexion">
  <form method="dialog" class="x"><button aria-label="Fermer">✕</button></form>
  <div class="tabs" role="tablist"><button type="button" role="tab" id="tab-login" aria-selected="true">Se connecter</button><button type="button" role="tab" id="tab-register" aria-selected="false">Créer un compte</button></div>
  <form id="f-login" class="form">
    <label for="l-email">Adresse e-mail</label><input id="l-email" type="email" autocomplete="email" required>
    <label for="l-pass">Mot de passe</label><input id="l-pass" type="password" autocomplete="current-password" required minlength="6">
    <button class="btn primary" type="submit">Se connecter</button>
    <button class="link" type="button" id="forgot">Mot de passe oublié ?</button>
    <p class="msg" id="m-login" role="status"></p>
  </form>
  <form id="f-register" class="form" hidden>
    <label for="r-nom">Prénom et nom</label><input id="r-nom" type="text" autocomplete="name" required minlength="3">

<script>
// Ordinateur en 3D qui s'assemble pièce par pièce (Three.js r128, chargé dans index.html).
function mountPC(box, caption, subjects, onPick) {
  const THREE = window.THREE;
  if (!THREE) return false;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { return false; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  box.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(34, 1, .1, 100);
  cam.position.set(8.2, 5.4, 11.2);
  const target = new THREE.Vector3(0, 2.0, 0);
  cam.lookAt(target);

  // ---------- textures dessinées ----------
  function tex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t; }
  const boardTex = tex(1024, 1024, (g, w, h) => {
    g.fillStyle = "#1a2433"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(140,170,210,.18)"; g.lineWidth = 3;
    for (let i = 0; i < 70; i++) { g.beginPath(); let x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); for (let k = 0; k < 3; k++) { if (k % 2) x += (Math.random() - .5) * 300; else y += (Math.random() - .5) * 300; g.lineTo(x, y); } g.stroke(); }
    g.fillStyle = "#c9cfd8"; g.fillRect(360, 250, 300, 300);                 // socket
    g.fillStyle = "#2b3442"; g.fillRect(380, 270, 260, 260);
    for (let i = 0; i < 4; i++) { g.fillStyle = "#0f141c"; g.fillRect(720 + i * 46, 160, 26, 560); }   // slots RAM
    g.fillStyle = "#0f141c"; g.fillRect(120, 640, 800, 34); g.fillRect(120, 770, 800, 34);           // PCIe
    g.fillStyle = "#3a4a63"; g.fillRect(140, 880, 260, 60);                                          // M.2
    g.fillStyle = "#8a96a8"; g.font = "bold 34px monospace"; g.fillText("WMA-Z790", 120, 120);
  });

  // ---------- matériaux ----------
  const M = (o) => new THREE.MeshStandardMaterial(o);
  const black = M({ color: 0x15181d, metalness: .6, roughness: .45 });
  const dark = M({ color: 0x232a35, metalness: .5, roughness: .5 });
  const alu = M({ color: 0xb9c2cf, metalness: .9, roughness: .28 });
  const copper = M({ color: 0xc8823e, metalness: 1, roughness: .3 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x9fb4d0, metalness: 0, roughness: .05, transmission: .0, transparent: true, opacity: .12 });
  const rgbA = M({ color: 0xE6007E, emissive: 0xE6007E, emissiveIntensity: 1.7 });
  const rgbB = M({ color: 0x12C2B5, emissive: 0x12C2B5, emissiveIntensity: 1.6 });

  const pc = new THREE.Group(); scene.add(pc);
  const parts = [];
  function part(name, group, from) { group.userData.home = group.position.clone(); group.userData.homeRot = group.rotation.clone(); group.userData.from = from; pc.add(group); parts.push({ name, g: group }); return group; }
  const box3 = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

  // Boîtier (cadre + vitre)
  const caseG = new THREE.Group();
  const W = 2.2, H = 4.4, D = 4.4;
  [[W, .08, D, 0, 0, 0], [W, .08, D, 0, H, 0], [.08, H, D, -W / 2, H / 2, 0], [W, H, .08, 0, H / 2, -D / 2]].forEach(([w, h, d, x, y, z]) => { const m = box3(w, h, d, black); m.position.set(x, y, z); caseG.add(m); });
  const front = box3(W, H, .1, dark); front.position.set(0, H / 2, D / 2); caseG.add(front);
  for (let i = 0; i < 3; i++) { const ring = new THREE.Mesh(new THREE.TorusGeometry(.48, .05, 12, 40), i % 2 ? rgbB : rgbA); ring.position.set(0, 1 + i * 1.2, D / 2 + .06); caseG.add(ring); }
  const pane = box3(.03, H - .1, D - .1, glass); pane.position.set(W / 2, H / 2, 0); caseG.add(pane);
  part("Boîtier", caseG, new THREE.Vector3(0, -6, 0));

  // Carte mère
  const mb = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(.06, 3.5, 3.3), [dark, dark, dark, dark, dark, dark]);
  board.material = [M({ map: boardTex, metalness: .3, roughness: .6 }), dark, dark, dark, dark, dark];
  mb.add(board); mb.position.set(-W / 2 + .14, 2.35, -.3); mb.rotation.y = 0;
  // texture vue depuis +x : on tourne la face
  part("Carte mère", mb, new THREE.Vector3(5, 0, 0));

  // Processeur + ventirad
  const cpu = new THREE.Group();
  const chip = box3(.06, .5, .5, alu); cpu.add(chip);
  const base = box3(.18, .6, .6, copper); base.position.x = .12; cpu.add(base);
  for (let i = 0; i < 14; i++) { const fin = box3(.75, .02, .9, alu); fin.position.set(.6, -.55 + i * .085, 0); cpu.add(fin); }
  const fan = new THREE.Group(); fan.position.set(.6, 0, .5);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .06, 20), black); hub.rotation.x = Math.PI / 2; fan.add(hub);
  for (let i = 0; i < 7; i++) { const b = box3(.06, .42, .02, black); b.position.y = .22; const p = new THREE.Group(); p.add(b); p.rotation.z = i * Math.PI * 2 / 7; b.rotation.y = .5; fan.add(p); }
  const fanRing = new THREE.Mesh(new THREE.TorusGeometry(.5, .04, 10, 36), rgbA); fan.add(fanRing);
  cpu.add(fan);
  cpu.position.set(-W / 2 + .2, 2.95, -.3 + 0);
  part("Processeur", cpu, new THREE.Vector3(4, 2, 0));

  // RAM
  const ram = new THREE.Group();
  for (let i = 0; i < 2; i++) { const s = new THREE.Group(); const pcb = box3(.5, 1.75, .05, M({ color: 0x0f3b2f, metalness: .4, roughness: .5 })); s.add(pcb); const sp = box3(.52, 1.6, .07, black); sp.position.y = -.03; s.add(sp); const top = box3(.1, 1.6, .08, i ? rgbB : rgbA); top.position.set(.28, 0, 0); s.add(top); s.position.z = i * .2; ram.add(s); }
  ram.position.set(-W / 2 + .45, 2.9, .75);
  ram.children.forEach((s, i) => s.position.set(0, 0, i * .18));
  part("Mémoire RAM", ram, new THREE.Vector3(4, 3, 0));

  // Carte graphique
  const gpu = new THREE.Group();
  const shroud = box3(1.45, .42, 2.9, M({ color: 0x1b1f27, metalness: .7, roughness: .35 })); gpu.add(shroud);
  const back = box3(1.45, .04, 2.9, alu); back.position.y = .23; gpu.add(back);
  for (let i = 0; i < 3; i++) { const f = new THREE.Mesh(new THREE.CylinderGeometry(.36, .36, .03, 32), black); f.position.set(.05, -.23, -.95 + i * .95); gpu.add(f); const r = new THREE.Mesh(new THREE.TorusGeometry(.37, .025, 8, 32), rgbB); r.rotation.x = Math.PI / 2; r.position.copy(f.position); gpu.add(r); }
  const strip = box3(.02, .08, 2.6, rgbA); strip.position.set(.74, .05, 0); gpu.add(strip);
  gpu.position.set(-W / 2 + .9, 1.75, -.25);
  part("Carte graphique", gpu, new THREE.Vector3(5, -1, 0));

  // SSD
  const ssd = box3(.04, .22, .8, M({ color: 0x0c0f14, metalness: .5, roughness: .4 })); ssd.position.set(-W / 2 + .2, 1.15, -1.05);
  const ssdG = new THREE.Group(); ssdG.add(ssd); part("SSD NVMe", ssdG, new THREE.Vector3(4, 0, 0));

  // Alimentation
  const psu = new THREE.Group(); const pb = box3(1.5, .75, 1.6, black); psu.add(pb);
  const grill = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, .02, 32), dark); grill.position.y = .38; psu.add(grill);
  psu.position.set(-.25, .48, -1.2);
  part("Alimentation", psu, new THREE.Vector3(5, -2, 0));

  // Sol + lumières
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), M({ color: 0x120f26, metalness: .3, roughness: .7 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -.01; scene.add(floor);
  scene.add(new THREE.HemisphereLight(0xbfd2ff, 0x101622, .9));
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(6, 9, 6); scene.add(key);
  const blue = new THREE.PointLight(0xE6007E, 2.4, 7); blue.position.set(.6, 2.5, 1.2); scene.add(blue);
  const amber = new THREE.PointLight(0x12C2B5, 1.8, 6); amber.position.set(.4, 1.2, -.8); scene.add(amber);

  // ---------- matières en orbite ----------
  const ring = new THREE.Group(); scene.add(ring); const sprites = [];
  (subjects || []).forEach((sub, i) => {
    const t = tex(512, 160, (g, w, h) => {
      g.fillStyle = "rgba(18,14,40,.92)"; const r = 34;
      g.beginPath(); g.moveTo(r, 0); g.arcTo(w, 0, w, h, r); g.arcTo(w, h, 0, h, r); g.arcTo(0, h, 0, 0, r); g.arcTo(0, 0, w, 0, r); g.fill();
      g.strokeStyle = sub.couleur; g.lineWidth = 6; g.stroke();
      g.fillStyle = sub.couleur; g.beginPath(); g.arc(52, h / 2, 16, 0, 7); g.fill();
      g.fillStyle = "#fff"; g.font = "700 46px Manrope, system-ui, sans-serif"; g.textBaseline = "middle";
      let name = sub.nom; while (g.measureText(name).width > 400 && name.length > 4) name = name.slice(0, -2);
      if (name !== sub.nom) name = name.trim() + "…";
      g.fillText(name, 88, h / 2 + 2);
    });
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
    sp.scale.set(2.3, .72, 1); sp.userData = { id: sub.id, a: i / subjects.length * Math.PI * 2 };
    ring.add(sp); sprites.push(sp);
  });
  // particules de données
  const N = 260, pg = new THREE.BufferGeometry(), pos = new Float32Array(N * 3), spd = [];
  for (let i = 0; i < N; i++) { const a = Math.random() * 6.28, r = 2.2 + Math.random() * 5.5; pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = Math.random() * 7; pos[i * 3 + 2] = Math.sin(a) * r; spd.push(.004 + Math.random() * .012); }
  pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xF4B400, size: .05, transparent: true, opacity: .8 }));
  scene.add(pts);
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downX = 0, downY = 0;
  box.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; });
  box.addEventListener("pointerup", e => {
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8 || !onPick) return;
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, cam); const hit = ray.intersectObjects(sprites)[0];
    if (hit) onPick(hit.object.userData.id);
  });
  box.addEventListener("pointermove", e => {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, cam); box.style.cursor = ray.intersectObjects(sprites).length ? "pointer" : "grab";
  });

  // ---------- interaction ----------
  let rotY = -.35, rotX = 0, drag = false, lx = 0, ly = 0, idle = 0;
  box.style.touchAction = "pan-y";
  box.addEventListener("pointerdown", e => { drag = true; lx = e.clientX; ly = e.clientY; idle = 0; });
  addEventListener("pointerup", () => drag = false);
  addEventListener("pointermove", e => { if (!drag) return; rotY += (e.clientX - lx) * .008; rotX = Math.max(-.3, Math.min(.3, rotX + (e.clientY - ly) * .004)); lx = e.clientX; ly = e.clientY; });

  function size() { const w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  new ResizeObserver(size).observe(box); size();

  const ease = p => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
  const STEP = .75, START = .3;
  const t0 = performance.now(); let lastCap = "";
  function frame() {
    const t = (performance.now() - t0) / 1000;
    parts.forEach((p, i) => {
      const k = reduce ? 1 : ease((t - START - i * STEP) / .9);
      const f = p.g.userData.from, h = p.g.userData.home;
      p.g.position.set(h.x + f.x * (1 - k), h.y + f.y * (1 - k), h.z + f.z * (1 - k));
      p.g.visible = k > 0 || i === 0;
    });
    const idx = Math.min(parts.length - 1, Math.floor((t - START) / STEP));
    const label = t - START > parts.length * STEP + .6 ? "Touche une matière qui tourne" : (idx >= 0 ? `${idx + 1}/${parts.length} · ${parts[idx].name}` : "");
    if (caption && label !== lastCap) { caption.textContent = label; lastCap = label; }
    fan.rotation.z = t * 8;
    const ra = reduce ? 0 : t * .18;
    sprites.forEach((sp, i) => { const a = sp.userData.a + ra; sp.position.set(Math.cos(a) * 4.6, 2.1 + Math.sin(a * 2 + t * .6) * .55, Math.sin(a) * 4.6); sp.material.opacity = Math.min(1, Math.max(0, (t - parts.length * STEP) / 1.2)); });
    if (!reduce) { const pa = pg.attributes.position.array; for (let i = 0; i < N; i++) { pa[i * 3 + 1] += spd[i]; if (pa[i * 3 + 1] > 7) pa[i * 3 + 1] = 0; } pg.attributes.position.needsUpdate = true; }
    if (!drag) { idle += 1 / 60; if (idle > 2 && !reduce) rotY += .0025; }
    pc.rotation.y = rotY; pc.rotation.x = rotX;
    pc.position.set(0, 0, 0);
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  frame();
  return true;
}

  const L = src.replace(/^\n+|\n+$/g, "").split("\n"); let h = "", i = 0;
  while (i < L.length) {

    if (l.startsWith("- ")) { const it = []; while (i < L.length && L[i].startsWith("- ")) { it.push(L[i].slice(2)); i++; } h += `<ul>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { const it = []; while (i < L.length && /^\d+\. /.test(L[i])) { it.push(L[i].replace(/^\d+\. /, "")); i++; } h += `<ol>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ol>`; continue; }
    if (l.startsWith("= ")) { h += `<div class="formula">${inl(l.slice(2))}</div>`; i++; continue; }

    const p = []; while (i < L.length && L[i].trim() && !/^(## |\||- |\d+\. |= |> |! |:::)/.test(L[i])) { p.push(L[i]); i++; }
    h += `<p>${inl(p.join(" "))}</p>`;
  }
  return h;
}

  if (!COURSES[s.id]) {
    app.innerHTML = header("programme") + `<div class="gate"><div class="panel"><h1>${esc(s.nom)}</h1><p>Chargement du cours…</p></div></div>`; wire();
    try { const snap = await getDoc(doc(db, "courses", s.id)); COURSES[s.id] = snap.exists() ? snap.data() : null; } catch (e) { COURSES[s.id] = null; }
    if (!COURSES[s.id]) { gate(`<h1>${esc(s.nom)}</h1><p>${isAdmin() ? "Ce cours n'est pas encore importé. Va dans <b>Admin → Importer les cours</b>." : "Ce cours n'est pas encore disponible. Réessaie plus tard."}</p><a class="btn" href="#accueil">Retour</a>`); delete COURSES[s.id]; return; }
  }
  drawSubject(s, COURSES[s.id], ch);
}
function drawSubject(s, c, ch) {
  const total = c.chapitres.length, isQuiz = ch === total, R = s.role;
  const toc = c.chapitres.map((x, i) => { const d = P.done[s.id + ":" + i]; return `<button type="button" data-i="${i}" class="${i === ch ? "on" : ""} ${d ? "done" : ""}"><span class="n">${d ? "✓" : i + 1}</span>${esc(x.t)}</button>`; }).join("") + `<button type="button" data-i="${total}" class="${isQuiz ? "on" : ""}"><span class="n">?</span>Quiz</button>`;
  let body;
  if (isQuiz) body = `<div class="kick">Quiz · ${c.quiz.length} questions</div><h2>Teste-toi en ${esc(s.nom)}</h2>${c.quiz.map((q, qi) => `<div class="qi" data-qi="${qi}"><p>${qi + 1}. ${esc(q.q)}</p><div class="opts">${q.o.map((o, oi) => `<button type="button" data-oi="${oi}">${esc(o)}</button>`).join("")}</div><div class="expl" hidden></div></div>`).join("")}<div class="pager"><b id="score" style="font-size:20px"></b><button class="btn" type="button" id="redo">Recommencer</button></div>`;
  else { const x = c.chapitres[ch], k = s.id + ":" + ch;
    body = `<div class="kick">Chapitre ${ch + 1} sur ${total}</div><h2>${esc(x.t)}</h2>${md(x.c)}
    <div class="exs"><h3>Exercices corrigés</h3>${x.ex.map((e, i) => `<div class="exi"><div class="q"><b>Ex. ${i + 1}</b><div>${inl(e.q)}</div></div><details><summary>Voir la correction</summary><div class="a">${answer(e.r)}</div></details></div>`).join("")}</div>
    <div class="pager">${ch > 0 ? `<button class="btn" data-go="${ch - 1}">← Précédent</button>` : "<span></span>"}<button class="btn ${P.done[k] ? "ok" : ""}" id="done">${P.done[k] ? "✓ Chapitre terminé" : "Marquer comme terminé"}</button><button class="btn primary" data-go="${ch + 1}">${ch + 1 < total ? "Chapitre suivant →" : "Passer au quiz →"}</button></div>`; }
  app.innerHTML = header("programme") + `<div class="shead" style="--c:${s.couleur}"><div class="wrap"><a class="back" href="#programme">← Toutes les matières</a><h1>${esc(s.nom)}</h1><p class="intro">${esc(s.intro)}</p>
    <div class="chips"><span class="chip"><i style="background:${s.couleur}"></i>${s.jour} · ${s.heure}</span><span class="chip">${total} chapitres</span><span class="chip">${pct(s)} % terminé</span>${P.quiz[s.id] != null ? `<span class="chip">Meilleur quiz : ${P.quiz[s.id]}/${c.quiz.length}</span>` : ""}</div></div></div>
    <div class="wrap" style="padding-bottom:60px;--c:${s.couleur}">${R ? `<div class="role"><div><h3>À quoi sert cette matière ?</h3><p>${esc(R.sert)}</p></div><div><h3>Ce que tu sauras faire</h3><ul>${R.savoir.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>Les métiers</h3><ul>${R.metiers.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>` : ""}
    <div class="course" style="--c:${s.couleur}"><nav class="toc" aria-label="Chapitres">${toc}</nav><article class="doc">${body}</article></div></div>` + footer();
  wire();
  document.querySelectorAll(".toc button,[data-go]").forEach(b => b.onclick = () => { drawSubject(s, c, +(b.dataset.i ?? b.dataset.go)); $(".course").scrollIntoView({ behavior: "smooth" }); });
  const d = $("#done"); if (d) d.onclick = () => { const k = s.id + ":" + ch; P.done[k] = !P.done[k]; save(); drawSubject(s, c, ch); };
  if (isQuiz) { let ans = 0, ok = 0;
    document.querySelectorAll(".qi").forEach(it => { const q = c.quiz[+it.dataset.qi]; it.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (it.dataset.done) return; it.dataset.done = 1; ans++; const oi = +b.dataset.oi;
      if (oi === q.a) { b.classList.add("ok"); ok++; } else { b.classList.add("ko"); it.querySelector(`[data-oi="${q.a}"]`).classList.add("ok"); }
      const ex = it.querySelector(".expl"); ex.hidden = false; ex.textContent = (oi === q.a ? "Bonne réponse. " : "Mauvaise réponse. ") + q.e;
      if (ans === c.quiz.length) { $("#score").textContent = `Score : ${ok} / ${c.quiz.length}`; P.quiz[s.id] = Math.max(ok, P.quiz[s.id] || 0); save(); } }); });
    $("#redo").onclick = () => drawSubject(s, c, total); }
}

/* ---------------- administration ---------------- */
let USERS = [], FILTER = "pending";
async function renderAdmin() {
  app.innerHTML = header("admin") + `<section class="band"><div class="wrap"><div class="kicker" style="color:var(--hibiscus)">Administrateur</div><h1 style="font-size:clamp(36px,5.4vw,56px);margin:8px 0 6px">Administration</h1><p class="sub">Valide les comptes après avoir reçu le paiement Wave.</p><div id="adm">Chargement des comptes…</div></div></section>` + footer();
  wire();
  try { USERS = (await getDocs(collection(db, "users"))).docs.map(d => ({ uid: d.id, ...d.data() })); }
  catch (e) { $("#adm").innerHTML = `<p class="msg err">Impossible de lire les comptes. Vérifie que ton e-mail est confirmé et que les règles Firestore sont bien publiées.</p>${importBox()}`; wireImport(); return; }
  drawAdmin();
}
const importBox = () => `<div class="panel" style="margin-top:22px"><h3 style="font-size:22px">Importer les cours</h3><p class="sub" style="margin:6px 0 12px">Choisis le fichier <b>courses.json</b> que je t'ai envoyé (à refaire à chaque mise à jour des cours).</p><input type="file" id="cfile" accept="application/json,.json"><p class="msg" id="imsg" role="status"></p></div>`;
function wireImport() { $("#cfile").onchange = async e => { const f = e.target.files[0]; if (!f) return;
  try { const list = JSON.parse(await f.text()); if (!Array.isArray(list) || !list[0]?.chapitres) throw 0;
    const batch = writeBatch(db); list.forEach(c => batch.set(doc(db, "courses", c.id), c)); await batch.commit();
    Object.keys(COURSES).forEach(k => delete COURSES[k]); say($("#imsg"), `${list.length} matières importées avec succès.`, true);
  } catch (err) { say($("#imsg"), "Import refusé : vérifie le fichier courses.json et les règles Firestore."); } }; }
function drawAdmin() {
  const n = st => USERS.filter(u => u.status === st).length, lab = { pending: "En attente", approved: "Validé", blocked: "Suspendu" };
  const list = USERS.filter(u => FILTER === "all" || u.status === FILTER).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  $("#adm").innerHTML = `<div class="kpis"><div class="kpi"><b>${USERS.length}</b><span>comptes</span></div><div class="kpi"><b>${n("pending")}</b><span>en attente</span></div><div class="kpi"><b>${n("approved")}</b><span>validés</span></div><div class="kpi"><b>${n("blocked")}</b><span>suspendus</span></div></div>
  <div class="toolbar"><div class="seg">${[["pending", "En attente"], ["approved", "Validés"], ["blocked", "Suspendus"], ["all", "Tous"]].map(([k, l]) => `<button type="button" data-f="${k}" class="${FILTER === k ? "on" : ""}">${l}</button>`).join("")}</div><button class="btn small" id="reload">Actualiser</button></div>
  <div class="ulist">${list.length ? list.map(u => `<div class="urow"><div><b>${esc(u.nom)}</b><br><span>${esc(u.email)}</span><br><span class="mono">${esc(u.telephone)}${u.createdAt?.seconds ? " · " + new Date(u.createdAt.seconds * 1000).toLocaleDateString("fr-FR") : ""}</span></div>
    <div class="acts"><span class="badge ${u.status}">${lab[u.status] || u.status}</span>${u.status !== "approved" ? `<button class="btn small ok" data-set="approved" data-u="${u.uid}">Valider</button>` : ""}${u.status !== "blocked" ? `<button class="btn small bad" data-set="blocked" data-u="${u.uid}">Suspendre</button>` : ""}<a class="btn small" href="https://wa.me/${(u.telephone || "").replace(/\D/g, "").replace(/^(?!221)/, "221")}" target="_blank" rel="noopener">WhatsApp</a></div></div>`).join("") : `<p style="color:var(--muted)">Aucun compte dans cette liste.</p>`}</div>${importBox()}`;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { FILTER = b.dataset.f; drawAdmin(); });
  $("#reload").onclick = renderAdmin;
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = async () => { b.disabled = true;
    try { await updateDoc(doc(db, "users", b.dataset.u), { status: b.dataset.set }); USERS.find(u => u.uid === b.dataset.u).status = b.dataset.set; drawAdmin(); } catch (e) { b.disabled = false; b.textContent = "Erreur"; } });
  wireImport();
}

/* ---------------- routeur ---------------- */
function route() {
  if (!USER) { renderPublic(); const h = location.hash.slice(1); if (h === "acces" || h === "programme") document.getElementById(h)?.scrollIntoView(); return; }
  if (!(PROFILE?.status === "approved" || isAdmin())) return;
  const h = (location.hash || "#accueil").slice(1);
  if (h.startsWith("m-") && byId[h.slice(2)]) { renderSubject(byId[h.slice(2)], PENDING ?? 0); PENDING = null; window.scrollTo(0, 0); return; }
  if (h === "emploi") return renderSchedule();
  if (h === "admin" && isAdmin()) return renderAdmin();
  renderHome(h === "programme" ? "programme" : null);
}
addEventListener("hashchange", route);
async function boot(user) {
  USER = user;
  if (!user) { PROFILE = null; return route(); }
  if (!user.emailVerified) return renderVerify();
  try { await user.getIdToken(true); const s = await getDoc(doc(db, "users", user.uid)); PROFILE = s.exists() ? s.data() : null; } catch (e) { PROFILE = null; }
  if (!isAdmin()) { if (!PROFILE || PROFILE.status === "pending") return renderPending(); if (PROFILE.status === "blocked") return renderBlocked(); }
  try { const s = await getDoc(doc(db, "progress", user.uid)); P = s.exists() ? s.data() : { done: {}, quiz: {} }; P.done ||= {}; P.quiz ||= {}; } catch (e) { P = { done: {}, quiz: {} }; }
  route();
}
onAuthStateChanged(auth, boot);

</script>

</script>
