<meta name="description" content="WebMaster Academy : cours d'informatique, exercices corrigés et quiz. Thiès, Sénégal.">
<meta name="theme-color" content="#060914">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjNkU5QUZGIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjM0Q2QkYwIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTYiIGZpbGw9InVybCgjZykiLz48cGF0aCBkPSJNMTMgMjBoNi40bDQuNSAxNy4yTDI5IDIwaDZsNS4xIDE3LjJMNDQuNiAyMEg1MWwtOCAyNWgtNmwtNS0xNi40TDI3IDQ1aC02eiIgZmlsbD0iI2ZmZiIvPjxyZWN0IHg9IjQ1IiB5PSI0MCIgd2lkdGg9IjgiIGhlaWdodD0iNSIgcng9IjEuNSIgZmlsbD0iIzJFRjJDNSIvPjwvc3ZnPgo=">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060914; --ink2:#0B1122; --panel:#0E1529; --panel2:#121B33; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#E8ECF7; --muted:#8A93AD; --dim:#5D6683;
  --accent:#5B8CFF; --mint:#2EF2C5; --amber:#FFB547; --rose:#FF5DA2; --danger:#FF5C6C;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16.5px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono)}
.eyebrow{font:600 12.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.08;margin:0}
.muted{color:var(--muted)}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.24)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 30px -10px rgba(91,140,255,.7)}
.btn.primary:hover{background:#6E9AFF}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#04211B}
.btn.small{height:40px;padding:0 15px;border-radius:11px;font-size:14.5px}
.btn.danger{color:var(--danger);border-color:rgba(255,92,108,.35)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}

/* champs */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input{height:52px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.04);padding:0 16px;font-size:16px;transition:border-color .2s,background .2s}
.field input:focus{outline:none;border-color:var(--accent);background:rgba(91,140,255,.06)}
.msg{min-height:1.3em;font-size:14.5px;margin:4px 0 0}.msg.err{color:var(--danger)}.msg.ok{color:var(--mint)}

/* ===== porte d'entrée ===== */
.gate{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;position:relative;overflow:hidden}
.gate .stage{position:relative;min-height:520px}
.gate .stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;cursor:grab}
.gate .stage .glow{position:absolute;inset:auto 10% 8% 10%;height:40%;background:radial-gradient(closest-side,rgba(91,140,255,.22),transparent);filter:blur(10px);pointer-events:none}
.gate .side{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(22px,5vw,72px);background:linear-gradient(180deg,rgba(14,21,41,.6),rgba(6,9,20,.95));border-left:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand img{width:40px;height:40px}
.brand small{display:block;font:500 11.5px/1.2 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.gate h1{font-size:clamp(34px,4.4vw,54px);margin:34px 0 12px}
.gate h1 em{font-style:normal;color:var(--accent)}
.gate .lead{color:var(--muted);margin:0 0 28px;max-width:30em}
.gate form{max-width:420px}
.gate .foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px;max-width:420px}
.lock{display:inline-flex;align-items:center;gap:8px;font:500 12.5px var(--mono);color:var(--dim);margin-top:30px}
@media (max-width:900px){
  .gate{grid-template-columns:1fr}
  .gate .stage{min-height:46vh;height:46vh}
  .gate .side{border-left:0;border-top:1px solid var(--line);padding:30px 22px 44px}
  .gate h1{margin-top:22px}
}

/* ===== en-tête du site ===== */
.top{position:sticky;top:0;z-index:30;background:rgba(6,9,20,.78);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.nav{display:flex;gap:4px;align-items:center}
.nav a,.nav button{height:40px;padding:0 13px;border-radius:10px;display:inline-flex;align-items:center;color:var(--muted);font-weight:500;font-size:15px;background:none;border:0;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav button:hover,.nav a.cur{color:var(--text);background:rgba(255,255,255,.05)}
@media (max-width:760px){.nav .hide-sm{display:none}.brand .full,.brand small{display:none}}

/* ===== accueil ===== */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:20px;min-height:640px;padding-top:40px;padding-bottom:40px}
.hero h1{font-size:clamp(40px,5.6vw,74px);margin:16px 0 18px}
.hero h1 .a{color:var(--accent)}
.hero p.lead{font-size:18.5px;color:var(--muted);max-width:32em;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .stage{position:relative;height:560px}
.hero .stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;cursor:grab}
.hero .hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--dim);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:36px}
.stats div{padding:18px 0 4px}
.stats b{display:block;font:700 32px/1 var(--display);letter-spacing:-.02em}
.stats span{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;min-height:0;padding-top:10px}
  .hero .stage{height:380px;order:-1;margin:0 -22px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
.section{padding:84px 0;border-bottom:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sh h2{font-size:clamp(30px,3.6vw,44px)}
.sh p{color:var(--muted);margin:10px 0 0;max-width:36em}
.tabs{display:inline-flex;padding:4px;border:1px solid var(--line2);border-radius:13px;background:rgba(255,255,255,.02)}
.tabs button{height:38px;padding:0 15px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);transition:transform .2s,border-color .2s,background .2s;overflow:hidden;min-height:250px}
.card:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--panel2)}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c);opacity:.9}
.card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.card .tag{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.card h3{font-size:22px}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.card .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}.card .bar span{display:block;height:100%;background:var(--c)}
.card .foot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dim)}
.founder{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.founder .photo{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line2);aspect-ratio:4/5;background:var(--panel)}
.founder .photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.04)}
.founder .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(6,9,20,.85))}
.founder .photo .cap{position:absolute;left:20px;bottom:18px;z-index:2}
.founder .photo .cap b{font:700 22px var(--display);display:block}
.founder .photo .cap span{font:500 12.5px var(--mono);color:var(--mint);letter-spacing:.08em}
.founder blockquote{margin:0 0 20px;font:600 clamp(24px,2.6vw,32px)/1.25 var(--display);letter-spacing:-.015em}
.founder p{color:var(--muted)}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.values div{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.values b{display:block;font-family:var(--display);margin-bottom:4px}
.values span{font-size:14px;color:var(--muted)}
@media (max-width:900px){.founder{grid-template-columns:1fr;gap:28px}.founder .photo{max-width:420px}.values{grid-template-columns:1fr}}
footer{padding:40px 0 60px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ===== page matière ===== */
.shead{padding:38px 0 30px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,transparent),transparent)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14.5px;margin-bottom:18px}
.shead h1{font-size:clamp(34px,4.6vw,56px)}
.shead .intro{color:var(--muted);max-width:44em;margin:12px 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);font-size:13.5px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.role{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin:26px 0}
.role>div{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.role h3{font-size:16px;margin-bottom:8px;color:var(--c)}
.role p,.role li{font-size:14.5px;color:var(--muted);margin:0}
.role ul{margin:0;padding-left:18px}
@media (max-width:900px){.role{grid-template-columns:1fr}}
.course{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:70px}
.toc{position:sticky;top:84px;display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--panel);max-height:calc(100vh - 100px);overflow:auto}
.toc button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:14.5px;cursor:pointer;line-height:1.35}
.toc button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.toc button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.toc .n{flex:0 0 24px;height:24px;border-radius:7px;display:grid;place-items:center;font:600 12px var(--mono);background:rgba(255,255,255,.06)}
.toc .done .n{background:var(--c);color:#061019}
.doc{min-width:0;padding:30px clamp(18px,3vw,40px);border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.doc .kick{font:600 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.doc h2{font-size:clamp(26px,3vw,36px);margin:8px 0 18px}
.doc h3{font-size:20px;margin:28px 0 10px}
.doc p,.doc li{color:#C9D0E2}
.doc strong{color:var(--text)}
.doc ul,.doc ol{padding-left:22px}
.doc pre{background:#070B18;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;font:500 14px/1.6 var(--mono);color:#CFE0FF}
.tbl{overflow:auto;margin:14px 0;border-radius:12px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:420px}
.tbl th{background:var(--panel2);text-align:left;padding:10px 12px;font-weight:600}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);color:#C9D0E2}
.formula{margin:14px 0;padding:14px 16px;border-radius:12px;background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.25);font:600 16px var(--mono);color:#CFE0FF}
.tip,.warn{margin:14px 0;padding:13px 16px;border-radius:12px;font-size:15px}
.tip{background:rgba(46,242,197,.07);border:1px solid rgba(46,242,197,.25)}
.warn{background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.3)}
.tip b,.warn b{margin-right:6px}
.exs{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.exi{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.exi .q{display:flex;gap:12px;padding:14px 16px}
.exi .q b{flex:0 0 auto;font:600 13px var(--mono);color:var(--c);padding-top:3px}
.exi details{border-top:1px solid var(--line)}
.exi summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--mint);font-size:14.5px}
.exi .a{padding:0 16px 14px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn.ok{border-color:var(--mint);color:var(--mint)}
.qi{margin:16px 0;padding:16px;border-radius:14px;border:1px solid var(--line)}
.qi p{margin:0 0 10px;color:var(--text);font-weight:600}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.02);cursor:pointer}
.opts button.ok{border-color:var(--mint);background:rgba(46,242,197,.1)}
.opts button.ko{border-color:var(--danger);background:rgba(255,92,108,.1)}
.expl{margin-top:10px;font-size:14.5px;color:var(--muted)}
@media (max-width:1000px){.course{grid-template-columns:minmax(0,1fr)}.toc{position:static;max-height:none;flex-direction:row;overflow:auto}.toc button{flex:0 0 auto;max-width:240px}}

/* démos interactives */
.demo{margin:16px 0;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:#F4F6FB;color:#111}
.demo .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid #E1E5EF}
.demo .row:first-child{border-top:0}
.demo code{font:600 13.5px var(--mono);color:#1E3A8A;word-break:break-all}
.demo input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=color]){max-width:100%}
.demo .out{grid-column:1/-1;}@media (max-width:600px){.demo .row{grid-template-columns:1fr;gap:6px}}
.demo .out{font:500 12.5px var(--mono);color:#555}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px}
.colors button{display:flex;flex-direction:column;align-items:stretch;border:1px solid #DDE2EE;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;text-align:left}
.colors .sw{height:54px}
.colors span{padding:7px 10px;font:600 12.5px var(--mono);color:#222}
.colors span small{display:block;font-weight:500;color:#666}
.mixer{display:grid;gap:8px;padding:14px;border-top:1px solid #E1E5EF}
.mixer label{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:10px;font:600 13px var(--mono)}
.mixer .res{height:60px;border-radius:12px;display:grid;place-items:center;font:700 16px var(--mono)}

/* emploi du temps */
.sched{overflow:auto;border-radius:16px;border:1px solid var(--line);margin-top:18px}
.sched table{border-collapse:collapse;width:100%;min-width:760px}
.sched th,.sched td{border-top:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
.sched th{background:var(--panel2);font-size:14px}
.sched th.now{color:var(--mint)}
.sched td.h{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.slot{display:block;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent);border-left:3px solid var(--c);font-weight:600;font-size:14px}

/* admin */
.admin{max-width:900px;margin:0 auto;padding:40px 22px 80px}
.panel{padding:24px;border-radius:20px;border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.panel h2{font-size:24px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kpis div{padding:14px;border-radius:14px;background:var(--ink2);border:1px solid var(--line)}
.kpis b{display:block;font:700 28px var(--display)}
.kpis span{font-size:13px;color:var(--muted)}
.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.urow small{display:block;color:var(--dim);font:500 12.5px var(--mono)}
.pwd{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.pwd .field{flex:1;min-width:220px;margin:0}
.boot{display:grid;place-items:center;min-height:100vh;color:var(--muted);font:500 14px var(--mono);letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;z-index:99;font-size:14.5px}

</style>
</head>
<body>

    s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);

  deck.position.set(0, 0.155, -0.42); laptop.add(deck);

    "", ".carte { border-radius: 16px; }", "const parcours = 16;"]);
  const COL = ["#8A93AD", "#5B8CFF", "#E8ECF7", "#C9D3EE", "#5B8CFF", "", "#FFB547", "#E8ECF7", "", "#2EF2C5", "", "#FF5DA2", "#2EF2C5"];
  function drawScreen(t) {

function md(src) {
  const L = src.replace(/^\n+|\n+$/g, "").split("\n"); let h = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.trim() === ":::") { const c = []; i++; while (i < L.length && L[i].trim() !== ":::") { c.push(L[i]); i++; } i++; h += `<pre><code>${esc(c.join("\n"))}</code></pre>`; continue; }
    if (l.startsWith("@demo:")) { h += `<div data-demo="${esc(l.slice(6).trim())}"></div>`; i++; continue; }
    if (l.startsWith("## ")) { h += `<h3>${inl(l.slice(3))}</h3>`; i++; continue; }
    if (l.startsWith("|")) { const rows = []; while (i < L.length && L[i].startsWith("|")) { rows.push(L[i].replace(/^\||\|$/g, "").split("|")); i++; }
      h += `<div class="tbl"><table><thead><tr>${rows[0].map(c => `<th>${inl(c.trim())}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inl(c.trim())}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
    if (l.startsWith("- ")) { const it = []; while (i < L.length && L[i].startsWith("- ")) { it.push(L[i].slice(2)); i++; } h += `<ul>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { const it = []; while (i < L.length && /^\d+\. /.test(L[i])) { it.push(L[i].replace(/^\d+\. /, "")); i++; } h += `<ol>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ol>`; continue; }
    if (l.startsWith("= ")) { h += `<div class="formula">${inl(l.slice(2))}</div>`; i++; continue; }
    if (l.startsWith("> ")) { h += `<div class="tip"><b>Astuce</b>${inl(l.slice(2).replace(/^Astuce\s*:\s*/, ""))}</div>`; i++; continue; }
    if (l.startsWith("! ")) { h += `<div class="warn"><b>Attention</b>${inl(l.slice(2))}</div>`; i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(## |\||- |\d+\. |= |> |! |:::|@demo:)/.test(L[i])) { p.push(L[i]); i++; }
    h += `<p>${inl(p.join(" "))}</p>`;
  }
  return h;
}

  let h = `<table><thead><tr><th>Horaire</th>${DAYS.map((d, i) => `<th class="${i === todayIdx ? "now" : ""}">${d}</th>`).join("")}</tr></thead><tbody>`;
  HOURS.forEach(hr => { h += `<tr><td class="h">${hr}</td>`; DAYS.forEach(d => { const s = SCHOOL.find(x => x.jour === d && x.heure === hr); h += `<td>${s ? `<a class="slot" style="--c:${s.couleur}" href="#m-${s.id}">${esc(s.nom)}</a>` : ""}</td>`; }); h += "</tr>"; });
  app.innerHTML = header("emploi") + `<section class="section"><div class="wrap"><div class="eyebrow">2ᵉ année · DT Informatique et Webmaster</div><h1 style="font-size:clamp(34px,5vw,54px);margin-top:12px">Emploi du temps</h1><p class="muted">Touche un cours pour l'ouvrir.</p><div class="sched">${h}</tbody></table></div></div></section>` + footer();
  wire(); scrollTo(0, 0);
}
async function renderSubject(s, ch) {
  if (!COURSES[s.id]) {
    app.innerHTML = header() + `<div class="admin"><div class="panel"><h2>${esc(s.nom)}</h2><p class="muted">Chargement du cours…</p></div></div>`; wire();
    try { const snap = await getDoc(doc(db, "courses", s.id)); if (snap.exists()) COURSES[s.id] = snap.data(); }
    catch (e) { if (e.code === "permission-denied") return kicked("Le mot de passe a changé. Demande le nouveau à l'administrateur."); }
    if (!COURSES[s.id]) { app.innerHTML = header() + `<div class="admin"><div class="panel"><h2>${esc(s.nom)}</h2><p class="muted">Ce cours n'est pas encore disponible. Réessaie plus tard.</p><a class="btn" href="#accueil">Retour</a></div></div>`; wire(); return; }
  }
  drawSubject(s, COURSES[s.id], ch);
}
function drawSubject(s, c, ch) {
  const total = c.chapitres.length, isQuiz = ch === total, R = s.role;
  const toc = c.chapitres.map((x, i) => { const d = P.done[s.id + ":" + i]; return `<button type="button" data-i="${i}" class="${i === ch ? "on" : ""} ${d ? "done" : ""}"><span class="n">${d ? "✓" : i + 1}</span>${esc(x.t)}</button>`; }).join("") + `<button type="button" data-i="${total}" class="${isQuiz ? "on" : ""}"><span class="n">?</span>Quiz final</button>`;
  let body;
  if (isQuiz) body = `<div class="kick">Quiz · ${c.quiz.length} questions</div><h2>Teste-toi en ${esc(s.nom)}</h2>${c.quiz.map((q, qi) => `<div class="qi" data-qi="${qi}"><p>${qi + 1}. ${esc(q.q)}</p><div class="opts">${q.o.map((o, oi) => `<button type="button" data-oi="${oi}">${esc(o)}</button>`).join("")}</div><div class="expl" hidden></div></div>`).join("")}<div class="pager"><b id="score" style="font:700 20px var(--display)"></b><button class="btn" type="button" id="redo">Recommencer</button></div>`;
  else { const x = c.chapitres[ch], k = s.id + ":" + ch;
    body = `<div class="kick">Leçon ${ch + 1} sur ${total}</div><h2>${esc(x.t)}</h2>${md(x.c)}
    <div class="exs"><h3>Exercices corrigés</h3>${x.ex.map((e, i) => `<div class="exi"><div class="q"><b>EX. ${i + 1}</b><div>${inl(e.q)}</div></div><details><summary>Voir la correction expliquée</summary><div class="a">${answer(e.r)}</div></details></div>`).join("")}</div>
    <div class="pager">${ch > 0 ? `<button class="btn" data-go="${ch - 1}">← Précédent</button>` : "<span></span>"}<button class="btn ${P.done[k] ? "ok" : ""}" id="done">${P.done[k] ? "✓ Leçon terminée" : "Marquer comme terminée"}</button><button class="btn primary" data-go="${ch + 1}">${ch + 1 < total ? "Leçon suivante →" : "Passer au quiz →"}</button></div>`; }
  app.innerHTML = header() + `<div class="shead" style="--c:${s.couleur}"><div class="wrap"><a class="back" href="#parcours">← Tous les parcours</a><h1>${esc(s.nom)}</h1><p class="intro">${esc(s.intro)}</p>
    <div class="chips"><span class="chip"><i></i>${s.jour === "Libre" ? "Ouvert à tous" : esc(s.jour + " · " + s.heure)}</span><span class="chip">${total} leçons</span><span class="chip">${pct(s)} % terminé</span>${P.quiz[s.id] != null ? `<span class="chip">Meilleur quiz : ${P.quiz[s.id]}/${c.quiz.length}</span>` : ""}</div></div></div>
    <div class="wrap" style="--c:${s.couleur}">${R ? `<div class="role"><div><h3>À quoi ça sert ?</h3><p>${esc(R.sert)}</p></div><div><h3>Tu sauras</h3><ul>${R.savoir.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>Les métiers</h3><ul>${R.metiers.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>` : ""}
    <div class="course"><nav class="toc" aria-label="Leçons">${toc}</nav><article class="doc">${body}</article></div></div>` + footer();
  wire(); mountDemos(app);
  document.querySelectorAll(".toc button,[data-go]").forEach(b => b.onclick = () => { drawSubject(s, c, +(b.dataset.i ?? b.dataset.go)); $(".course").scrollIntoView({ behavior: "smooth" }); });
  const d = $("#done"); if (d) d.onclick = () => { const k = s.id + ":" + ch; P.done[k] = !P.done[k]; save(); drawSubject(s, c, ch); };
  if (isQuiz) { let ans = 0, ok = 0;
    document.querySelectorAll(".qi").forEach(it => { const q = c.quiz[+it.dataset.qi]; it.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (it.dataset.done) return; it.dataset.done = 1; ans++; const oi = +b.dataset.oi;
      if (oi === q.a) { b.classList.add("ok"); ok++; } else { b.classList.add("ko"); it.querySelector(`[data-oi="${q.a}"]`).classList.add("ok"); }
      const ex = it.querySelector(".expl"); ex.hidden = false; ex.textContent = (oi === q.a ? "Bonne réponse. " : "Mauvaise réponse. ") + q.e;
      if (ans === c.quiz.length) { $("#score").textContent = `Score : ${ok} / ${c.quiz.length}`; P.quiz[s.id] = Math.max(ok, P.quiz[s.id] || 0); save(); } }); });
    $("#redo").onclick = () => drawSubject(s, c, total); }
}

/* ------------ espace administrateur ------------ */
/* L'adresse administrateur n'est pas écrite dans le site : elle est vérifiée par les règles Firebase. */
const signedIn = () => auth.currentUser && !auth.currentUser.isAnonymous;
function adminShell(inner) { MODE = "admin"; app.innerHTML = `<header class="top"><div class="wrap">${brand("Espace administrateur")}<nav class="nav"><button id="aout">Quitter</button></nav></div></header><main class="admin">${inner}</main>`; $("#aout").onclick = async () => { await signOut(auth); history.replaceState(null, "", location.pathname); renderGate(); }; }
const ERR = { "auth/invalid-credential": "E-mail ou mot de passe incorrect.", "auth/invalid-email": "Adresse e-mail invalide.", "auth/wrong-password": "Mot de passe incorrect.", "auth/user-not-found": "Ce compte n'existe pas encore : crée-le.", "auth/email-already-in-use": "Ce compte existe déjà : connecte-toi.", "auth/weak-password": "Mot de passe trop court (8 caractères minimum).", "auth/too-many-requests": "Trop d'essais. Attends quelques minutes.", "auth/network-request-failed": "Pas de connexion Internet." };
function renderAdminLogin(msg = "") {
  adminShell(`<div class="panel" style="max-width:480px;margin:30px auto">
    <div class="eyebrow">Réservé à l'administrateur</div><h2 style="margin-top:10px">Connexion administrateur</h2>
    <p class="muted" style="margin:0 0 18px">Seule l'adresse e-mail de l'administrateur, enregistrée dans Firebase, peut gérer le mot de passe et les accès.</p>
    <form id="fa"><div class="field"><label for="a-em">E-mail administrateur</label><input id="a-em" type="email" required autocomplete="username"></div>
      <div class="field"><label for="a-pw">Mot de passe administrateur</label><input id="a-pw" type="password" required minlength="8" autocomplete="current-password"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" type="submit">Se connecter</button><button class="btn" type="button" id="a-create">Créer le compte admin</button></div>
      <p class="msg ${msg ? "err" : ""}" id="a-msg">${esc(msg)}</p></form>
    <button class="link" id="a-reset" type="button">J'ai oublié mon mot de passe administrateur</button>
    <p style="margin-top:10px"><button class="link" id="a-back" type="button">← Retour à l'entrée</button></p></div>`);
  const m = $("#a-msg"), say = (t, ok) => { m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); };
  const em = () => $("#a-em").value.trim().toLowerCase();
  $("#a-back").onclick = () => { history.replaceState(null, "", location.pathname); renderGate(); };
  $("#fa").addEventListener("submit", async e => { e.preventDefault(); try { if (auth.currentUser) await signOut(auth); await signInWithEmailAndPassword(auth, em(), $("#a-pw").value); adminRoute(); } catch (err) { say(ERR[err.code] || err.code); } });
  $("#a-create").onclick = async () => { const pw = $("#a-pw").value; if (!em()) return say("Écris d'abord l'e-mail administrateur."); if (pw.length < 8) return say("Choisis un mot de passe admin de 8 caractères minimum.");
    try { if (auth.currentUser) await signOut(auth); const c = await createUserWithEmailAndPassword(auth, em(), pw); await sendEmailVerification(c.user); adminRoute(); } catch (err) { say(ERR[err.code] || err.code); } };
  $("#a-reset").onclick = async () => { if (!em()) return say("Écris d'abord l'e-mail administrateur."); try { await sendPasswordResetEmail(auth, em()); say("Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé.", true); } catch (err) { say(ERR[err.code] || err.code); } };
}
async function adminRoute() {
  if (!signedIn()) return renderAdminLogin();
  await auth.currentUser.reload();
  if (!auth.currentUser.emailVerified) {
    adminShell(`<div class="panel" style="max-width:520px;margin:30px auto"><div class="eyebrow">Étape 1</div><h2 style="margin-top:10px">Confirme ton e-mail</h2>
      <p class="muted">Un lien a été envoyé à <b>${esc(auth.currentUser.email)}</b>. Ouvre ta boîte mail (regarde aussi les spams), touche le lien, puis reviens ici.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="v-ok">J'ai confirmé</button><button class="btn" id="v-re">Renvoyer l'e-mail</button></div><p class="msg" id="v-msg"></p></div>`);
    $("#v-ok").onclick = async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); if (auth.currentUser.emailVerified) adminRoute(); else { $("#v-msg").className = "msg err"; $("#v-msg").textContent = "Pas encore confirmé."; } };
    $("#v-re").onclick = async () => { try { await sendEmailVerification(auth.currentUser); $("#v-msg").className = "msg ok"; $("#v-msg").textContent = "E-mail renvoyé."; } catch (e) {} };
    return;
  }
  await auth.currentUser.getIdToken(true);
  adminShell(`<div class="panel"><p class="muted">Chargement…</p></div>`);
  let cfg = null, members = [], reqs = [], nCourses = 0;
  try { const c = await getDoc(doc(db, "config", "access")); cfg = c.exists() ? c.data() : null; }
  catch (e) { return adminShell(`<div class="panel"><h2>Accès refusé</h2><p class="muted">Ce compte n'est pas l'administrateur, ou les règles Firebase ne sont pas encore publiées.</p></div>`); }
  try { members = (await getDocs(collection(db, "members"))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}
  try { reqs = (await getDocs(collection(db, "requests"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0)); } catch (e) {}
  try { nCourses = (await getDocs(collection(db, "courses"))).size; } catch (e) {}
  const valid = members.filter(m => cfg && m.pw === cfg.pw).sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
  const when = x => x?.seconds ? new Date(x.seconds * 1000).toLocaleString("fr-FR") : "";
  adminShell(`
    <div class="panel"><div class="eyebrow">Tableau de bord</div><h2 style="margin-top:10px">Bonjour Mouhamed</h2>
      <div class="kpis"><div><b>${valid.length}</b><span>personnes connectées</span></div><div><b>${reqs.length}</b><span>demandes d'accès</span></div><div><b>${nCourses}/${SUBJECTS.length}</b><span>parcours importés</span></div></div></div>
    <div class="panel"><h2>Mot de passe d'accès</h2><p class="muted">Changer le mot de passe <b>déconnecte tout le monde</b>. Seules les personnes à qui tu donnes le nouveau pourront revenir.</p>
      ${cfg ? `<p>Mot de passe actuel : <code class="mono" id="cur" style="filter:blur(5px);cursor:pointer" title="Toucher pour afficher">${esc(cfg.pw)}</code></p>` : `<p class="msg err">Aucun mot de passe défini : le site est fermé. Active l'accès ci-dessous.</p>`}
      <div class="pwd"><div class="field"><label for="np">Nouveau mot de passe</label><input id="np" value="${cfg ? "" : "webmaster2003"}" minlength="6"></div><button class="btn primary" id="setpw">${cfg ? "Changer et déconnecter tout le monde" : "Activer l'accès"}</button></div><p class="msg" id="pmsg"></p></div>
    <div class="panel"><h2>Demandes « mot de passe oublié »</h2>
      ${reqs.length ? reqs.map(r => `<div class="urow"><div><b>${esc(r.nom)}</b><small>${when(r.at)}</small></div><button class="btn small" data-req="${r.id}">Traité</button></div>`).join("") : `<p class="muted">Aucune demande.</p>`}</div>
    <div class="panel"><h2>Personnes connectées</h2><p class="muted">Touche « Déconnecter » pour retirer l'accès à quelqu'un. Il devra redemander le mot de passe.</p>
      ${valid.length ? valid.map(m => `<div class="urow"><div><b>${esc(m.nom)}</b><small>${m.ua || ""}${m.at ? " · entré le " + when(m.at) : ""}</small></div><button class="btn small danger" data-kick="${m.id}">Déconnecter</button></div>`).join("") : `<p class="muted">Personne pour le moment.</p>`}</div>
    <div class="panel"><h2>Importer les cours</h2><p class="muted">Choisis le fichier <b>cours-webmaster-academy.json</b>. À refaire seulement quand tu reçois une mise à jour des cours.</p><input type="file" id="cf" accept=".json,application/json"><p class="msg" id="cmsg"></p></div>`);
  const cur = $("#cur"); if (cur) cur.onclick = () => cur.style.filter = "none";
  $("#setpw").onclick = async () => { const v = $("#np").value.trim(); const pm = $("#pmsg"); if (v.length < 6) { pm.className = "msg err"; pm.textContent = "6 caractères minimum."; return; }
    try { await setDoc(doc(db, "config", "access"), { pw: v, changedAt: serverTimestamp() }); toast("Mot de passe enregistré."); adminRoute(); } catch (e) { pm.className = "msg err"; pm.textContent = "Erreur : " + e.code; } };
  document.querySelectorAll("[data-kick]").forEach(b => b.onclick = async () => { b.disabled = true; try { await deleteDoc(doc(db, "members", b.dataset.kick)); toast("Personne déconnectée."); adminRoute(); } catch (e) { b.textContent = "Erreur"; } });
  document.querySelectorAll("[data-req]").forEach(b => b.onclick = async () => { b.disabled = true; try { await deleteDoc(doc(db, "requests", b.dataset.req)); adminRoute(); } catch (e) { b.textContent = "Erreur"; } });
  $("#cf").onchange = async e => { const f = e.target.files[0]; if (!f) return; const cm = $("#cmsg");
    try { const list = JSON.parse(await f.text()); if (!Array.isArray(list) || !list[0]?.chapitres) throw 0;
      for (let i = 0; i < list.length; i += 6) { const b = writeBatch(db); list.slice(i, i + 6).forEach(c => b.set(doc(db, "courses", c.id), c)); await b.commit(); }
      cm.className = "msg ok"; cm.textContent = list.length + " parcours importés."; setTimeout(adminRoute, 900);
    } catch (err) { cm.className = "msg err"; cm.textContent = "Import refusé : vérifie le fichier et les règles Firestore."; } };
}

/* ------------ routeur ------------ */
function route() {
  const h = (location.hash || "").slice(1);
  if (h === "admin") return adminRoute();
  if (MODE !== "site") { if (MODE === "admin") renderGate(); return; }
  if (h.startsWith("m-") && byId[h.slice(2)]) { renderSubject(byId[h.slice(2)], 0); scrollTo(0, 0); return; }
  if (h === "emploi") return renderSchedule();
  renderHome(["parcours", "fondateur"].includes(h) ? h : null);
}
addEventListener("hashchange", route);
let started = false;
onAuthStateChanged(auth, async user => {
  if (started) return; started = true;
  if ((location.hash || "") === "#admin") return adminRoute();
  if (user && user.isAnonymous) {
    try { const s = await getDoc(doc(db, "members", user.uid)); if (s.exists()) { await getDoc(doc(db, "courses", "debuter")); return enterSite(); } } catch (e) {}
  }
  renderGate();
});

</script>
</body>
