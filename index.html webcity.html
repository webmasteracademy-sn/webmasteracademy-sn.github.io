<script>
const SUBJECTS=[];function S(o){SUBJECTS.push(o)}
function A(id,x){const s=SUBJECTS.find(v=>v.id===id);s.chapitres.push(...x.chapitres);s.quiz.push(...x.quiz)}
S({id:"electronique",nom:"Électronique",jour:"Lundi",heure:"8h – 10h",couleur:"#F2A93B",icone:"chip",
intro:"Les composants qui font vivre un ordinateur : résistances, condensateurs, diodes, transistors et portes logiques.",
chapitres:[
{t:"Les grandeurs de base",c:`
L'électronique étudie le déplacement contrôlé des électrons dans des composants pour traiter un signal ou de l'information.

## Les quatre grandeurs à connaître
|Grandeur|Symbole|Unité|Appareil de mesure|
|Tension|U|Volt (V)|Voltmètre, en parallèle|
|Intensité|I|Ampère (A)|Ampèremètre, en série|
|Résistance|R|Ohm (Ω)|Ohmmètre, circuit hors tension|
|Puissance|P|Watt (W)|Wattmètre|

## Loi d'Ohm
= U = R × I
On en déduit : I = U / R et R = U / I.

## Puissance électrique
= P = U × I = R × I² = U² / R

## Les multiples et sous-multiples
- 1 kΩ = 1 000 Ω ; 1 MΩ = 1 000 000 Ω
- 1 mA = 0,001 A ; 1 µA = 0,000 001 A
- 1 mV = 0,001 V

> Astuce : avec le multimètre, commence toujours sur le calibre le plus grand, puis descends.
`,ex:[
{q:"Une résistance de 220 Ω est traversée par un courant de 20 mA. Calcule la tension à ses bornes et la puissance dissipée.",r:"U = R × I = 220 × 0,020 = **4,4 V**. P = U × I = 4,4 × 0,020 = **0,088 W** (88 mW). Une résistance de 1/4 W suffit."},
{q:"Une LED est alimentée sous 5 V avec une résistance de protection. On veut 15 mA et la LED consomme 2 V. Quelle résistance choisir ?",r:"La résistance reçoit 5 − 2 = 3 V. R = U / I = 3 / 0,015 = **200 Ω**. On prend la valeur normalisée juste au-dessus : **220 Ω**."}]},
{t:"Les résistances",c:`
Une résistance limite le courant et crée des chutes de tension.

## Le code des couleurs
|Couleur|Chiffre|Multiplicateur|
|Noir|0|×1|
|Marron|1|×10|
|Rouge|2|×100|
|Orange|3|×1 k|
|Jaune|4|×10 k|
|Vert|5|×100 k|
|Bleu|6|×1 M|
|Violet|7|—|
|Gris|8|—|
|Blanc|9|—|
Tolérance : or = ±5 %, argent = ±10 %.

> Phrase pour retenir : « **N**e **M**angez **R**ien **O**u **J**eûnez, **V**oilà **B**ien **V**otre **G**rande **B**êtise ».

## Association en série
= Réq = R1 + R2 + R3…
Le même courant traverse toutes les résistances.

## Association en parallèle
= 1/Réq = 1/R1 + 1/R2 + … ; pour deux : Réq = (R1 × R2) / (R1 + R2)
La même tension est appliquée à toutes les résistances. Réq est toujours plus petite que la plus petite résistance.

## Le pont diviseur de tension
= Us = Ue × R2 / (R1 + R2)
Il sert à obtenir une tension plus faible à partir d'une tension d'alimentation.
`,ex:[
{q:"Lis la valeur : marron – noir – rouge – or.",r:"1, 0, ×100 → **1 000 Ω = 1 kΩ**, tolérance ±5 %."},
{q:"R1 = 1 kΩ et R2 = 1 kΩ en parallèle, puis en série avec R3 = 500 Ω. Calcule Réq.",r:"Parallèle : (1000 × 1000) / 2000 = 500 Ω. Puis série : 500 + 500 = **1 000 Ω**."},
{q:"Pont diviseur : Ue = 12 V, R1 = 10 kΩ, R2 = 5 kΩ. Calcule Us.",r:"Us = 12 × 5 / (10 + 5) = 12 × 1/3 = **4 V**."}]},
{t:"Condensateurs et bobines",c:`
## Le condensateur
Il **stocke des charges électriques**. Unité : le farad (F), souvent en µF, nF ou pF.
= Q = C × U   et   énergie E = ½ × C × U²
- Il laisse passer le courant alternatif et bloque le continu une fois chargé.
- Les condensateurs **électrolytiques** sont polarisés : respecter le + et le −.

## Le circuit RC
= Constante de temps : τ = R × C
- À t = τ, le condensateur est chargé à 63 %.
- À t = 5τ, il est considéré comme totalement chargé (99 %).

## La bobine (inductance)
Elle s'oppose aux variations du courant. Unité : le henry (H). On la trouve dans les alimentations à découpage et les filtres.

! Un gros condensateur peut rester chargé après l'arrêt d'un appareil : décharge-le avant d'intervenir sur une alimentation.
`,ex:[
{q:"R = 10 kΩ et C = 100 µF. Calcule τ et le temps de charge complète.",r:"τ = 10 000 × 0,0001 = **1 s**. Charge complète ≈ 5τ = **5 s**."},
{q:"Pourquoi trouve-t-on des condensateurs près du processeur sur une carte mère ?",r:"Pour **filtrer et stabiliser la tension** : ils absorbent les variations rapides de consommation du processeur."}]},
{t:"Les diodes",c:`
Une diode laisse passer le courant **dans un seul sens**, de l'anode (A) vers la cathode (K, marquée d'une bague).

## Caractéristiques
- Tension de seuil : environ **0,6 à 0,7 V** pour une diode silicium.
- En sens inverse, elle est bloquée (sauf la Zener).

## Les types de diodes
|Type|Rôle|
|Diode de redressement (1N4007)|Transformer l'alternatif en continu|
|LED|Émettre de la lumière (seuil 1,8 à 3,3 V)|
|Zener|Stabiliser une tension en inverse|
|Photodiode|Détecter la lumière|

## Le redressement
- **Simple alternance** : une diode, on garde une alternance sur deux.
- **Double alternance** : pont de 4 diodes (pont de Graetz), on garde les deux alternances.
Un condensateur de filtrage lisse ensuite la tension.
`,ex:[
{q:"Dans un pont de Graetz, combien de diodes conduisent en même temps ?",r:"**Deux diodes** conduisent pendant chaque alternance."},
{q:"Une LED rouge (2 V, 20 mA) est branchée sur 9 V. Calcule la résistance.",r:"R = (9 − 2) / 0,020 = **350 Ω** → on choisit **390 Ω** (valeur normalisée supérieure)."}]},
{t:"Le transistor",c:`
Le transistor est le composant de base de toute l'informatique : un processeur en contient des milliards.

## Le transistor bipolaire (NPN / PNP)
Trois broches : **Base (B)**, **Collecteur (C)**, **Émetteur (E)**.
= Ic = β × Ib (β = gain, souvent entre 100 et 300)

## Deux utilisations
- **En commutation** (interrupteur) : bloqué = 0, saturé = 1. C'est le mode utilisé en informatique.
- **En amplification** : un petit courant de base commande un grand courant de collecteur.

## Le MOSFET
Commandé en tension par la **grille**. Il chauffe peu et commute très vite : c'est lui qui forme les processeurs et la mémoire.
`,ex:[
{q:"β = 150 et Ib = 0,2 mA. Calcule Ic.",r:"Ic = 150 × 0,2 mA = **30 mA**."},
{q:"Pourquoi dit-on que le transistor fonctionne en « tout ou rien » dans un ordinateur ?",r:"Parce qu'il est utilisé comme **interrupteur** : bloqué (0) ou saturé (1). Ces deux états représentent les bits du binaire."}]},
{t:"Électronique numérique",c:`
## Le binaire
L'ordinateur ne connaît que 0 et 1. Un **bit** = 0 ou 1 ; un **octet** = 8 bits.

## Conversions
- Binaire → décimal : 1011 = 1×8 + 0×4 + 1×2 + 1×1 = **11**
- Décimal → binaire : divisions successives par 2, on lit les restes de bas en haut.
- Hexadécimal : base 16 (0–9 puis A–F). 1111 1111 = **FF** = 255.

## Les portes logiques
|Porte|Sortie à 1 si…|Équation|
|ET (AND)|toutes les entrées sont à 1|S = A·B|
|OU (OR)|au moins une entrée est à 1|S = A + B|
|NON (NOT)|l'entrée est à 0|S = Ā|
|NAND|pas toutes à 1|S = (A·B)barre|
|XOR|les entrées sont différentes|S = A ⊕ B|

> La porte NAND est dite universelle : on peut construire toutes les autres avec elle.
`,ex:[
{q:"Convertis 45 en binaire.",r:"45 = 32 + 8 + 4 + 1 → **101101**."},
{q:"Complète la table de vérité de la porte XOR.",r:"A=0 B=0 → 0 ; A=0 B=1 → 1 ; A=1 B=0 → 1 ; A=1 B=1 → **0**."},
{q:"Convertis 1010 1100 en hexadécimal.",r:"1010 = A, 1100 = C → **AC** (soit 172 en décimal)."}]}],
quiz:[
{q:"La loi d'Ohm s'écrit :",o:["P = U × I","U = R × I","I = R × U","R = U × I"],a:1,e:"U = R × I."},
{q:"Deux résistances de 100 Ω en parallèle donnent :",o:["200 Ω","100 Ω","50 Ω","25 Ω"],a:2,e:"(100×100)/200 = 50 Ω."},
{q:"La tension de seuil d'une diode silicium est d'environ :",o:["0,2 V","0,7 V","2 V","5 V"],a:1,e:"Environ 0,6 à 0,7 V."},
{q:"Un octet contient :",o:["4 bits","8 bits","16 bits","1024 bits"],a:1,e:"1 octet = 8 bits."},
{q:"Quelle porte donne 1 seulement si les deux entrées sont à 1 ?",o:["OU","XOR","ET","NON"],a:2,e:"C'est la porte ET (AND)."}]});

S({id:"entreprenariat",nom:"Entreprenariat",jour:"Lundi",heure:"16h – 18h",couleur:"#3CC8B4",icone:"rocket",
intro:"De l'idée à l'entreprise : étude de marché, business plan, création au Sénégal, financement et gestion.",
chapitres:[
{t:"L'entrepreneur et l'idée",c:`
Un **entrepreneur** est une personne qui repère un besoin, prend un risque et crée une activité pour y répondre.

## Les qualités d'un entrepreneur
- Persévérance et gestion de l'échec
- Sens de l'organisation
- Créativité et esprit d'initiative
- Capacité à convaincre (clients, partenaires, financeurs)

## Trouver une idée
- Partir d'un **problème** que vivent les gens autour de toi.
- Utiliser tes compétences (informatique, design, réparation…).
- Améliorer un produit qui existe déjà (moins cher, plus rapide, plus proche).

> Exemple local : beaucoup de commerçants de Thiès n'ont pas de site. Une offre « site vitrine + page WhatsApp Business » à petit prix répond à un vrai besoin.
`,ex:[
{q:"Cite trois idées d'entreprise qu'un technicien en informatique peut créer.",r:"Exemples : **maintenance et réparation** d'ordinateurs et téléphones ; **création de sites web** pour les commerces ; **cyber-service** (saisie, impression, démarches en ligne) ; formation en bureautique."},
{q:"Quelle est la différence entre une idée et une opportunité ?",r:"Une **idée** est une simple proposition. Elle devient une **opportunité** quand il existe des clients prêts à payer et qu'elle est réalisable avec les moyens disponibles."}]},
{t:"L'étude de marché",c:`
Elle permet de vérifier qu'il y a des clients avant d'investir.

## Les éléments à étudier
- **La demande** : qui sont les clients, combien sont-ils, que veulent-ils, quel prix acceptent-ils ?
- **L'offre** : qui sont les concurrents, leurs prix, leurs points forts et faibles ?
- **L'environnement** : lois, saison, technologies.

## Les outils
- Questionnaire (Google Forms, papier)
- Entretiens avec des clients
- Observation sur le terrain
- Recherche sur Internet

## L'analyse SWOT
|Interne|Externe|
|Forces (Strengths)|Opportunités (Opportunities)|
|Faiblesses (Weaknesses)|Menaces (Threats)|
`,ex:[
{q:"Fais l'analyse SWOT d'un atelier de réparation de téléphones à Thiès.",r:"**Forces** : compétences techniques, prix bas. **Faiblesses** : peu de capital, pas de local. **Opportunités** : beaucoup de smartphones, peu de réparateurs fiables. **Menaces** : concurrence du marché, pièces de mauvaise qualité."},
{q:"Pourquoi ne faut-il pas interroger seulement ses amis ?",r:"Parce que leurs réponses sont **biaisées** (ils veulent te faire plaisir) et ne représentent pas tous les clients."}]},
{t:"Le business plan et le Business Model Canvas",c:`
Le **business plan** est le document qui présente le projet à un banquier ou un financeur.

## Le plan type
1. Résumé du projet
2. Présentation du porteur
3. Étude de marché
4. Stratégie commerciale (prix, communication, distribution)
5. Moyens (matériel, local, personnel)
6. Prévisions financières sur 3 ans

## Le Business Model Canvas (9 blocs)
- Segments de clients
- Proposition de valeur
- Canaux
- Relation client
- Sources de revenus
- Ressources clés
- Activités clés
- Partenaires clés
- Structure de coûts

> Le canvas tient sur une seule page : idéal pour présenter rapidement son idée.
`,ex:[
{q:"Remplis la « proposition de valeur » d'une entreprise de création de sites web pour commerçants.",r:"Exemple : « Un site professionnel et une boutique WhatsApp **prêts en 7 jours**, à prix abordable, avec formation pour le gérer soi-même »."},
{q:"Quelle partie du business plan intéresse le plus un banquier ?",r:"Les **prévisions financières** : il veut savoir si l'entreprise pourra rembourser le prêt."}]},
{t:"Créer son entreprise au Sénégal",c:`
Au Sénégal, les formes d'entreprise sont fixées par le droit **OHADA**.

## Les principales formes
|Forme|Nombre d'associés|Particularité|
|Entreprise individuelle (EI)|1|Simple, mais le patrimoine personnel est engagé|
|SUARL|1|Société à un seul associé, responsabilité limitée aux apports|
|SARL|2 et plus|Responsabilité limitée aux apports|
|SA|1 et plus|Pour les grands projets, capital plus élevé|
|GIE|2 et plus|Regroupement pour mutualiser des moyens|

## Les démarches
- Guichet unique : **APIX** (création en ligne possible).
- Immatriculation au **RCCM** (Registre du commerce).
- Obtention du **NINEA** (numéro d'identification fiscale).

> Vérifie toujours les montants et conditions actuels sur le site de l'APIX, car ils peuvent changer.
`,ex:[
{q:"Tu veux créer seul ton entreprise en protégeant tes biens personnels. Quelle forme choisir ?",r:"La **SUARL** : un seul associé, et la responsabilité est limitée aux apports."},
{q:"Que signifient RCCM et NINEA ?",r:"**RCCM** : Registre du Commerce et du Crédit Mobilier. **NINEA** : Numéro d'Identification National des Entreprises et des Associations."}]},
{t:"Financer son projet",c:`
## Les sources de financement
- **Apport personnel** : économies, famille (« love money »).
- **Microfinance** : petits prêts, plus accessibles que la banque.
- **Banque** : demande un business plan et souvent des garanties.
- **Programmes publics** : par exemple la DER/FJ (Délégation à l'Entrepreneuriat Rapide des Femmes et des Jeunes).
- **Concours et incubateurs** : prix, accompagnement, réseau.
- **Financement participatif** (crowdfunding).

## Les besoins à financer
- **Investissements** : matériel, ordinateurs, local.
- **Fonds de roulement** : argent pour tenir les premiers mois (stock, salaires, loyer).
`,ex:[
{q:"Pourquoi faut-il prévoir un fonds de roulement ?",r:"Parce que les clients ne paient pas tout de suite et que les ventes démarrent lentement. Sans réserve, l'entreprise ne peut plus payer **loyer, stock et salaires**."},
{q:"Classe ces besoins : ordinateur, loyer du mois, imprimante, achat de papier.",r:"**Investissements** : ordinateur, imprimante. **Fonds de roulement** : loyer du mois, achat de papier."}]},
{t:"Gestion et rentabilité",c:`
## Les notions de base
- **Chiffre d'affaires (CA)** = prix de vente × quantité vendue
- **Charges fixes** : ne changent pas avec les ventes (loyer, abonnement Internet, salaires fixes).
- **Charges variables** : augmentent avec les ventes (matières, pièces détachées).
= Bénéfice = Chiffre d'affaires − Total des charges

## Le seuil de rentabilité
C'est le chiffre d'affaires à partir duquel l'entreprise ne perd plus d'argent.
= Marge sur coût variable (MCV) = CA − charges variables
= Seuil de rentabilité = Charges fixes / (MCV / CA)
`,ex:[
{q:"Un cyber réalise 600 000 FCFA de CA par mois. Charges fixes : 250 000 FCFA. Charges variables : 150 000 FCFA. Calcule le bénéfice.",r:"Bénéfice = 600 000 − (250 000 + 150 000) = **200 000 FCFA**."},
{q:"Avec les mêmes chiffres, calcule le seuil de rentabilité.",r:"MCV = 600 000 − 150 000 = 450 000. Taux de MCV = 450 000 / 600 000 = 0,75. Seuil = 250 000 / 0,75 = **333 333 FCFA** de CA par mois."}]}],
quiz:[
{q:"Combien d'associés dans une SUARL ?",o:["Un seul","Deux","Sept","Illimité"],a:0,e:"SUARL = un seul associé."},
{q:"Le guichet unique de création d'entreprise au Sénégal est :",o:["La Senelec","L'APIX","La Sonatel","Le Trésor"],a:1,e:"L'APIX."},
{q:"Le loyer est une charge :",o:["Variable","Fixe","Exceptionnelle","Nulle"],a:1,e:"Il ne dépend pas des ventes."},
{q:"Dans SWOT, le « T » signifie :",o:["Technique","Temps","Menaces","Tarifs"],a:2,e:"Threats = menaces."},
{q:"Le document présenté au banquier est :",o:["Le CV","Le business plan","La facture","Le RCCM"],a:1,e:"Le business plan."}]});

S({id:"maintenance",nom:"Maintenance",jour:"Mardi",heure:"10h – 12h",couleur:"#5B8CFF",icone:"board",
intro:"L'ordinateur de l'intérieur : carte mère, processeur, mémoire, stockage, installation et dépannage.",
chapitres:[
{t:"Architecture d'un ordinateur",c:`
Un ordinateur suit le **modèle de Von Neumann** : il reçoit des données, les traite, les stocke et les restitue.

## Les quatre blocs
- **Unité centrale de traitement** : le processeur (CPU).
- **Mémoire** : RAM (temporaire) et stockage (permanent).
- **Entrées** : clavier, souris, scanner, micro.
- **Sorties** : écran, imprimante, haut-parleurs.
Les **bus** relient tous ces éléments.

## Matériel et logiciel
- **Hardware** (matériel) : ce qu'on peut toucher.
- **Software** (logiciel) : les programmes, dont le système d'exploitation.
- **Firmware** : petit logiciel intégré au matériel (le BIOS/UEFI).
`,ex:[
{q:"Classe : clavier, écran tactile, imprimante, scanner, micro.",r:"**Entrées** : clavier, scanner, micro. **Sorties** : imprimante. **Entrée et sortie** : écran tactile."},
{q:"Quelle est la différence entre la RAM et le disque dur ?",r:"La **RAM** est rapide mais se vide à l'arrêt (volatile). Le **disque** est plus lent mais garde les données (permanent)."}]},
{t:"La carte mère",c:`
La **carte mère** est la carte principale : elle relie et alimente tous les composants.

## Les éléments de la carte mère
|Élément|Rôle|
|Socket|Support du processeur (ex. LGA 1700 pour Intel, AM5 pour AMD)|
|Chipset|Gère les échanges entre le processeur et les périphériques|
|Slots DIMM|Emplacements pour la mémoire RAM|
|Slots PCI Express|Carte graphique, carte réseau, SSD NVMe|
|Ports SATA|Disques durs et SSD SATA|
|Connecteur M.2|SSD au format barrette|
|Connecteur ATX 24 broches|Alimentation de la carte|
|Connecteur EPS 4/8 broches|Alimentation du processeur|
|Pile CMOS (CR2032)|Garde l'heure et les réglages du BIOS|
|BIOS / UEFI|Programme de démarrage et de configuration|
|Panneau arrière (I/O)|USB, réseau RJ45, audio, vidéo|

## Les formats
- **ATX** : 30,5 × 24,4 cm, le format standard.
- **Micro-ATX** : plus petit, moins de slots.
- **Mini-ITX** : 17 × 17 cm, pour les petits boîtiers.

## Le BIOS / UEFI
- Lance le **POST** (test des composants au démarrage).
- Permet de choisir l'**ordre de démarrage** (boot).
- L'UEFI est la version moderne : interface graphique, souris, disques de plus de 2 To (GPT), Secure Boot.

> Accès au BIOS : touche **Suppr**, **F2**, **F10** ou **Échap** au démarrage selon la marque.

! Retire toujours le câble d'alimentation et touche une partie métallique du boîtier avant de toucher la carte mère (électricité statique).
`,ex:[
{q:"L'ordinateur perd l'heure à chaque démarrage. Quelle pièce changer ?",r:"La **pile CMOS** (CR2032) de la carte mère est usée."},
{q:"Tu veux installer un SSD NVMe. Sur quel connecteur ?",r:"Sur le connecteur **M.2** (qui utilise les lignes PCI Express)."},
{q:"À quoi sert le chipset ?",r:"Il **gère la communication** entre le processeur, la mémoire, les ports USB, SATA, PCIe et les autres périphériques."}]},
{t:"Processeur et mémoire RAM",c:`
## Le processeur (CPU)
Il exécute les instructions des programmes.
- **Fréquence** en GHz : nombre de cycles par seconde.
- **Cœurs** : unités de calcul (4, 6, 8 cœurs…). **Threads** : tâches traitées en parallèle.
- **Mémoire cache** (L1, L2, L3) : très rapide, intégrée au processeur.
- Marques : **Intel** (Core i3, i5, i7, i9) et **AMD** (Ryzen 3, 5, 7, 9).
- Il doit être refroidi : **pâte thermique** + ventirad.

## La mémoire vive (RAM)
- Stocke les programmes en cours d'utilisation.
- Types : **DDR3, DDR4, DDR5** (non compatibles entre eux).
- Formats : **DIMM** (PC de bureau) et **SO-DIMM** (portables).
- **Dual channel** : deux barrettes identiques dans les bons slots = plus de vitesse.

## Unités de capacité
= 1 Ko = 1024 octets ; 1 Mo = 1024 Ko ; 1 Go = 1024 Mo ; 1 To = 1024 Go
`,ex:[
{q:"Peut-on mettre une barrette DDR5 dans une carte mère DDR4 ?",r:"**Non.** Les encoches sont placées différemment et les tensions ne sont pas les mêmes."},
{q:"Un PC a 8 Go de RAM en une barrette. Comment l'améliorer au mieux ?",r:"Ajouter **une deuxième barrette identique de 8 Go** pour passer à 16 Go en **dual channel**."}]},
{t:"Le stockage",c:`
|Type|Fonctionnement|Vitesse indicative|
|Disque dur (HDD)|Plateaux magnétiques qui tournent (5400 / 7200 tr/min)|100 à 200 Mo/s|
|SSD SATA|Mémoire flash, sans pièce mobile|jusqu'à environ 550 Mo/s|
|SSD NVMe (M.2)|Mémoire flash sur PCI Express|de 2 000 à plus de 7 000 Mo/s|

## Partitions et tables
- **MBR** : ancien, 4 partitions principales maximum, disques jusqu'à 2 To.
- **GPT** : moderne, utilisé avec l'UEFI, disques de plus de 2 To.

## Systèmes de fichiers
- **NTFS** : Windows.
- **FAT32** : clés USB, fichiers de 4 Go maximum.
- **exFAT** : clés et disques externes, gros fichiers.
- **ext4** : Linux.
`,ex:[
{q:"Un client veut que son vieux PC démarre plus vite. Que proposer ?",r:"Remplacer le disque dur par un **SSD** : le démarrage passe souvent de plus d'une minute à quelques secondes."},
{q:"Impossible de copier un film de 6 Go sur une clé USB. Pourquoi ?",r:"La clé est en **FAT32**, qui limite les fichiers à 4 Go. Il faut la formater en **exFAT** ou en NTFS (après avoir sauvegardé son contenu)."}]},
{t:"Installer un système d'exploitation",c:`
## Les étapes
1. Sauvegarder les données de l'utilisateur.
2. Créer une **clé USB d'installation** (outil Microsoft ou Rufus).
3. Démarrer sur la clé (menu de boot : F12, F11, Échap… ou ordre de boot dans le BIOS).
4. Choisir la partition et lancer l'installation.
5. Installer les **pilotes** (drivers) : chipset, carte graphique, réseau, audio.
6. Faire les mises à jour, installer l'antivirus et les logiciels.

## Les pilotes
Un pilote permet au système de communiquer avec un matériel. Un périphérique avec un point d'exclamation jaune dans le **Gestionnaire de périphériques** n'a pas de pilote correct.
`,ex:[
{q:"Après installation de Windows, il n'y a pas de Wi-Fi. Que faire ?",r:"Installer le **pilote de la carte réseau** (depuis le site du fabricant, avec un autre PC ou un câble réseau), puis vérifier dans le Gestionnaire de périphériques."},
{q:"Pourquoi sauvegarder avant d'installer un système ?",r:"Parce que le **formatage efface** les données de la partition."}]},
{t:"Diagnostic et dépannage",c:`
## La méthode
1. **Écouter** le client : que s'est-il passé, depuis quand ?
2. **Observer** : voyants, bruits, messages, bips.
3. **Tester** du plus simple au plus compliqué (câbles, alimentation, RAM…).
4. **Réparer**, puis **vérifier** que tout fonctionne.
5. **Noter** l'intervention (fiche d'intervention).

## Pannes fréquentes
|Symptôme|Cause probable|
|Rien ne s'allume|Câble, prise, bloc d'alimentation|
|Ventilateurs qui tournent mais écran noir|RAM mal placée, carte graphique|
|Bips au démarrage|Erreur du POST (voir le manuel de la carte mère)|
|Écran bleu|Pilote défectueux, RAM, disque|
|PC très lent|Disque plein ou usé, virus, trop de programmes au démarrage|
|PC qui s'éteint seul|Surchauffe (poussière, pâte thermique sèche)|

## Maintenance préventive
- Dépoussiérer (bombe d'air) et changer la pâte thermique.
- Mises à jour et antivirus.
- Sauvegardes régulières.
- Protéger contre les coupures avec un **onduleur**.
`,ex:[
{q:"Un PC s'allume, les ventilateurs tournent, mais l'écran reste noir et il bipe. Que vérifier en premier ?",r:"La **RAM** : l'enlever, nettoyer les contacts avec une gomme, la remettre bien enfoncée. Puis vérifier la carte graphique et le câble de l'écran."},
{q:"Un portable s'éteint au bout de 20 minutes de jeu. Diagnostic ?",r:"**Surchauffe** : ventilateur encrassé ou pâte thermique sèche. Il faut nettoyer et remplacer la pâte thermique."}]}],
quiz:[
{q:"La pile de la carte mère sert à :",o:["Démarrer le PC","Garder l'heure et les réglages du BIOS","Alimenter la RAM","Recharger la batterie"],a:1,e:"La pile CMOS conserve l'heure et la configuration."},
{q:"Le support du processeur s'appelle :",o:["Chipset","Slot","Socket","Port SATA"],a:2,e:"Le socket."},
{q:"Quel stockage est le plus rapide ?",o:["Disque dur 7200 tr/min","SSD SATA","SSD NVMe","Clé USB 2.0"],a:2,e:"Le NVMe passe par le PCI Express."},
{q:"La mémoire volatile est :",o:["Le SSD","La RAM","Le disque dur","La clé USB"],a:1,e:"La RAM se vide à l'arrêt."},
{q:"Le test des composants au démarrage s'appelle :",o:["Le BOOT","Le POST","Le DOS","Le RAID"],a:1,e:"POST : Power-On Self-Test."}]});

S({id:"electricite",nom:"Électricité",jour:"Mercredi",heure:"12h – 14h",couleur:"#FFD23F",icone:"bolt",
intro:"Courant continu et alternatif, puissance, énergie, installation domestique et sécurité.",
chapitres:[
{t:"Le circuit électrique",c:`
Un circuit comprend un **générateur**, des **récepteurs** et des **conducteurs**, avec souvent un interrupteur.

## Le sens du courant
Par convention, le courant va du **+** vers le **−** à l'extérieur du générateur.

## Les lois de Kirchhoff
- **Loi des nœuds** : la somme des courants qui arrivent = la somme des courants qui partent.
- **Loi des mailles** : dans une boucle, la somme des tensions est nulle.

## Circuit série et parallèle
|Circuit série|Circuit parallèle|
|Même courant partout|Même tension aux bornes de chaque branche|
|Les tensions s'additionnent|Les courants s'additionnent|
|Une lampe grillée coupe tout|Les autres branches continuent de fonctionner|

> Les prises d'une maison sont branchées **en parallèle** : chaque appareil reçoit 220–230 V.
`,ex:[
{q:"Dans un nœud, I1 = 2 A et I2 = 3 A arrivent. Une seule branche repart. Quelle intensité ?",r:"I = 2 + 3 = **5 A** (loi des nœuds)."},
{q:"Trois lampes en série sur 12 V. Deux ont 4 V chacune. Tension de la troisième ?",r:"12 − 4 − 4 = **4 V** (loi des mailles)."}]},
{t:"Le courant alternatif",c:`
Le réseau électrique (Senelec) fournit un courant **alternatif sinusoïdal**.

## Les caractéristiques
- **Fréquence** f : nombre de périodes par seconde, en hertz (Hz). Au Sénégal : **50 Hz**.
- **Période** T = 1 / f = 1/50 = **0,02 s** (20 ms).
- **Tension efficace** : environ **220–230 V** dans les maisons.
= Umax = Ueff × √2  (pour 230 V, Umax ≈ 325 V)

## Le transformateur
Il abaisse ou élève une tension alternative.
= U2 / U1 = N2 / N1 (N = nombre de spires)
Un chargeur de téléphone abaisse le 230 V puis le redresse en 5 V continu.
`,ex:[
{q:"Calcule la tension maximale d'un réseau de 220 V efficaces.",r:"Umax = 220 × 1,414 ≈ **311 V**."},
{q:"Un transformateur a 1 000 spires au primaire et 50 au secondaire. Sur 220 V, que donne-t-il ?",r:"U2 = 220 × 50 / 1000 = **11 V**."}]},
{t:"Puissance et énergie",c:`
## La puissance
= P = U × I  (en watts, W)
Elle est écrite sur chaque appareil : ampoule LED 9 W, ordinateur portable 65 W, climatiseur 1 500 W…

## L'énergie consommée
= E = P × t  (en wattheures Wh, ou kilowattheures kWh)
La facture Senelec (ou le crédit Woyofal) est comptée en **kWh**.

> Exemple : un ventilateur de 60 W allumé 10 h consomme 60 × 10 = 600 Wh = 0,6 kWh.
`,ex:[
{q:"Un PC de bureau consomme 200 W, 8 h par jour, pendant 30 jours. Calcule l'énergie.",r:"E = 200 × 8 × 30 = 48 000 Wh = **48 kWh**."},
{q:"Avec un prix de 100 FCFA le kWh, combien coûte cette consommation ?",r:"48 × 100 = **4 800 FCFA** par mois."},
{q:"Quel courant absorbe un fer à repasser de 1 100 W sous 220 V ?",r:"I = P / U = 1100 / 220 = **5 A**."}]},
{t:"L'installation domestique",c:`
## Les conducteurs et leurs couleurs
|Conducteur|Couleur|
|Phase|Rouge, marron ou noir|
|Neutre|Bleu|
|Terre|Vert-jaune|

## Les protections
- **Disjoncteur** : coupe en cas de surcharge ou de court-circuit (protège les câbles).
- **Disjoncteur différentiel 30 mA** : coupe en cas de fuite de courant (protège les **personnes**).
- **Fusible** : fond et coupe le circuit en cas de surintensité.
- **Prise de terre** : évacue les fuites de courant vers le sol.

## Les sections de câbles
- Éclairage : **1,5 mm²**
- Prises : **2,5 mm²**
- Gros appareils (cuisinière, climatiseur) : 4 à 6 mm²

## Schémas de base
Simple allumage, va-et-vient (commander une lampe de deux endroits), télérupteur (plusieurs boutons poussoirs).
`,ex:[
{q:"Quel appareil protège les personnes contre l'électrocution ?",r:"Le **disjoncteur différentiel 30 mA**."},
{q:"Quel montage choisir pour allumer une lampe de couloir depuis les deux extrémités ?",r:"Le **va-et-vient** (deux interrupteurs va-et-vient)."}]},
{t:"La sécurité électrique",c:`
## Les dangers
- **Électrisation** : passage du courant dans le corps.
- **Électrocution** : électrisation mortelle.
- Dès **30 mA**, le courant peut paralyser les muscles respiratoires.

## Les règles d'or
1. **Couper** le courant avant toute intervention.
2. **Vérifier** l'absence de tension (VAT) avec un testeur.
3. Utiliser des outils **isolés**.
4. Ne jamais toucher un appareil électrique les mains mouillées.
5. Ne pas surcharger les multiprises.

## En cas d'accident
Couper le courant **avant** de toucher la victime, appeler les secours (SAMU 1515, pompiers 18), pratiquer les gestes de premiers secours si formé.
`,ex:[
{q:"Une personne reste « collée » à un câble. Quelle est la première chose à faire ?",r:"**Couper le courant** (disjoncteur). Ne pas la toucher directement avant, sinon tu seras électrisé aussi."},
{q:"Pourquoi utilise-t-on des tournevis à manche isolé ?",r:"Pour éviter que le courant ne passe dans le corps si on touche un conducteur sous tension par erreur."}]}],
quiz:[
{q:"La fréquence du réseau au Sénégal est :",o:["50 Hz","60 Hz","220 Hz","100 Hz"],a:0,e:"50 Hz."},
{q:"Le fil de terre est :",o:["Bleu","Rouge","Vert-jaune","Noir"],a:2,e:"Vert-jaune."},
{q:"L'énergie se calcule par :",o:["E = U × I","E = P × t","E = R × I","E = P / t"],a:1,e:"E = P × t."},
{q:"Le différentiel 30 mA protège :",o:["Les câbles","Les personnes","Le compteur","Les ampoules"],a:1,e:"Il détecte les fuites de courant."},
{q:"Section de câble pour les prises :",o:["0,75 mm²","1,5 mm²","2,5 mm²","10 mm²"],a:2,e:"2,5 mm² pour les prises."}]});

S({id:"anglais",nom:"Anglais",jour:"Mercredi",heure:"14h – 16h",couleur:"#FF6B8A",icone:"globe",
intro:"L'anglais de l'informaticien : vocabulaire technique, grammaire utile, e-mails et entretien d'embauche.",
chapitres:[
{t:"IT vocabulary",c:`
## Hardware
|English|Français|
|motherboard|carte mère|
|hard drive|disque dur|
|power supply|alimentation|
|keyboard / mouse|clavier / souris|
|screen / monitor|écran|
|graphics card|carte graphique|
|memory (RAM)|mémoire vive|
|port / plug|port / prise|

## Software and Internet
|English|Français|
|software|logiciel|
|to download / to upload|télécharger / envoyer en ligne|
|to install / to uninstall|installer / désinstaller|
|update|mise à jour|
|password|mot de passe|
|browser|navigateur|
|network|réseau|
|to log in / to log out|se connecter / se déconnecter|
|bug|erreur dans un programme|
|backup|sauvegarde|
`,ex:[
{q:"Translate: « Le disque dur est plein, il faut faire une sauvegarde. »",r:"**The hard drive is full, we need to make a backup.**"},
{q:"Translate: « Download the update and restart your computer. »",r:"**Télécharge la mise à jour et redémarre ton ordinateur.**"}]},
{t:"Present simple and present continuous",c:`
## Present simple: habits and facts
= I work / He work**s** — Do you work? — I don't work
- The CPU **processes** data.
- She **uses** Linux every day.

## Present continuous: actions happening now
= am / is / are + verb-**ing**
- I **am installing** Windows right now.
- The printer **is not working** today.

> Words for present simple: always, usually, every day. Words for present continuous: now, at the moment, right now.
`,ex:[
{q:"Complete: The technician (repair) ___ a laptop at the moment.",r:"The technician **is repairing** a laptop at the moment."},
{q:"Complete: A router (connect) ___ different networks.",r:"A router **connects** different networks (a general fact)."}]},
{t:"Giving instructions",c:`
In manuals and tutorials, we use the **imperative**: the verb without « to ».
- **Click** on Start.
- **Open** the control panel.
- **Don't turn off** the computer during the update.

## Sequencing words
**First**, … **Then**, … **Next**, … **After that**, … **Finally**, …

> Example: First, unplug the computer. Then, open the case. Next, remove the old RAM. Finally, insert the new RAM.
`,ex:[
{q:"Write 4 instructions to install software, in English.",r:"**First, download the setup file. Then, double-click on it. Next, accept the license and click Install. Finally, restart the computer.**"},
{q:"Make the negative: « Touch the motherboard. »",r:"**Don't touch the motherboard.**"}]},
{t:"Past simple: reporting a problem",c:`
## Regular verbs: + ed
work → worked, crash → crashed, restart → restarted

## Common irregular verbs
|Base|Past|Français|
|be|was / were|être|
|do|did|faire|
|go|went|aller|
|have|had|avoir|
|make|made|faire / fabriquer|
|lose|lost|perdre|
|send|sent|envoyer|
|buy|bought|acheter|

## Questions and negatives
= Did + subject + base verb? — I didn't + base verb
- **Did** you **save** the file? — No, I **didn't save** it.
`,ex:[
{q:"Put in the past: « My computer crashes and I lose my work. »",r:"**My computer crashed and I lost my work.**"},
{q:"Ask the question: you want to know if the client restarted the PC.",r:"**Did you restart the computer?**"}]},
{t:"Writing a professional e-mail",c:`
## Structure
1. **Subject**: short and clear.
2. **Greeting**: Dear Mr Diop, / Dear Sir or Madam,
3. **Purpose**: I am writing to…
4. **Details**
5. **Closing**: I look forward to hearing from you.
6. **Signature**: Best regards, + name

## Useful phrases
- Please find attached my CV.
- Could you please…?
- Thank you for your quick reply.
`,ex:[
{q:"Write a short e-mail asking for an internship (stage) in a web agency.",r:"**Subject: Internship application – Web development**\nDear Sir or Madam,\nI am a second-year student in IT and Web development. I am writing to apply for a two-month internship in your company. Please find attached my CV.\nI look forward to hearing from you.\nBest regards,\n[Name]"}]},
{t:"Job interview",c:`
## Common questions
- **Tell me about yourself.**
- **What are your strengths and weaknesses?**
- **Why do you want to work here?**
- **Where do you see yourself in five years?**

## Good answers
- I am a motivated student in IT. I can build websites with HTML, CSS and JavaScript.
- My strength is that I learn fast. My weakness is that I am sometimes too perfectionist, but I am working on it.
`,ex:[
{q:"Answer in English: « Tell me about yourself. »",r:"Example: **My name is Moussa. I am 21 and I am a second-year IT student. I like building websites and fixing computers. I am looking for an internship to improve my skills.**"}]}],
quiz:[
{q:"« Mot de passe » in English is:",o:["Passport","Password","Keyword","Passcode word"],a:1,e:"Password."},
{q:"Choose: She ___ Linux every day.",o:["use","uses","using","is use"],a:1,e:"Present simple, 3rd person: uses."},
{q:"Past of « send »:",o:["sended","sent","send","sant"],a:1,e:"Irregular: sent."},
{q:"« Télécharger » (from the Internet):",o:["Upload","Download","Load up","Install"],a:1,e:"Download."},
{q:"Professional closing:",o:["Bye!","See ya","Best regards","Kisses"],a:2,e:"Best regards."}]});

S({id:"bureautique",nom:"Bureautique informatique",jour:"Jeudi",heure:"12h – 14h",couleur:"#4ADE80",icone:"doc",
intro:"Maîtriser Windows, Word, Excel, PowerPoint et la messagerie comme un professionnel.",
chapitres:[
{t:"Windows et la gestion des fichiers",c:`
## Les éléments
- **Bureau**, **barre des tâches**, **menu Démarrer**, **Explorateur de fichiers**.
- Un **fichier** a un nom et une **extension** : rapport.docx, budget.xlsx, photo.jpg.
- Un **dossier** range des fichiers.

## Raccourcis indispensables
|Raccourci|Action|
|Ctrl + C / Ctrl + V|Copier / coller|
|Ctrl + X|Couper|
|Ctrl + Z|Annuler|
|Ctrl + S|Enregistrer|
|Ctrl + A|Tout sélectionner|
|Alt + Tab|Changer de fenêtre|
|Windows + E|Ouvrir l'Explorateur|
|Windows + L|Verrouiller la session|

## Chemin d'accès
Exemple : C:\\Users\\Moussa\\Documents\\Cours\\rapport.docx
`,ex:[
{q:"Donne l'extension de : un document Word, un classeur Excel, une présentation PowerPoint, un PDF.",r:"**.docx**, **.xlsx**, **.pptx**, **.pdf**."},
{q:"Quelle différence entre couper et copier ?",r:"**Copier** garde l'original et crée un double. **Couper** déplace l'élément (il disparaît de l'endroit d'origine après le collage)."}]},
{t:"Microsoft Word",c:`
## Mise en forme
- **Police**, taille, gras (Ctrl + G), italique (Ctrl + I), souligné (Ctrl + U).
- **Paragraphe** : alignement, interligne, retraits.
- **Puces et numérotation**.

## Les fonctions pro
- **Styles** (Titre 1, Titre 2…) : indispensables pour une table des matières automatique.
- **Table des matières** : Références → Table des matières.
- **En-tête, pied de page, numéros de page**.
- **Sauts de page et de section**.
- **Publipostage** : créer une lettre type envoyée à une liste de personnes (Publipostage → Démarrer → Sélection des destinataires → Insérer des champs).

> Pour un rapport de stage : utilise les styles Titre 1 et Titre 2, puis insère la table des matières à la fin. Elle se met à jour en un clic.
`,ex:[
{q:"Comment créer une table des matières automatique ?",r:"Appliquer les **styles Titre 1, Titre 2** aux titres, puis **Références → Table des matières**. Mettre à jour avec clic droit → Mettre à jour les champs."},
{q:"Tu dois envoyer la même invitation à 50 personnes avec leur nom. Quelle fonction ?",r:"Le **publipostage**, avec une liste Excel contenant les noms."}]},
{t:"Microsoft Excel",c:`
## Les bases
- Une **cellule** a une adresse : colonne + ligne (B3).
- Une formule commence toujours par **=**.

## Fonctions essentielles
|Fonction|Exemple|Rôle|
|SOMME|=SOMME(B2:B10)|Additionne|
|MOYENNE|=MOYENNE(C2:C20)|Moyenne|
|MAX / MIN|=MAX(D2:D20)|Plus grande / plus petite valeur|
|NB|=NB(A2:A50)|Compte les nombres|
|SI|=SI(E2>=10;"Admis";"Ajourné")|Condition|
|NB.SI|=NB.SI(F2:F30;"Admis")|Compte selon une condition|
|RECHERCHEV|=RECHERCHEV(A2;Produits!A:C;3;FAUX)|Cherche une valeur dans un tableau|

## Références relatives et absolues
- **A1** : relative, elle change quand on recopie la formule.
- **$A$1** : absolue, elle reste fixe (touche **F4**).

## Graphiques
Sélectionner les données → Insertion → choisir histogramme, courbe ou secteurs.
`,ex:[
{q:"Écris la formule qui affiche « Admis » si la moyenne en G2 est au moins 10, sinon « Ajourné ».",r:"**=SI(G2>=10;\"Admis\";\"Ajourné\")**"},
{q:"Le taux de TVA (18 %) est en B1. Le prix HT est en A3. Quelle formule pour le TTC, à recopier vers le bas ?",r:"**=A3*(1+$B$1)** : B1 est en référence absolue pour rester fixe."},
{q:"Compte combien d'élèves sont « Admis » dans la plage H2:H40.",r:"**=NB.SI(H2:H40;\"Admis\")**"}]},
{t:"PowerPoint et la présentation",c:`
## Les règles d'une bonne présentation
- **Une idée par diapositive.**
- Pas plus de **6 lignes** de texte, des mots-clés plutôt que des phrases.
- Police lisible, au moins 24 pt.
- Contraste fort entre texte et fond.
- Des images et schémas plutôt que des paragraphes.

## Les fonctions utiles
- **Masque des diapositives** : modifier le style de toutes les diapos d'un coup.
- **Transitions** (entre diapos) et **animations** (sur les éléments) : avec modération.
- **Mode présentateur** : voir ses notes pendant l'exposé.
- Raccourcis : **F5** lance depuis le début, **Maj + F5** depuis la diapo actuelle.
`,ex:[
{q:"Quelle différence entre transition et animation ?",r:"La **transition** s'applique au passage d'une diapositive à l'autre. L'**animation** s'applique à un élément (texte, image) à l'intérieur d'une diapositive."},
{q:"Comment mettre le logo de l'école sur toutes les diapositives en une fois ?",r:"L'insérer dans le **masque des diapositives** (Affichage → Masque des diapositives)."}]},
{t:"Internet et messagerie",c:`
## Les notions
- **Navigateur** : Chrome, Firefox, Edge.
- **Moteur de recherche** : Google, Bing.
- **URL** : adresse d'une page (https://www.exemple.sn).
- **HTTPS** et le cadenas : la connexion est chiffrée.

## L'e-mail
- **À** : destinataire principal. **Cc** : copie visible. **Cci** : copie cachée.
- **Pièce jointe** : fichier attaché.
- Objet clair, formule de politesse, signature.

## Recherche efficace
- Guillemets pour une expression exacte : "carte mère ATX".
- **filetype:pdf** pour trouver des PDF.
- **site:gouv.sn** pour chercher sur un site.

! Ne clique jamais sur un lien reçu par message qui te demande ton mot de passe ou ton code (hameçonnage / phishing).
`,ex:[
{q:"Tu veux envoyer un e-mail à 30 clients sans qu'ils voient les adresses des autres. Quel champ utiliser ?",r:"Le champ **Cci** (copie carbone invisible)."},
{q:"Écris une recherche Google pour trouver des cours PDF sur le modèle OSI.",r:"**modèle OSI cours filetype:pdf**"}]}],
quiz:[
{q:"Ctrl + Z sert à :",o:["Enregistrer","Annuler","Copier","Imprimer"],a:1,e:"Annuler la dernière action."},
{q:"Dans Excel, une formule commence par :",o:["#","=","+","$"],a:1,e:"Le signe égal."},
{q:"$A$1 est une référence :",o:["Relative","Absolue","Mixte","Circulaire"],a:1,e:"Absolue, elle ne bouge pas."},
{q:"Pour envoyer une lettre personnalisée à 100 personnes :",o:["Copier-coller","Publipostage","Table des matières","Masque"],a:1,e:"Le publipostage."},
{q:"Lancer un diaporama depuis le début :",o:["F1","F5","F12","Ctrl + P"],a:1,e:"F5."}]});

S({id:"multimedia",nom:"Multimédia",jour:"Vendredi",heure:"8h – 10h",couleur:"#C084FC",icone:"play",
intro:"Image, son et vidéo numériques : comprendre les formats, retoucher, monter et publier.",
chapitres:[
{t:"L'image numérique",c:`
## Image matricielle (bitmap)
Composée de **pixels**. Elle perd en qualité quand on l'agrandit.
- **Définition** : nombre de pixels (1920 × 1080).
- **Résolution** : pixels par pouce (**ppi/dpi**). 72 ppi pour l'écran, **300 dpi** pour l'impression.

## Image vectorielle
Composée de formes mathématiques. On peut l'agrandir **sans perte** : idéale pour les logos.

## Les modes de couleur
- **RVB (RGB)** : rouge, vert, bleu. Pour les écrans. Chaque couleur va de 0 à 255.
- **CMJN (CMYK)** : cyan, magenta, jaune, noir. Pour l'impression.
- Code hexadécimal web : #FF0000 = rouge.

## Les formats
|Format|Usage|
|JPEG|Photos, compression avec perte|
|PNG|Images avec transparence, sans perte|
|GIF|Petites animations, 256 couleurs|
|SVG|Vectoriel pour le web, logos|
|WebP|Web moderne, très léger|
|PSD|Fichier de travail Photoshop|
`,ex:[
{q:"Quel format choisir pour un logo sur fond transparent destiné au site web ?",r:"**SVG** (vectoriel) ou **PNG** (bitmap avec transparence)."},
{q:"Une affiche A4 à 300 dpi : quelle définition en pixels ? (A4 = 8,27 × 11,69 pouces)",r:"8,27 × 300 ≈ 2 480 px et 11,69 × 300 ≈ 3 508 px → **2 480 × 3 508 pixels**."}]},
{t:"La retouche d'image",c:`
Logiciels : **Photoshop**, **GIMP** (gratuit), **Photopea** (en ligne), Canva.

## Les notions clés
- **Calques** : superposer des éléments sans les mélanger.
- **Masque de fusion** : cacher une partie d'un calque sans l'effacer.
- **Sélection** : rectangle, lasso, baguette magique, sélection du sujet.
- **Recadrage** : changer le cadrage et le format.
- **Réglages** : luminosité/contraste, niveaux, courbes, teinte/saturation.
- **Tampon de duplication** et **correcteur** : effacer des défauts.

> Travaille toujours sur une copie et garde le fichier PSD (ou XCF dans GIMP) pour pouvoir modifier plus tard.
`,ex:[
{q:"Pourquoi utiliser un masque plutôt que la gomme ?",r:"Le **masque est non destructif** : on peut faire réapparaître la partie cachée à tout moment. La gomme efface définitivement."},
{q:"Quel outil pour enlever un petit bouton sur un visage ?",r:"Le **correcteur localisé** ou le **tampon de duplication**."}]},
{t:"Le graphisme vectoriel et la PAO",c:`
Logiciels : **Illustrator**, **Inkscape** (gratuit), **Figma**, **Canva**.

## Les bases
- **Tracés** et **courbes de Bézier** (points d'ancrage et poignées).
- **Contour** et **fond**.
- **Pathfinder** : unir, soustraire, intersecter des formes.

## Les règles de mise en page
- **Hiérarchie** : un titre fort, un sous-titre, puis les détails.
- **Alignement** sur une grille.
- **Contraste** entre texte et fond.
- **Pas plus de 2 polices.**
- Respecter les **marges** (et le fond perdu de 3 mm pour l'impression).
`,ex:[
{q:"Pourquoi crée-t-on un logo en vectoriel ?",r:"Pour pouvoir l'utiliser **à toutes les tailles** (carte de visite comme banderole) sans perte de qualité."},
{q:"Cite trois règles d'une bonne affiche.",r:"Une **hiérarchie** claire, un bon **contraste**, au maximum **deux polices** (et des éléments alignés)."}]},
{t:"Le son numérique",c:`
## La numérisation
- **Fréquence d'échantillonnage** : nombre de mesures par seconde. CD : **44,1 kHz** ; vidéo : 48 kHz.
- **Résolution** (profondeur) : 16 bits (CD), 24 bits (studio).
= Débit = fréquence × résolution × nombre de canaux

## Les formats
|Format|Particularité|
|WAV|Sans compression, lourd|
|MP3|Compressé avec perte, très répandu|
|AAC|Meilleure qualité que le MP3 à débit égal|
|FLAC|Compressé sans perte|

Logiciel gratuit : **Audacity** (couper, réduire le bruit, normaliser).
`,ex:[
{q:"Calcule le débit d'un son CD (44 100 Hz, 16 bits, stéréo).",r:"44 100 × 16 × 2 = **1 411 200 bits/s ≈ 1 411 kbit/s**."},
{q:"Combien pèse 1 minute de ce son non compressé ?",r:"1 411 200 × 60 = 84 672 000 bits ÷ 8 = 10 584 000 octets ≈ **10 Mo**."}]},
{t:"La vidéo numérique",c:`
## Les caractéristiques
- **Définition** : HD 1280×720, Full HD 1920×1080, 4K 3840×2160. Vertical TikTok : **1080×1920**.
- **Images par seconde (fps)** : 24 (cinéma), 25/30 (TV, réseaux), 60 (sport, jeux).
- **Ratio** : 16:9 (paysage), 9:16 (vertical), 1:1 (carré).
- **Débit** (bitrate) : quantité de données par seconde.

## Conteneur et codec
- **Conteneur** : MP4, MOV, MKV, AVI.
- **Codec** : H.264 (le plus compatible), H.265/HEVC (plus léger), AV1.

## Le montage
Logiciels : **CapCut**, **DaVinci Resolve** (gratuit), Premiere Pro.
- **Timeline**, coupes, transitions, titres, étalonnage (couleurs), mixage audio, export.
`,ex:[
{q:"Quel format et quelle définition pour une vidéo TikTok ?",r:"**MP4 en H.264**, **1080 × 1920** (9:16), 30 images/s."},
{q:"Quelle différence entre conteneur et codec ?",r:"Le **conteneur** (MP4) est la « boîte » qui contient vidéo, son et sous-titres. Le **codec** (H.264) est la méthode de compression de la vidéo."}]}],
quiz:[
{q:"Le mode de couleur pour l'impression est :",o:["RVB","CMJN","HEX","HSL"],a:1,e:"CMJN."},
{q:"Format vectoriel pour le web :",o:["JPEG","PNG","SVG","GIF"],a:2,e:"SVG."},
{q:"Résolution standard pour imprimer :",o:["72 dpi","150 dpi","300 dpi","1080 dpi"],a:2,e:"300 dpi."},
{q:"Fréquence d'échantillonnage d'un CD :",o:["22 kHz","44,1 kHz","96 kHz","8 kHz"],a:1,e:"44,1 kHz."},
{q:"Le codec vidéo le plus compatible :",o:["H.264","FLAC","PSD","MKV"],a:0,e:"H.264."}]});

S({id:"francais",nom:"Français",jour:"Vendredi",heure:"10h – 12h",couleur:"#F97316",icone:"pen",
intro:"Bien communiquer à l'écrit et à l'oral : résumé, lettres, rapport de stage, exposé et grammaire utile.",
chapitres:[
{t:"La communication",c:`
## Le schéma de la communication
- **Émetteur** : celui qui parle ou écrit.
- **Récepteur** : celui qui reçoit.
- **Message** : le contenu.
- **Canal** : le moyen (oral, e-mail, téléphone, WhatsApp…).
- **Code** : la langue utilisée.
- **Contexte** : la situation.
Le **bruit** est tout ce qui gêne la communication.

## Les registres de langue
|Registre|Exemple|
|Familier|J'ai pas capté.|
|Courant|Je n'ai pas compris.|
|Soutenu|Je n'ai point saisi votre propos.|
Dans le monde professionnel, on utilise le **registre courant ou soutenu**.
`,ex:[
{q:"Identifie les éléments : un professeur envoie le planning des examens par e-mail aux étudiants.",r:"**Émetteur** : le professeur. **Récepteur** : les étudiants. **Message** : le planning. **Canal** : l'e-mail. **Code** : le français."},
{q:"Mets au registre courant : « Il a kiffé le site, c'est trop stylé. »",r:"**Il a beaucoup aimé le site, il est très réussi.**"}]},
{t:"Le résumé de texte",c:`
Résumer, c'est **réduire un texte** (souvent au quart) en gardant ses idées essentielles, dans l'ordre, **avec ses propres mots**.

## La méthode
1. Lire le texte deux fois.
2. Repérer le **thème** et la **thèse** (idée principale).
3. Repérer les **paragraphes** et les **connecteurs logiques** (mais, donc, car, en effet…).
4. Noter l'idée principale de chaque partie.
5. Rédiger sans « l'auteur dit que », sans exemples inutiles, sans avis personnel.
6. Compter les mots.

! Interdit dans un résumé : recopier des phrases entières, donner son opinion, changer l'ordre des idées.
`,ex:[
{q:"Quels sont les trois interdits du résumé ?",r:"**Recopier** des phrases du texte, donner **son avis**, **changer l'ordre** des idées."},
{q:"Un texte fait 400 mots. Quelle longueur pour un résumé au quart ?",r:"**100 mots** (avec une tolérance d'environ 10 %, soit 90 à 110 mots)."}]},
{t:"La lettre administrative et la demande de stage",c:`
## La présentation
1. Expéditeur (en haut à gauche) : nom, adresse, téléphone, e-mail.
2. Lieu et date (à droite) : Thiès, le 15 novembre 2026.
3. Destinataire : Monsieur le Directeur de…
4. **Objet** : Demande de stage.
5. Formule d'appel : Monsieur le Directeur,
6. Corps : introduction, motivation, demande.
7. Formule de politesse.
8. Signature.

## Formule de politesse classique
« Dans l'attente d'une suite favorable, je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées. »
`,ex:[
{q:"Rédige le corps d'une demande de stage dans une entreprise informatique.",r:"« Étudiant en 2ᵉ année de DT Informatique et Webmaster, je souhaite effectuer un stage de deux mois au sein de votre entreprise. Vos activités en maintenance et en développement web correspondent à ma formation, et ce stage me permettrait de mettre en pratique mes compétences. Je reste disponible pour un entretien à votre convenance. » + formule de politesse."}]},
{t:"Le rapport de stage",c:`
## Le plan type
1. **Page de garde** : nom, école, entreprise, période, encadreur.
2. **Remerciements**.
3. **Sommaire**.
4. **Introduction** : contexte et objectifs du stage.
5. **Présentation de l'entreprise** : historique, activités, organigramme.
6. **Travaux réalisés** : tâches, outils, difficultés, solutions.
7. **Bilan** : compétences acquises.
8. **Conclusion**.
9. **Annexes** et bibliographie.

> Écris au fur et à mesure du stage dans un carnet : dates, tâches et problèmes rencontrés. La rédaction sera beaucoup plus facile.
`,ex:[
{q:"Dans quelle partie présentes-tu l'organigramme de l'entreprise ?",r:"Dans la **présentation de l'entreprise**."},
{q:"Que met-on dans la conclusion d'un rapport de stage ?",r:"Le **bilan** du stage, ce qu'il t'a apporté, et une **ouverture** (projets, suite de tes études ou de ta carrière)."}]},
{t:"L'exposé oral",c:`
## Préparer
- Un plan clair : **introduction, 2 ou 3 parties, conclusion**.
- Des diapositives simples (mots-clés, images).
- Répéter en se chronométrant.

## Présenter
- Regarder le public, parler fort et lentement.
- Ne pas lire ses notes ni l'écran.
- Annoncer le plan au début.
- Terminer par une conclusion et accepter les questions.
`,ex:[
{q:"Propose un plan d'exposé de 10 minutes sur « Le rôle de l'intelligence artificielle dans la santé ».",r:"**Introduction** (définition, enjeu) ; **I. Les usages** (diagnostic par image, suivi des patients) ; **II. Les limites** (données personnelles, erreurs, coût) ; **Conclusion** (bilan et perspective)."}]},
{t:"Grammaire et orthographe utiles",c:`
## Homophones fréquents
|Mots|Astuce|
|a / à|« a » si on peut dire « avait »|
|et / est|« est » si on peut dire « était »|
|ou / où|« où » pour le lieu ou le temps|
|ce / se|« se » devant un verbe (il se connecte)|
|son / sont|« sont » si on peut dire « étaient »|
|ces / ses|« ses » = les siens|

## Participe passé
- Avec **être** : accord avec le sujet (elles sont arrivé**es**).
- Avec **avoir** : accord avec le COD seulement s'il est placé **avant** (les fichiers que j'ai supprimé**s**).

## Infinitif ou participe ?
Remplace par « vendre / vendu » : il faut **installer** (vendre) / j'ai **installé** (vendu).
`,ex:[
{q:"Corrige : « Les mises à jour que j'ai installer son importante. »",r:"**Les mises à jour que j'ai installées sont importantes.**"},
{q:"Complète avec a/à et et/est : « Il ___ envoyé le fichier ___ Fatou ___ il ___ parti. »",r:"Il **a** envoyé le fichier **à** Fatou **et** il **est** parti."}]}],
quiz:[
{q:"Dans un résumé, on peut :",o:["Donner son avis","Recopier le texte","Reformuler les idées","Changer l'ordre"],a:2,e:"On reformule avec ses mots."},
{q:"« Objet » dans une lettre indique :",o:["La date","Le sujet de la lettre","L'adresse","La signature"],a:1,e:"Le sujet."},
{q:"Complète : « Il ___ en ligne. »",o:["ait","es","est","et"],a:2,e:"est = était."},
{q:"Un rapport de stage commence par :",o:["La conclusion","Les annexes","La page de garde","Le bilan"],a:2,e:"La page de garde."},
{q:"Registre professionnel :",o:["Familier","Courant","Argotique","SMS"],a:1,e:"Courant ou soutenu."}]});

S({id:"ia",nom:"Intelligence artificielle",jour:"Samedi",heure:"10h – 12h",couleur:"#38BDF8",icone:"brain",
intro:"Comprendre l'IA : apprentissage automatique, réseaux de neurones, IA générative et éthique.",
chapitres:[
{t:"Qu'est-ce que l'intelligence artificielle ?",c:`
L'**IA** est l'ensemble des techniques qui permettent à une machine de réaliser des tâches qui demandent normalement l'intelligence humaine : reconnaître une image, comprendre une phrase, prendre une décision.

## Quelques dates
- **1950** : Alan Turing propose le « test de Turing ».
- **1956** : le terme « intelligence artificielle » apparaît (conférence de Dartmouth).
- **1997** : Deep Blue bat le champion d'échecs Garry Kasparov.
- **2012** : essor du **deep learning** (reconnaissance d'images).
- **2022** et après : les **IA génératives** grand public (assistants conversationnels, générateurs d'images).

## IA faible et IA forte
- **IA faible (étroite)** : spécialisée dans une tâche. C'est toute l'IA actuelle.
- **IA forte (générale)** : aurait une intelligence comparable à l'humain dans tous les domaines. Elle n'existe pas encore.
`,ex:[
{q:"Donne trois exemples d'IA que tu utilises au quotidien.",r:"La **reconnaissance faciale** du téléphone, les **recommandations** TikTok/YouTube, la **traduction automatique**, le correcteur du clavier, les assistants conversationnels."},
{q:"Le filtre anti-spam de ta messagerie est-il une IA faible ou forte ?",r:"Une **IA faible** : il ne sait faire qu'une seule tâche (classer les e-mails)."}]},
{t:"Le machine learning",c:`
Le **machine learning** (apprentissage automatique) permet à la machine d'**apprendre à partir d'exemples** au lieu de suivre des règles écrites à la main.

## Les trois types d'apprentissage
|Type|Principe|Exemple|
|Supervisé|Données avec la bonne réponse (étiquettes)|Classer des e-mails en spam / pas spam|
|Non supervisé|Données sans étiquette, la machine trouve des groupes|Regrouper des clients selon leurs achats|
|Par renforcement|Récompense ou punition après chaque action|Une IA qui apprend à jouer à un jeu|

## Classification et régression
- **Classification** : prédire une catégorie (chat ou chien, admis ou ajourné).
- **Régression** : prédire un nombre (prix d'un appartement, température de demain).
`,ex:[
{q:"Prédire le prix d'une moto d'occasion selon son âge et son kilométrage : classification ou régression ?",r:"**Régression** : on prédit un nombre (le prix)."},
{q:"Une IA apprend à partir de 10 000 radios déjà annotées « malade / sain ». Quel type d'apprentissage ?",r:"**Supervisé** (les données ont des étiquettes), et c'est une **classification**."}]},
{t:"Les données et l'entraînement",c:`
Une IA est aussi bonne que ses **données**.

## Les étapes d'un projet
1. **Collecter** les données.
2. **Nettoyer** : supprimer les erreurs, les doublons, les valeurs manquantes.
3. **Séparer** : environ **80 % pour l'entraînement**, **20 % pour le test**.
4. **Entraîner** le modèle.
5. **Évaluer** sur les données de test (précision, erreurs).
6. **Déployer** et surveiller.

## Les problèmes classiques
- **Surapprentissage (overfitting)** : le modèle apprend par cœur les données d'entraînement et se trompe sur les nouvelles.
- **Sous-apprentissage** : le modèle est trop simple, il se trompe partout.
- **Biais** : si les données ne représentent pas tout le monde, l'IA sera injuste.
`,ex:[
{q:"Un modèle a 99 % de réussite sur l'entraînement et 60 % sur le test. Quel problème ?",r:"Du **surapprentissage** : il a appris par cœur au lieu de généraliser."},
{q:"Avec 5 000 images, combien en garder pour le test (règle 80/20) ?",r:"20 % de 5 000 = **1 000 images** pour le test, 4 000 pour l'entraînement."}]},
{t:"Les réseaux de neurones",c:`
Inspirés (de loin) du cerveau humain.

## Le neurone artificiel
Il reçoit des **entrées**, les multiplie par des **poids**, ajoute un **biais**, puis applique une **fonction d'activation**.
= sortie = activation(x1·w1 + x2·w2 + … + b)

## Le réseau
- **Couche d'entrée** : reçoit les données (pixels d'une image…).
- **Couches cachées** : extraient des caractéristiques.
- **Couche de sortie** : donne le résultat.
Quand il y a beaucoup de couches cachées, on parle de **deep learning** (apprentissage profond).

## L'apprentissage
Le réseau compare sa réponse à la bonne réponse (**erreur**), puis ajuste ses poids pour se tromper moins : c'est la **rétropropagation**. On répète sur des milliers d'exemples (**époques**).
`,ex:[
{q:"Un neurone a x1 = 2, x2 = 3, w1 = 0,5, w2 = 1, b = −1. Activation : sortie = 1 si la somme > 0, sinon 0. Calcule.",r:"Somme = 2×0,5 + 3×1 − 1 = 1 + 3 − 1 = 3. 3 > 0 donc **sortie = 1**."},
{q:"Que veut dire « deep » dans deep learning ?",r:"Que le réseau a **beaucoup de couches cachées** (il est profond)."}]},
{t:"L'IA générative et les prompts",c:`
Une **IA générative** crée du contenu nouveau : texte, image, son, vidéo, code.
- **LLM** (grand modèle de langage) : prédit le mot suivant à partir d'énormes quantités de texte.
- Générateurs d'images : à partir d'une description textuelle.

## Écrire un bon prompt
- Donner un **rôle** : « Tu es professeur de réseaux… »
- Donner le **contexte** : niveau, objectif.
- Préciser le **format** : liste, tableau, 200 mots.
- Donner un **exemple** du résultat attendu.
- Vérifier et **corriger** la réponse.

! Une IA peut **inventer** des informations fausses (on parle d'hallucinations). Vérifie toujours les faits importants.
`,ex:[
{q:"Améliore ce prompt : « Explique les réseaux. »",r:"Exemple : « Tu es professeur. Explique à un étudiant de 2ᵉ année DT Informatique la différence entre un switch et un routeur, en 150 mots, avec un exemple d'une maison et un tableau comparatif. »"}]},
{t:"Éthique et limites de l'IA",c:`
## Les enjeux
- **Données personnelles** : consentement, sécurité. Au Sénégal, c'est la **CDP** (Commission de Protection des Données Personnelles) qui veille.
- **Biais et discrimination**.
- **Désinformation** : fausses images et vidéos (deepfakes).
- **Emploi** : certains métiers changent, d'autres apparaissent.
- **Responsabilité** : qui est responsable quand l'IA se trompe ?
- **Environnement** : l'entraînement consomme beaucoup d'énergie.

## Bonnes pratiques
- Rester **transparent** sur l'usage de l'IA.
- **Vérifier** les résultats.
- Ne pas donner d'informations sensibles à n'importe quel outil.
`,ex:[
{q:"Cite deux risques des deepfakes.",r:"La **désinformation** (fausses déclarations attribuées à des personnalités) et l'**atteinte à la réputation** ou les arnaques (fausse voix d'un proche qui demande de l'argent)."}]}],
quiz:[
{q:"L'apprentissage avec des données étiquetées est :",o:["Non supervisé","Supervisé","Par renforcement","Aléatoire"],a:1,e:"Supervisé."},
{q:"Prédire un prix est une tâche de :",o:["Classification","Régression","Clustering","Tri"],a:1,e:"Régression."},
{q:"Le surapprentissage, c'est :",o:["Apprendre trop lentement","Apprendre par cœur sans généraliser","Manquer de données","Avoir trop de tests"],a:1,e:"Le modèle ne généralise pas."},
{q:"Le deep learning utilise :",o:["Des arbres","Des réseaux de neurones profonds","Des tableurs","Des règles if/else"],a:1,e:"Beaucoup de couches cachées."},
{q:"Une « hallucination » d'IA est :",o:["Une image floue","Une information inventée","Un virus","Un bug d'écran"],a:1,e:"Une réponse fausse présentée comme vraie."}]});

S({id:"web",nom:"Développement web",jour:"Samedi",heure:"12h – 14h",couleur:"#FB7185",icone:"code",
intro:"Créer des sites de A à Z : HTML, CSS, JavaScript, PHP, MySQL et mise en ligne.",
chapitres:[
{t:"Comment fonctionne le web",c:`
## Client et serveur
- Le **client** (navigateur) envoie une **requête**.
- Le **serveur** renvoie une **réponse** (page HTML, image…).
- Le protocole est **HTTP** ; **HTTPS** est sa version chiffrée.

## Le DNS
Il traduit un **nom de domaine** (www.exemple.sn) en **adresse IP** (ex. 196.207.x.x).

## Front-end et back-end
|Front-end (côté client)|Back-end (côté serveur)|
|HTML : la structure|PHP, Node.js, Python|
|CSS : le style|Base de données : MySQL|
|JavaScript : l'interactivité|Traitement des formulaires, comptes|

## Les codes HTTP
- **200** : OK
- **301** : redirection permanente
- **404** : page introuvable
- **500** : erreur du serveur
`,ex:[
{q:"Que se passe-t-il quand tu tapes www.exemple.sn dans le navigateur ?",r:"1. Le **DNS** donne l'adresse IP du serveur. 2. Le navigateur envoie une **requête HTTP(S)**. 3. Le **serveur** renvoie la page. 4. Le navigateur **affiche** le HTML, le CSS et exécute le JavaScript."},
{q:"Un visiteur voit « Erreur 404 ». Que signifie-t-elle ?",r:"La **page demandée n'existe pas** (lien cassé ou mauvaise adresse)."}]},
{t:"HTML : la structure",c:`
## Le squelette d'une page
:::
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma boutique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Bienvenue</h1></header>
  <main>
    <p>Mon premier site.</p>
    <a href="contact.html">Contact</a>
    <img src="logo.png" alt="Logo de la boutique">
  </main>
  <footer>© 2026</footer>
</body>
</html>
:::

## Les balises essentielles
|Balise|Rôle|
|h1 à h6|Titres|
|p|Paragraphe|
|a href|Lien|
|img src alt|Image (alt = texte alternatif)|
|ul, ol, li|Listes|
|table, tr, td, th|Tableau|
|form, input, button|Formulaire|
|header, nav, main, section, footer|Structure sémantique|
|div, span|Conteneurs génériques|
`,ex:[
{q:"Écris le code d'une liste de 3 matières avec un lien vers la page « cours.html ».",r:"Code :\n<ul>\n  <li>Réseaux</li>\n  <li>Maintenance</li>\n  <li>Développement web</li>\n</ul>\n<a href=\"cours.html\">Voir les cours</a>"},
{q:"Pourquoi faut-il remplir l'attribut alt d'une image ?",r:"Pour l'**accessibilité** (lecteurs d'écran pour les malvoyants), pour le **référencement** (Google) et pour afficher un texte si l'image ne charge pas."}]},
{t:"CSS : le style",c:`
## La syntaxe
:::
sélecteur {
  propriété: valeur;
}
h1 { color: #0b2a4a; font-size: 32px; }
.bouton { background: #f2a93b; padding: 12px 20px; border-radius: 8px; }
#menu { display: flex; gap: 16px; }
:::
- **balise** (h1), **.classe**, **#id**.

## Le modèle de boîte
Chaque élément = **contenu** + **padding** (marge intérieure) + **border** (bordure) + **margin** (marge extérieure).

## Flexbox
:::
.conteneur {
  display: flex;
  justify-content: space-between; /* horizontal */
  align-items: center;            /* vertical */
}
:::

## Le responsive (adapté au téléphone)
:::
@media (max-width: 600px) {
  .conteneur { flex-direction: column; }
}
:::
`,ex:[
{q:"Écris le CSS d'un bouton orange, texte blanc, coins arrondis, qui devient plus foncé au survol.",r:"Code :\n.bouton { background: #f97316; color: white; border-radius: 10px; padding: 12px 24px; }\n.bouton:hover { background: #c2410c; }"},
{q:"Quelle différence entre margin et padding ?",r:"Le **padding** est l'espace **à l'intérieur** de la bordure. La **margin** est l'espace **à l'extérieur**, entre l'élément et ses voisins."}]},
{t:"JavaScript : l'interactivité",c:`
## Variables et types
:::
let nom = "Awa";        // texte (string)
const age = 20;         // nombre (number)
let admis = true;       // booléen
let notes = [12, 15, 9]; // tableau
:::

## Conditions et boucles
:::
if (age >= 18) {
  console.log("Majeur");
} else {
  console.log("Mineur");
}
for (let i = 0; i < notes.length; i++) {
  console.log(notes[i]);
}
:::

## Fonctions
:::
function moyenne(tab) {
  let somme = 0;
  for (const n of tab) somme += n;
  return somme / tab.length;
}
:::

## Le DOM : modifier la page
:::
const bouton = document.querySelector("#btn");
bouton.addEventListener("click", function () {
  document.querySelector("#message").textContent = "Merci !";
});
:::
`,ex:[
{q:"Écris une fonction qui renvoie « Admis » si la moyenne d'un tableau de notes est au moins 10, sinon « Ajourné ».",r:"Code :\nfunction resultat(notes) {\n  let s = 0;\n  for (const n of notes) s += n;\n  return (s / notes.length) >= 10 ? \"Admis\" : \"Ajourné\";\n}"},
{q:"Que fait document.querySelector(\".prix\") ?",r:"Il **sélectionne le premier élément** de la page qui a la classe « prix », pour pouvoir le lire ou le modifier."}]},
{t:"PHP et les formulaires",c:`
PHP s'exécute **sur le serveur** et renvoie du HTML au navigateur.

## Un formulaire
:::
<form action="traitement.php" method="post">
  <input type="text" name="nom" required>
  <input type="email" name="email" required>
  <button type="submit">Envoyer</button>
</form>
:::

## Le traitement
:::
<?php
$nom = htmlspecialchars($_POST["nom"]);
$email = htmlspecialchars($_POST["email"]);
echo "Merci " . $nom . ", nous vous écrirons à " . $email;
?>
:::

## GET ou POST ?
- **GET** : les données apparaissent dans l'URL (recherche, filtres).
- **POST** : les données sont envoyées dans le corps de la requête (mots de passe, formulaires).

! Ne fais jamais confiance aux données envoyées par l'utilisateur : utilise htmlspecialchars pour l'affichage et des requêtes préparées pour la base de données.
`,ex:[
{q:"Pourquoi utiliser POST pour un formulaire de connexion ?",r:"Parce qu'avec GET, le **mot de passe apparaîtrait dans l'URL** et dans l'historique du navigateur."},
{q:"À quoi sert htmlspecialchars ?",r:"À **neutraliser les caractères HTML** (comme < et >) pour empêcher l'injection de code (faille XSS)."}]},
{t:"Les bases de données MySQL",c:`
Une base de données range les informations dans des **tables** (lignes = enregistrements, colonnes = champs).

## Les requêtes SQL essentielles
:::
CREATE TABLE etudiant (
  id INT AUTO_INCREMENT PRIMARY KEY,
  nom VARCHAR(50),
  moyenne DECIMAL(4,2)
);
INSERT INTO etudiant (nom, moyenne) VALUES ('Awa Ndiaye', 14.5);
SELECT nom, moyenne FROM etudiant WHERE moyenne >= 10 ORDER BY moyenne DESC;
UPDATE etudiant SET moyenne = 15 WHERE id = 1;
DELETE FROM etudiant WHERE id = 3;
:::

## Les clés
- **Clé primaire** : identifie chaque ligne de façon unique.
- **Clé étrangère** : relie une table à une autre.

## Connexion en PHP (PDO, requête préparée)
:::
$pdo = new PDO("mysql:host=localhost;dbname=ecole", "root", "");
$req = $pdo->prepare("SELECT * FROM etudiant WHERE nom = ?");
$req->execute([$nom]);
:::
`,ex:[
{q:"Écris la requête qui affiche les produits dont le prix est inférieur à 10 000 FCFA, du moins cher au plus cher.",r:"**SELECT * FROM produit WHERE prix < 10000 ORDER BY prix ASC;**"},
{q:"Pourquoi utiliser des requêtes préparées ?",r:"Pour se protéger des **injections SQL** : les données de l'utilisateur ne sont jamais mélangées au code SQL."}]},
{t:"Mettre un site en ligne",c:`
## Ce qu'il faut
- Un **nom de domaine** (ex. maboutique.sn ou .com).
- Un **hébergement** (serveur où sont stockés les fichiers).
- Un **certificat SSL** pour le HTTPS (souvent gratuit avec Let's Encrypt).

## Les étapes
1. Tester le site en local (XAMPP, WAMP ou Live Server).
2. Envoyer les fichiers par **FTP** (FileZilla) ou par le gestionnaire de fichiers de l'hébergeur.
3. Importer la base de données (phpMyAdmin).
4. Relier le domaine à l'hébergement (DNS).
5. Activer le HTTPS et tester sur téléphone.

## Options gratuites pour les sites statiques
GitHub Pages, Netlify, Vercel.

> Un bon site est **rapide** (images compressées), **responsive** et **bien référencé** (titres, descriptions, balises alt).
`,ex:[
{q:"Quelle différence entre nom de domaine et hébergement ?",r:"Le **nom de domaine** est l'**adresse** (comme le nom d'une rue). L'**hébergement** est le **terrain** où se trouve la maison (les fichiers du site)."}]}],
quiz:[
{q:"Le langage qui structure une page web :",o:["CSS","HTML","PHP","SQL"],a:1,e:"HTML."},
{q:"L'erreur 404 signifie :",o:["Serveur en panne","Page introuvable","Accès refusé","OK"],a:1,e:"Page introuvable."},
{q:"En CSS, .menu cible :",o:["L'id menu","La classe menu","La balise menu","Le fichier menu"],a:1,e:"Le point désigne une classe."},
{q:"Requête SQL pour lire des données :",o:["INSERT","SELECT","UPDATE","DROP"],a:1,e:"SELECT."},
