S({id:"genie-logiciel",nom:"Génie logiciel",jour:"Samedi",heure:"14h – 16h",couleur:"#A3E635",icone:"layers",
intro:"Concevoir un logiciel proprement : cycle de vie, cahier des charges, UML, Merise, tests et Git.",
chapitres:[
{t:"Le cycle de vie d'un logiciel",c:`
Le **génie logiciel** regroupe les méthodes pour produire un logiciel de qualité, dans les délais et le budget.

## Les étapes
1. Analyse des besoins
2. Conception
3. Développement (codage)
4. Tests
5. Déploiement (mise en service)
6. Maintenance

## Les modèles
|Modèle|Principe|Avantage|Limite|
|Cascade|Les étapes se suivent une à une|Simple, bien documenté|Difficile de revenir en arrière|
|Cycle en V|Chaque étape de conception a son test|Qualité, contrôle|Rigide|
|Agile (Scrum)|Livraisons courtes et régulières (sprints)|S'adapte aux changements|Demande l'implication du client|

## Scrum en bref
- **Product Owner** : représente le client, gère la liste des fonctionnalités (backlog).
- **Scrum Master** : aide l'équipe à appliquer la méthode.
- **Équipe de développement**.
- **Sprint** : 1 à 4 semaines, avec une réunion quotidienne courte (daily).
`,ex:[
{q:"Un client ne sait pas encore exactement ce qu'il veut et changera d'avis. Quelle méthode choisir ?",r:"Une méthode **agile** (Scrum) : on livre par petites parties et on s'adapte aux changements."},
{q:"Cite les rôles de Scrum.",r:"**Product Owner**, **Scrum Master** et **équipe de développement**."}]},
{t:"Le cahier des charges",c:`
C'est le document qui décrit **ce que le logiciel doit faire**.

## Son contenu
- Contexte et objectifs du projet.
- **Besoins fonctionnels** : ce que fait le logiciel (« l'utilisateur peut ajouter un produit au panier »).
- **Besoins non fonctionnels** : qualité attendue (rapidité, sécurité, compatibilité téléphone).
- Contraintes : budget, délai, technologies.
- Planning et livrables.
`,ex:[
{q:"Classe : « paiement par Wave », « page qui charge en moins de 2 s », « inscription d'un client », « site sécurisé en HTTPS ».",r:"**Fonctionnels** : paiement par Wave, inscription d'un client. **Non fonctionnels** : chargement en moins de 2 s, HTTPS."}]},
{t:"UML : modéliser le logiciel",c:`
**UML** (Unified Modeling Language) est un langage de schémas pour concevoir un logiciel.

## Diagramme de cas d'utilisation
- **Acteur** (bonhomme) : qui utilise le système (client, administrateur).
- **Cas d'utilisation** (ovale) : ce qu'il peut faire (« passer une commande »).
- Relations **include** (obligatoire) et **extend** (optionnelle).

## Diagramme de classes
Une **classe** a un nom, des **attributs** et des **méthodes**.
:::
+-------------------+
| Etudiant          |
+-------------------+
| - nom : String    |
| - moyenne : float |
+-------------------+
| + calculerMoyenne()|
+-------------------+
:::
Les **multiplicités** (1, 0..*, 1..*) indiquent combien d'objets sont liés.

## Diagramme de séquence
Montre les **messages échangés dans le temps** entre les objets (ex. : connexion d'un utilisateur).
`,ex:[
{q:"Pour une boutique en ligne, cite deux acteurs et trois cas d'utilisation.",r:"**Acteurs** : client, administrateur. **Cas d'utilisation** : consulter les produits, ajouter au panier, passer commande (et pour l'admin : gérer les produits)."},
{q:"Un client passe 0 ou plusieurs commandes, une commande appartient à un seul client. Écris les multiplicités.",r:"Côté commande : **0..*** ; côté client : **1**."}]},
{t:"Merise : concevoir la base de données",c:`
**Merise** est une méthode française de conception, très utilisée pour les bases de données.

## Le MCD (Modèle Conceptuel de Données)
- **Entité** : un objet (ÉTUDIANT, COURS).
- **Propriétés** : ses informations (nom, prénom).
- **Identifiant** : propriété unique (matricule), souligné.
- **Association** : lien entre entités (SUIVRE).
- **Cardinalités** : (0,n), (1,1), (1,n)…

## Le passage au MLD (Modèle Logique)
- Chaque entité devient une **table**.
- Association **(x,1) — (x,n)** : l'identifiant du côté n part comme **clé étrangère** dans la table du côté 1.
- Association **(x,n) — (x,n)** : elle devient une **table** avec les deux clés.

> Exemple : ÉTUDIANT (0,n) — SUIVRE — (1,n) COURS donne la table SUIVRE(#matricule, #code_cours).
`,ex:[
{q:"Un client passe une ou plusieurs commandes ; une commande concerne un seul client. Donne le MLD.",r:"CLIENT(**id_client**, nom, téléphone) ; COMMANDE(**id_commande**, date, montant, #id_client). La clé du client passe dans COMMANDE."},
{q:"Une commande contient plusieurs produits et un produit peut être dans plusieurs commandes. Que devient l'association ?",r:"Une **table** : CONTENIR(#id_commande, #id_produit, quantité)."}]},
{t:"Les tests",c:`
Tester, c'est **chercher les erreurs avant le client**.

## Les niveaux de test
- **Test unitaire** : une fonction seule.
- **Test d'intégration** : plusieurs modules ensemble.
- **Test système** : tout le logiciel.
- **Test d'acceptation (recette)** : validé par le client.

## Boîte noire et boîte blanche
- **Boîte noire** : on teste les entrées et sorties sans regarder le code.
- **Boîte blanche** : on teste en connaissant le code (toutes les branches).

## Un cas de test
|Entrée|Résultat attendu|
|moyenne = 10|« Admis »|
|moyenne = 9,99|« Ajourné »|
|moyenne = −2|Message d'erreur|
`,ex:[
{q:"Propose 3 cas de test pour un champ « âge » qui accepte de 18 à 60 ans.",r:"**17** → refusé ; **18** → accepté (limite) ; **61** → refusé. On peut ajouter « abc » → message d'erreur."}]},
{t:"Git et la gestion de versions",c:`
**Git** enregistre l'historique du code et permet de travailler à plusieurs. **GitHub** l'héberge en ligne.

## Les commandes de base
:::
git init                     # créer un dépôt
git add .                    # préparer les fichiers
git commit -m "Ajout du panier"  # enregistrer une version
git status                   # voir l'état
git log                      # voir l'historique
git branch nouvelle-page     # créer une branche
git checkout nouvelle-page   # changer de branche
git merge nouvelle-page      # fusionner
git push / git pull          # envoyer / récupérer depuis GitHub
:::
`,ex:[
{q:"Dans quel ordre enregistres-tu une modification sur GitHub ?",r:"**git add .** → **git commit -m \"message\"** → **git push**."},
{q:"À quoi sert une branche ?",r:"À **développer une fonctionnalité à part** sans casser la version principale, puis à la fusionner quand elle est prête."}]}],
quiz:[
{q:"Méthode avec des sprints :",o:["Cascade","Cycle en V","Scrum","Merise"],a:2,e:"Scrum."},
{q:"Dans UML, l'ovale représente :",o:["Un acteur","Un cas d'utilisation","Une classe","Une table"],a:1,e:"Un cas d'utilisation."},
{q:"Une association (n,n) en Merise devient :",o:["Un attribut","Une table","Une clé primaire","Rien"],a:1,e:"Une table de liaison."},
{q:"Test fait par le client :",o:["Unitaire","Intégration","Recette","Boîte blanche"],a:2,e:"La recette (acceptation)."},
{q:"Commande Git pour enregistrer une version :",o:["git push","git commit","git init","git log"],a:1,e:"git commit."}]});

S({id:"reseaux",nom:"Réseaux informatiques",jour:"Samedi",heure:"16h – 18h",couleur:"#22D3EE",icone:"network",
intro:"Relier les machines : topologies, OSI et TCP/IP, câblage, adressage IP, sous-réseaux et services.",
chapitres:[
{t:"Les notions de base",c:`
Un **réseau** est un ensemble d'équipements reliés pour échanger des données et partager des ressources (Internet, imprimante, fichiers).

## Les types selon la taille
|Type|Étendue|Exemple|
|PAN|Quelques mètres|Bluetooth téléphone–écouteurs|
|LAN|Un bâtiment|Réseau de l'école|
|MAN|Une ville|Réseau d'une ville|
|WAN|Pays, monde|Internet|

## Les topologies
- **Bus** : un câble commun (ancien).
- **Étoile** : tous reliés à un switch. La plus utilisée aujourd'hui.
- **Anneau** : chaque poste relié au suivant.
- **Maillée** : plusieurs chemins possibles (Internet).

## Client-serveur et poste à poste
- **Client-serveur** : un serveur central fournit les services.
- **Peer-to-peer** : chaque poste est à la fois client et serveur.
`,ex:[
{q:"Quel type de réseau relie les ordinateurs d'une salle de classe ?",r:"Un **LAN** (réseau local), en général en **topologie étoile** autour d'un switch."},
{q:"Quel est l'avantage principal de la topologie étoile ?",r:"Si un câble ou un poste tombe en panne, **les autres continuent de fonctionner**. Elle est aussi facile à étendre."}]},
{t:"Le modèle OSI et TCP/IP",c:`
## Les 7 couches OSI
|N°|Couche|Rôle|Exemples|
|7|Application|Services pour l'utilisateur|HTTP, FTP, DNS, SMTP|
|6|Présentation|Format, chiffrement|SSL/TLS, JPEG|
|5|Session|Ouverture et fermeture du dialogue|—|
|4|Transport|Fiabilité, ports|TCP, UDP|
|3|Réseau|Adressage IP, routage|IP, ICMP, routeur|
|2|Liaison|Adresse MAC, trames|Ethernet, switch|
|1|Physique|Bits sur le support|Câbles, Wi-Fi, hub|

> Phrase pour retenir de 1 à 7 : « **P**our **L**e **R**éseau **T**out **S**e **P**asse **A**utomatiquement ».

## Le modèle TCP/IP (4 couches)
Accès réseau → Internet → Transport → Application.

## TCP ou UDP ?
- **TCP** : fiable, vérifie la réception (web, e-mail).
- **UDP** : rapide, sans vérification (appels vidéo, jeux, streaming).

## Ports à connaître
HTTP **80**, HTTPS **443**, FTP **21**, SSH **22**, DNS **53**, SMTP **25**.
`,ex:[
{q:"À quelle couche OSI travaillent le switch et le routeur ?",r:"Le **switch** : couche **2** (liaison, adresses MAC). Le **routeur** : couche **3** (réseau, adresses IP)."},
{q:"Un appel vidéo WhatsApp utilise plutôt TCP ou UDP ? Pourquoi ?",r:"**UDP**, car la **rapidité** compte plus que la perte de quelques paquets."}]},
{t:"Matériel et câblage",c:`
## Les équipements
|Équipement|Rôle|
|Carte réseau|Connecte le poste (adresse MAC unique)|
|Switch|Relie les postes d'un même réseau, envoie au bon destinataire|
|Routeur|Relie des réseaux différents (LAN ↔ Internet)|
|Point d'accès Wi-Fi|Connexion sans fil|
|Box / modem|Accès Internet de l'opérateur|

## Le câble à paires torsadées (RJ45)
- Catégories : **Cat 5e** (1 Gbit/s), **Cat 6** (jusqu'à 10 Gbit/s sur courte distance).
- Longueur maximale : **100 m**.

## Normes de sertissage
|Broche|T568A|T568B|
|1|Blanc-vert|Blanc-orange|
|2|Vert|Orange|
|3|Blanc-orange|Blanc-vert|
|4|Bleu|Bleu|
|5|Blanc-bleu|Blanc-bleu|
|6|Orange|Vert|
|7|Blanc-marron|Blanc-marron|
|8|Marron|Marron|

- **Câble droit** : même norme aux deux bouts (PC → switch).
- **Câble croisé** : T568A d'un côté, T568B de l'autre (PC → PC, ancien matériel).

## La fibre optique
Transmet par la lumière : très haut débit, longues distances, insensible aux perturbations.
`,ex:[
{q:"Donne l'ordre des couleurs T568B.",r:"**Blanc-orange, orange, blanc-vert, bleu, blanc-bleu, vert, blanc-marron, marron.**"},
{q:"Quel câble pour relier un PC à un switch ?",r:"Un **câble droit** (même norme, en général T568B, aux deux extrémités)."}]},
{t:"L'adressage IPv4",c:`
Une **adresse IPv4** = 32 bits, écrite en 4 octets : **192.168.1.10**. Chaque octet va de 0 à 255.

## Le masque de sous-réseau
Il sépare la **partie réseau** et la **partie hôte**.
- 255.255.255.0 = **/24** (24 bits à 1)

## Les classes (historiques)
|Classe|Premier octet|Masque par défaut|
|A|1 – 126|255.0.0.0 (/8)|
|B|128 – 191|255.255.0.0 (/16)|
|C|192 – 223|255.255.255.0 (/24)|

## Adresses privées
- 10.0.0.0/8
- 172.16.0.0 à 172.31.255.255 (/12)
- 192.168.0.0/16
127.0.0.1 = **localhost** (la machine elle-même).

## Calculs pour 192.168.1.10/24
- **Adresse réseau** : 192.168.1.0
- **Broadcast** : 192.168.1.255
- **Hôtes utilisables** : 192.168.1.1 à 192.168.1.254
= Nombre d'hôtes = 2^(bits hôtes) − 2
`,ex:[
{q:"Pour 172.16.5.20/16, donne l'adresse réseau, le broadcast et le nombre d'hôtes.",r:"Réseau : **172.16.0.0** ; broadcast : **172.16.255.255** ; hôtes : 2¹⁶ − 2 = **65 534**."},
{q:"L'adresse 10.20.30.40 est-elle publique ou privée ?",r:"**Privée** : elle appartient à la plage 10.0.0.0/8."}]},
{t:"Les sous-réseaux",c:`
Découper un réseau en plusieurs **sous-réseaux** : organisation, sécurité, moins de trafic.

## La méthode
On « emprunte » des bits à la partie hôte.
= Nombre de sous-réseaux = 2^n (n = bits empruntés)
= Hôtes par sous-réseau = 2^h − 2 (h = bits hôtes restants)

## Exemple : 192.168.10.0/24 en 4 sous-réseaux
2² = 4 → on emprunte **2 bits** → masque **/26** (255.255.255.192), soit 64 adresses par sous-réseau.
|Sous-réseau|Réseau|Hôtes|Broadcast|
|1|192.168.10.0|.1 à .62|.63|
|2|192.168.10.64|.65 à .126|.127|
|3|192.168.10.128|.129 à .190|.191|
|4|192.168.10.192|.193 à .254|.255|
`,ex:[
{q:"Découpe 192.168.20.0/24 en 8 sous-réseaux. Quel masque et combien d'hôtes par sous-réseau ?",r:"2³ = 8 → 3 bits empruntés → **/27 (255.255.255.224)**. Il reste 5 bits hôtes : 2⁵ − 2 = **30 hôtes** par sous-réseau (pas de 32)."},
{q:"Un service a besoin de 50 postes. Quel masque choisir ?",r:"Il faut 2^h − 2 ≥ 50 → h = 6 (62 hôtes) → **/26 (255.255.255.192)**."}]},
{t:"Services réseau et Wi-Fi",c:`
## Les services
- **DHCP** : donne automatiquement une adresse IP, un masque, une passerelle et un DNS aux appareils.
- **DNS** : traduit les noms en adresses IP.
- **Passerelle par défaut** : adresse du routeur pour sortir du réseau.
- **NAT** : permet à plusieurs appareils privés de partager une seule adresse publique.

## Le Wi-Fi
- Normes : Wi-Fi 4 (802.11n), Wi-Fi 5 (ac), Wi-Fi 6 (ax).
- Bandes : **2,4 GHz** (porte plus loin) et **5 GHz** (plus rapide, moins loin).
- Sécurité : **WPA2** ou **WPA3** avec un mot de passe fort. Jamais WEP.
- **SSID** : nom du réseau Wi-Fi.

## Les commandes de diagnostic (Windows)
|Commande|Rôle|
|ipconfig /all|Voir l'adresse IP, le masque, la passerelle, le DNS, l'adresse MAC|
|ping 8.8.8.8|Tester la connexion avec une machine|
|tracert google.com|Voir le chemin parcouru|
|nslookup google.com|Tester le DNS|
|ipconfig /release puis /renew|Redemander une adresse au DHCP|
`,ex:[
{q:"Un PC a l'adresse 169.254.12.5. Que se passe-t-il ?",r:"C'est une adresse **APIPA** : le PC **n'a pas reçu d'adresse du DHCP**. Il faut vérifier le câble ou le Wi-Fi et le routeur, puis faire ipconfig /release et /renew."},
{q:"ping 8.8.8.8 répond, mais les sites ne s'ouvrent pas. Quel service est en cause ?",r:"Le **DNS** : la connexion fonctionne, mais les noms ne sont pas traduits. On peut tester avec nslookup et changer de serveur DNS."}]}],
quiz:[
{q:"Le routeur travaille à la couche OSI :",o:["1","2","3","7"],a:2,e:"Couche 3, réseau."},
{q:"Le port de HTTPS :",o:["21","80","443","53"],a:2,e:"443."},
{q:"Masque /26 :",o:["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"],a:2,e:"26 bits à 1."},
{q:"Le service qui attribue les adresses IP automatiquement :",o:["DNS","DHCP","FTP","HTTP"],a:1,e:"DHCP."},
{q:"Longueur max d'un câble Ethernet cuivre :",o:["10 m","50 m","100 m","500 m"],a:2,e:"100 m."}]});

A("electronique",{chapitres:[
{t:"Mesurer avec le multimètre et l'oscilloscope",c:`
## Le multimètre
|Mesure|Position du sélecteur|Branchement|
|Tension continue|V⎓ (DC)|En **parallèle** sur le composant|
|Tension alternative|V~ (AC)|En parallèle|
|Intensité|A ou mA|En **série** : on ouvre le circuit|
|Résistance|Ω|Circuit **hors tension**, composant isolé|
|Continuité|Symbole « bip »|Hors tension : le bip indique que le courant passe|

## Les règles
1. Fil noir sur **COM**, fil rouge sur **V/Ω** (ou sur **A** pour les intensités).
2. Commencer par le **calibre le plus grand**.
3. Ne jamais mesurer une résistance sous tension.
4. Remettre le fil rouge sur V après une mesure de courant, sinon court-circuit au prochain test de tension.

## L'oscilloscope
Il affiche la **forme** d'un signal en fonction du temps.
- Axe vertical : la tension (réglage en V/division).
- Axe horizontal : le temps (réglage en ms/division).
= Période T = nombre de divisions × base de temps ; f = 1 / T
`,ex:[
{q:"Tu veux vérifier si un câble USB est coupé à l'intérieur. Quelle fonction du multimètre utiliser ?",r:"La **continuité** (bip), câble débranché. On touche les deux extrémités d'un même fil : **bip** = le fil est bon ; **pas de bip** = le fil est coupé."},
{q:"Sur l'oscilloscope, une période occupe 4 divisions et la base de temps est de 5 ms/division. Calcule T et f.",r:"T = 4 × 5 ms = **20 ms** = 0,02 s. f = 1 / 0,02 = **50 Hz** : c'est le signal du secteur."},
{q:"Pourquoi le multimètre affiche « 1 » ou « OL » quand on mesure une résistance de 47 kΩ sur le calibre 2 kΩ ?",r:"La valeur **dépasse le calibre** (overload). Il faut passer sur un calibre plus grand, par exemple **200 kΩ**."}]},
{t:"Le microcontrôleur et Arduino",c:`
Un **microcontrôleur** est un petit ordinateur sur une seule puce : processeur, mémoire et entrées/sorties. On en trouve dans les télécommandes, les machines à laver, les compteurs Woyofal…

## La carte Arduino Uno
- Microcontrôleur **ATmega328P**, alimentation 5 V.
- **14 broches numériques** (0 ou 1), dont 6 en PWM.
- **6 entrées analogiques** (A0 à A5) : valeur de 0 à 1023.
- Programmation en C/C++ avec le logiciel **Arduino IDE**.

## La structure d'un programme
:::
void setup() {          // s'exécute une fois au démarrage
  pinMode(13, OUTPUT);
}
void loop() {           // se répète à l'infini
  digitalWrite(13, HIGH);  // allume la LED
  delay(1000);             // attend 1 seconde
  digitalWrite(13, LOW);   // éteint la LED
  delay(1000);
}
:::

## Les fonctions de base
- digitalWrite(broche, HIGH/LOW) : sortie numérique.
- digitalRead(broche) : lire un bouton.
- analogRead(A0) : lire un capteur (lumière, température).
- Serial.println(valeur) : afficher sur l'ordinateur.
`,ex:[
{q:"Modifie le programme pour que la LED clignote deux fois plus vite.",r:"Il faut diviser les temps par deux : **delay(500)** à la place de delay(1000), aux deux endroits."},
{q:"Un capteur de lumière branché sur A0 renvoie 1023 en plein soleil et 0 dans le noir. Écris la condition qui allume la LED quand il fait sombre (valeur < 300).",r:"Code :\nint lum = analogRead(A0);\nif (lum < 300) {\n  digitalWrite(13, HIGH);\n} else {\n  digitalWrite(13, LOW);\n}"}]}],
quiz:[
{q:"Pour mesurer une intensité, l'ampèremètre se branche :",o:["En parallèle","En série","Sur la terre","Hors tension"],a:1,e:"En série, on ouvre le circuit."},
{q:"Dans Arduino, la fonction qui se répète à l'infini est :",o:["setup()","main()","loop()","repeat()"],a:2,e:"loop()."},
{q:"analogRead() renvoie une valeur entre :",o:["0 et 1","0 et 255","0 et 1023","0 et 5"],a:2,e:"Convertisseur 10 bits : 0 à 1023."}]});

A("entreprenariat",{chapitres:[
{t:"Le marketing digital",c:`
## Les 4 P du marketing
- **Produit** : ce que tu vends et ses avantages.
- **Prix** : combien, et comment on paie (Wave, Orange Money, espèces).
- **Place** (distribution) : où le client trouve le produit (boutique, livraison, en ligne).
- **Promotion** : comment tu le fais connaître.

## Les outils digitaux
- **WhatsApp Business** : catalogue, réponses automatiques, statuts.
- **TikTok, Instagram, Facebook** : vidéos courtes, publicités ciblées par ville et par âge.
- **Google Business Profile** : apparaître sur Google Maps.
- **Site web** : vitrine professionnelle et confiance.

## Bien publier
- Montrer le **problème** puis la **solution**.
- Publier **régulièrement** (3 à 5 fois par semaine).
- Mesurer : vues, messages reçus, ventes.
- Répondre vite aux clients : un message sans réponse est une vente perdue.
`,ex:[
{q:"Applique les 4 P à un service de réparation de téléphones à Thiès.",r:"**Produit** : réparation d'écran, batterie, logiciel, garantie 1 mois. **Prix** : selon la panne, paiement Wave. **Place** : atelier au marché + récupération à domicile. **Promotion** : vidéos TikTok avant/après, statut WhatsApp, fiche Google Maps."},
{q:"Pourquoi publier « avant / après » est efficace ?",r:"Parce que le client **voit le résultat concret**. C'est une preuve, plus convaincante qu'une simple promesse."}]},
{t:"Présenter son projet : le pitch",c:`
Un **pitch** est une présentation courte (1 à 3 minutes) pour convaincre un jury, un investisseur ou un client.

## La structure
1. **L'accroche** : une phrase ou un chiffre qui marque.
2. **Le problème** : qui souffre, et de quoi ?
3. **La solution** : ton produit ou service.
4. **Le marché** : combien de clients possibles.
5. **Le modèle économique** : comment tu gagnes de l'argent.
6. **L'équipe** : pourquoi vous êtes capables.
7. **La demande** : ce que tu veux (financement, partenariat).

{t:"Imprimantes et périphériques",c:`
## Les types d'imprimantes
|Type|Fonctionnement|Usage|
|Jet d'encre|Gouttes d'encre projetées|Photos, petits volumes|
|Laser|Toner fixé par la chaleur|Bureaux, gros volumes, rapide|
|Thermique|Papier sensible à la chaleur|Tickets de caisse|
|Matricielle|Aiguilles qui frappent un ruban|Factures en plusieurs exemplaires|

## Installer une imprimante
1. Brancher (USB, Wi-Fi ou réseau).
2. Installer le **pilote** du fabricant.
3. Imprimer une **page de test**.
4. Pour la partager : Paramètres → Imprimantes → Partager, ou l'installer en réseau.

## Pannes fréquentes
- **Bourrage papier** : ouvrir les capots, retirer la feuille dans le sens du papier.
- **Impression pâle ou rayée** : cartouche vide ou têtes bouchées (lancer le nettoyage des têtes).
- **Imprimante hors ligne** : vérifier le câble ou le Wi-Fi, redémarrer le **spouleur d'impression** (services.msc).
`,ex:[
{q:"Les documents restent bloqués dans la file d'attente et rien ne s'imprime. Que faire ?",r:"Vider la file d'attente puis **redémarrer le service « Spouleur d'impression »** (Win + R → services.msc → Spouleur d'impression → Redémarrer). Vérifier aussi que l'imprimante n'est pas « hors ligne »."},
{q:"Un cyber imprime 500 pages de cours par jour. Jet d'encre ou laser ?",r:"**Laser** : plus rapide, coût par page plus faible pour les gros volumes."}]},
{t:"Virus, sécurité et sauvegarde",c:`
## Les logiciels malveillants
|Type|Ce qu'il fait|
|Virus|S'attache à un fichier et se propage|
|Ver|Se propage seul par le réseau|
|Cheval de Troie|Se cache dans un faux logiciel|
|Rançongiciel (ransomware)|Chiffre les fichiers et demande de l'argent|
|Logiciel espion|Vole des informations (mots de passe)|

## Les signes d'infection
Lenteur anormale, publicités partout, programmes inconnus, fichiers renommés, antivirus désactivé.

## Se protéger
- Antivirus à jour (Windows Defender suffit souvent).
- Mises à jour du système.
- Ne pas installer de logiciels « crackés ».
- Se méfier des clés USB inconnues.
- Mots de passe forts et différents.

## La règle de sauvegarde 3-2-1
**3** copies des données, sur **2** supports différents, dont **1** hors du lieu (cloud ou autre maison).
`,ex:[
{q:"Un client a tous ses fichiers renommés en « .locked » avec un message demandant de payer. Qu'est-ce que c'est et que conseiller ?",r:"Un **rançongiciel**. Débrancher l'ordinateur du réseau, ne pas payer (rien ne garantit la récupération), restaurer depuis une **sauvegarde**, puis réinstaller le système. D'où l'importance de la règle 3-2-1."},
{q:"Applique la règle 3-2-1 au rapport de stage d'un étudiant.",r:"**3 copies** : l'ordinateur, une clé USB, Google Drive. **2 supports** : disque de l'ordinateur et clé USB. **1 hors du lieu** : Google Drive."}]}],
quiz:[

A("electricite",{chapitres:[
{t:"Onduleur, groupe électrogène et solaire",c:`
## L'onduleur (UPS)
Il protège l'ordinateur contre les **coupures** et les **variations de tension** grâce à une batterie.
- Autonomie de quelques minutes : le temps d'**enregistrer et d'éteindre proprement**.
- Puissance en **VA** (voltampères). On choisit environ 1,5 fois la puissance des appareils.

## Le groupe électrogène
Un moteur thermique entraîne un alternateur. Il prend le relais pendant les longues coupures.
! Ne jamais faire tourner un groupe dans une pièce fermée (gaz mortel).

## L'énergie solaire photovoltaïque
- **Panneaux** : produisent du courant continu (en Wc, watts-crête).
- **Régulateur** : protège la batterie.
- **Batteries** : stockent l'énergie (en Ah).
- **Onduleur solaire** : transforme le 12/24 V continu en 230 V alternatif.
= Énergie des batteries (Wh) = tension (V) × capacité (Ah)
`,ex:[
{q:"Un PC (300 W) et un écran (50 W). Quelle puissance d'onduleur choisir ?",r:"Total = 350 W. Avec une marge de 1,5 : 350 × 1,5 ≈ 525 → on choisit un onduleur de **600 VA** ou plus."},
{q:"Une batterie de 12 V et 100 Ah stocke combien d'énergie ? Combien de temps alimente-t-elle une box Internet de 20 W ?",r:"E = 12 × 100 = **1 200 Wh**. On n'utilise qu'environ 50 % pour préserver la batterie : 600 Wh ÷ 20 W = **30 heures**."}]},
{t:"Schémas et symboles électriques",c:`
Un **schéma électrique** représente un circuit avec des symboles normalisés.

## Les symboles à connaître
|Élément|Représentation|
|Générateur continu|Deux traits parallèles, le long = +|
|Lampe|Cercle avec une croix|
|Interrupteur|Trait incliné (ouvert) entre deux points|
|Résistance|Rectangle|
|Diode|Triangle contre un trait|
|Prise de terre|Trait vertical et trois traits horizontaux décroissants|
|Fusible|Rectangle traversé par un trait|
|Moteur|Cercle avec la lettre M|

## Schéma développé et schéma architectural
- **Développé** : montre le fonctionnement, fil par fil.
- **Architectural** (unifilaire) : montre l'emplacement des appareils sur le plan de la maison.
`,ex:[
{q:"Décris le schéma d'un simple allumage.",r:"La **phase** passe par l'**interrupteur** puis va à la **lampe** ; le **neutre** va directement à la lampe. On coupe toujours la phase, jamais le neutre."},
{q:"Pourquoi l'interrupteur doit-il couper la phase et non le neutre ?",r:"Pour que la lampe **ne soit plus sous tension** quand l'interrupteur est ouvert : on peut changer l'ampoule sans risque d'électrisation."}]}],
quiz:[
{q:"L'onduleur sert surtout à :",o:["Augmenter la vitesse du PC","Protéger contre les coupures","Refroidir le PC","Remplacer la Senelec"],a:1,e:"Il donne le temps d'éteindre proprement."},
{q:"L'énergie d'une batterie 12 V 50 Ah :",o:["62 Wh","600 Wh","1200 Wh","4 Wh"],a:1,e:"12 × 50 = 600 Wh."},
{q:"L'interrupteur doit couper :",o:["Le neutre","La terre","La phase","Rien"],a:2,e:"La phase."}]});

A("anglais",{chapitres:[
{t:"Comparing devices",c:`
## Comparatives
- Short adjectives: adjective + **-er** + than → fast**er** than, cheap**er** than, big**ger** than.
- Long adjectives: **more** + adjective + than → **more powerful** than, **more expensive** than.

## Superlatives
- Short: **the** + adjective + **-est** → the fast**est**, the cheap**est**.
- Long: **the most** + adjective → the most powerful.

## Irregular
good → better → the best ; bad → worse → the worst

> Example: An SSD is faster than a hard drive. NVMe is the fastest type of storage.
`,ex:[
{q:"Complete: A laptop is (light) ___ than a desktop computer.",r:"A laptop is **lighter** than a desktop computer."},
{q:"Complete: The i9 is (powerful) ___ processor of the list.",r:"The i9 is **the most powerful** processor of the list."},
{q:"Write a sentence comparing Wi-Fi and Ethernet speed.",r:"Example: **Ethernet is usually faster and more stable than Wi-Fi.**"}]},
{t:"Modal verbs: can, must, should",c:`
|Modal|Meaning|Example|
|can|ability / possibility|You **can** connect two monitors.|
|can't|impossibility|You **can't** open this file without a password.|
|must|obligation / rule|You **must** save your work.|
|mustn't|prohibition|You **mustn't** touch the motherboard without protection.|
|should|advice|You **should** update your antivirus.|

## Grammar rules
- Modal + **base verb** without « to »: You must **save** (not « must to save »).
- No « -s » with he/she: He **can** install (not « cans »).
`,ex:[
{q:"Give 3 safety rules for a computer lab using must / mustn't.",r:"**You must turn off the computer before opening it. You mustn't eat or drink near the computers. You must use your own password.**"},
{q:"Give advice to a friend whose computer is slow, using should.",r:"**You should delete unused programs, you should run an antivirus scan, and you should install an SSD.**"}]}],

{t:"Monter une vidéo pas à pas",c:`
## Les étapes d'un montage
1. **Dérusher** : regarder les rushes (vidéos brutes) et garder les meilleurs passages.
2. **Monter** : placer les plans sur la timeline, couper (split), réorganiser.
3. **Transitions** : fondu, coupe franche, zoom. Avec modération.
4. **Textes et sous-titres** : titres, sous-titres (de plus en plus regardés sans le son).
5. **Son** : voix, musique, bruitages. La musique doit baisser sous la voix.
6. **Étalonnage** : luminosité, contraste, couleurs harmonisées.
7. **Export** : format, définition, images/s.

## Les règles du rythme sur les réseaux
- Accrocher dans les **3 premières secondes**.
- Changer de plan toutes les 2 à 4 secondes.
- Finir par un appel à l'action (« abonne-toi »).

## Réglages d'export TikTok/Instagram
MP4, H.264, 1080 × 1920, 30 images/s, son AAC.
`,ex:[
{q:"Remets dans l'ordre : export, dérushage, étalonnage, montage, son.",r:"**Dérushage → montage → son → étalonnage → export** (le son et l'étalonnage peuvent s'inverser, mais l'export est toujours la dernière étape)."},
{q:"Pourquoi ajouter des sous-titres à une vidéo TikTok ?",r:"Beaucoup de personnes regardent **sans le son** (au travail, dans les transports). Les sous-titres gardent leur attention et rendent la vidéo **accessible** aux malentendants."}]},

**CC0** : domaine public, libre de tout usage.

{t:"Le compte rendu et le procès-verbal",c:`
## Le compte rendu
Il raconte de façon **objective** ce qui s'est passé (réunion, visite, intervention).

- Déroulement, dans l'ordre.
- Décisions prises.
- Écrit à la 3ᵉ personne, au présent ou au passé.

## Le procès-verbal (PV)
Document **officiel** qui enregistre les décisions d'une réunion (association, conseil). Il est **signé** par le président et le secrétaire.

## Le compte rendu d'intervention technique

|Client|Cyber Thiès Centre|
|Date|15/11/2026|
|Problème signalé|PC n°3 ne démarre pas|
|Diagnostic|Barrette RAM défectueuse|

|Résultat|PC fonctionnel, test OK|

{t:"Quelques algorithmes classiques",c:`
## Les k plus proches voisins (k-NN)
Pour classer un nouvel élément, on regarde les **k exemples les plus proches** et on prend la catégorie majoritaire.
> Exemple : un fruit inconnu ressemble à 3 voisins, dont 2 oranges et 1 citron : on prédit « orange ».

## L'arbre de décision
Une suite de **questions oui/non** qui mène à une réponse.
:::
Moyenne >= 10 ?
 ├── oui → Assiduité >= 80 % ?
 │         ├── oui → ADMIS
 │         └── non → ORAL DE RATTRAPAGE
 └── non → AJOURNÉ
:::

## Le k-means (regroupement)
Algorithme **non supervisé** : il forme **k groupes** d'éléments qui se ressemblent (par exemple des clients selon leurs achats).

## La régression linéaire
Trouver la droite qui passe au mieux par les points pour **prédire un nombre**.
= y = a × x + b
`,ex:[

{q:"k-NN avec k = 5 : un point a 3 voisins « spam » et 2 « normal ». Prédiction ?",r:"La majorité est « spam » (3 contre 2) → **spam**."},
{q:"Le prix d'une location suit y = 2 000 × x + 10 000 (x = nombre de jours). Prix pour 5 jours ?",r:"y = 2 000 × 5 + 10 000 = **20 000 FCFA**."}]},
{t:"Python pour débuter en IA",c:`

from sklearn.tree import DecisionTreeClassifier

{t:"WordPress et les CMS",c:`
Un **CMS** (système de gestion de contenu) permet de créer et gérer un site **sans tout coder**. **WordPress** fait tourner une très grande partie des sites du monde.

## Les éléments de WordPress
- **Tableau de bord** (wp-admin).
- **Articles** (blog, actualités) et **pages** (Accueil, Contact).
- **Thèmes** : l'apparence du site.
- **Extensions** (plugins) : ajouter des fonctions (formulaire, boutique WooCommerce, sécurité, SEO).
- **Médias** : images et fichiers.

## Installer WordPress
1. Un hébergement avec PHP et MySQL.
2. Une base de données vide.
3. Télécharger WordPress, envoyer les fichiers, lancer l'installation (ou installation en 1 clic chez l'hébergeur).

## Sécuriser un site WordPress
- Mettre à jour WordPress, les thèmes et les extensions.
- Mot de passe fort, pas d'identifiant « admin ».
- Extension de sécurité et sauvegardes régulières.

A("genie-logiciel",{chapitres:[
{t:"L'algorithmique",c:`
Un **algorithme** est une suite d'instructions précises pour résoudre un problème.

## Le pseudo-code
:::
ALGORITHME Moyenne
VARIABLES n1, n2, n3, moy : RÉEL
DÉBUT
  LIRE n1, n2, n3
  moy ← (n1 + n2 + n3) / 3
  SI moy >= 10 ALORS
     ÉCRIRE "Admis"
  SINON
     ÉCRIRE "Ajourné"
  FINSI
FIN
:::

## Les structures
- **Séquence** : instructions l'une après l'autre.
- **Condition** : SI … ALORS … SINON.
- **Boucle POUR** : nombre de répétitions connu.
- **Boucle TANT QUE** : répéter tant qu'une condition est vraie.

## Les tableaux
Une variable qui contient plusieurs valeurs : notes[1], notes[2]…
`,ex:[
{q:"Écris un algorithme qui affiche la table de multiplication de 7 (de 1 à 10).",r:"Code :\nPOUR i DE 1 À 10 FAIRE\n   ÉCRIRE 7, \" x \", i, \" = \", 7 * i\nFINPOUR"},
{q:"Écris un algorithme qui demande un mot de passe tant qu'il est différent de « 1234 ».",r:"Code :\nLIRE mdp\nTANT QUE mdp ≠ \"1234\" FAIRE\n   ÉCRIRE \"Mot de passe incorrect\"\n   LIRE mdp\nFINTANTQUE\nÉCRIRE \"Accès autorisé\""}]},
{t:"La programmation orientée objet",c:`
La **POO** organise le programme autour d'**objets** qui ressemblent au monde réel.

## Les notions
- **Classe** : le modèle (le plan de la maison).
- **Objet** : un exemplaire créé à partir de la classe (une maison construite).
- **Attributs** : les caractéristiques (nom, prix).
- **Méthodes** : les actions (calculerTotal()).

## Les quatre principes
- **Encapsulation** : protéger les données (attributs privés, accès par des méthodes).
- **Héritage** : une classe fille reprend une classe mère (Portable hérite d'Ordinateur).
- **Polymorphisme** : une même méthode agit différemment selon l'objet.
- **Abstraction** : ne montrer que l'essentiel.

## Exemple en JavaScript
:::
class Ordinateur {
  constructor(marque, ram) { this.marque = marque; this.ram = ram; }
  decrire() { return this.marque + " avec " + this.ram + " Go"; }
}
class Portable extends Ordinateur {
  constructor(marque, ram, batterie) { super(marque, ram); this.batterie = batterie; }
}
const pc = new Portable("HP", 16, "8 h");
console.log(pc.decrire());   // HP avec 16 Go
:::
`,ex:[
{q:"Dans l'exemple, quelle est la classe mère et la classe fille ?",r:"**Ordinateur** est la classe mère ; **Portable** est la classe fille (elle hérite avec extends)."},
{q:"Crée une classe Etudiant avec nom et moyenne, et une méthode estAdmis().",r:"Code :\nclass Etudiant {\n  constructor(nom, moyenne) { this.nom = nom; this.moyenne = moyenne; }\n  estAdmis() { return this.moyenne >= 10; }\n}"}]}],
quiz:[
{q:"Boucle utilisée quand on connaît le nombre de répétitions :",o:["TANT QUE","POUR","SI","SINON"],a:1,e:"La boucle POUR."},
{q:"En POO, le modèle à partir duquel on crée des objets :",o:["La méthode","La classe","L'attribut","La variable"],a:1,e:"La classe."},
{q:"Le principe qui permet à une classe de reprendre une autre :",o:["Encapsulation","Héritage","Compilation","Boucle"],a:1,e:"L'héritage."}]});

A("reseaux",{chapitres:[
{t:"IPv6 et les VLAN",c:`
## Pourquoi IPv6 ?
IPv4 ne propose qu'environ **4,3 milliards** d'adresses : elles sont épuisées. **IPv6** utilise **128 bits**, soit un nombre d'adresses quasiment illimité.

## L'écriture IPv6
8 groupes de 4 chiffres hexadécimaux : **2001:0db8:0000:0000:0000:ff00:0042:8329**
- On supprime les zéros en tête : 2001:db8:0:0:0:ff00:42:8329
- Une suite de groupes nuls peut être remplacée **une seule fois** par :: → **2001:db8::ff00:42:8329**
- ::1 = localhost en IPv6.

## Les VLAN (réseaux locaux virtuels)
Un **VLAN** découpe un même switch en plusieurs réseaux séparés.
- Exemple : VLAN 10 = administration, VLAN 20 = étudiants, VLAN 30 = Wi-Fi invités.
- Avantages : **sécurité** (les groupes ne se voient pas), moins de trafic inutile, organisation.
- Pour faire communiquer deux VLAN, il faut un **routeur** (ou un switch de niveau 3).
`,ex:[
{q:"Simplifie l'adresse 2001:0db8:0000:0000:0000:0000:0000:0001.",r:"On enlève les zéros en tête puis on remplace la suite de groupes nuls par :: → **2001:db8::1**."},
{q:"Pourquoi mettre le Wi-Fi invités dans un VLAN séparé ?",r:"Pour que les invités aient Internet **sans accéder** aux ordinateurs et serveurs de l'administration : c'est une mesure de **sécurité**."}]},
{t:"Sécurité réseau",c:`
## Les menaces
- **Hameçonnage** (phishing) : faux messages pour voler des identifiants.
- **Attaque de l'homme du milieu** : interception sur un Wi-Fi public.
- **Déni de service** (DDoS) : saturer un serveur.
- **Intrusion** : accès non autorisé.

## Les protections
|Outil|Rôle|
|Pare-feu (firewall)|Filtre le trafic entrant et sortant selon des règles|
|VPN|Crée un tunnel chiffré sur Internet|
|WPA2/WPA3|Chiffre le Wi-Fi|
|Mots de passe forts + double authentification|Protège les comptes|
|Mises à jour|Corrige les failles connues|
|Filtrage MAC|Limite les appareils autorisés (protection faible seule)|

## Bonnes pratiques pour la box ou le routeur
- Changer le **mot de passe administrateur** par défaut.
- Changer le nom du Wi-Fi (SSID) et utiliser WPA2/WPA3.
- Désactiver le **WPS**.
- Mettre à jour le firmware.
`,ex:[
{q:"Tu installes le Wi-Fi d'un petit cyber. Cite 4 réglages de sécurité.",r:"**Changer le mot de passe admin** de la box ; **WPA2/WPA3** avec une clé forte ; **désactiver le WPS** ; créer un **réseau invités** séparé (et mettre à jour le firmware)."},
{q:"À quoi sert un VPN sur un Wi-Fi public ?",r:"Il **chiffre** toute la connexion dans un tunnel : une personne sur le même Wi-Fi ne peut pas lire tes données."}]}],
quiz:[
{q:"Une adresse IPv6 fait :",o:["32 bits","64 bits","128 bits","256 bits"],a:2,e:"128 bits."},
{q:"Pour séparer les étudiants et l'administration sur un même switch :",o:["Un VLAN","Un câble croisé","Un hub","Un DNS"],a:0,e:"Les VLAN."},
{q:"Outil qui filtre le trafic selon des règles :",o:["Le DHCP","Le pare-feu","Le switch","Le répéteur"],a:1,e:"Le pare-feu."}]});

A("electronique",{chapitres:[
{t:"Capteurs et actionneurs",c:`
Un système automatique **mesure** avec des capteurs, **décide** avec un microcontrôleur, puis **agit** avec des actionneurs.

## Les capteurs (ils mesurent)
|Capteur|Grandeur|Exemple d'usage|
|LDR (photorésistance)|Lumière|Allumer l'éclairage public la nuit|
|LM35, DHT11|Température, humidité|Climatisation, serre agricole|
|HC-SR04 (ultrason)|Distance|Radar de recul, niveau d'eau d'une citerne|
|PIR|Mouvement|Alarme, lumière automatique|
|Capteur d'humidité du sol|Humidité|Arrosage automatique|

## Les actionneurs (ils agissent)
- **LED, buzzer** : signaler.
- **Relais** : commander un appareil 230 V avec un signal 5 V (pompe, lampe).
- **Moteur à courant continu, servomoteur** : faire bouger.

## La chaîne d'information
= Capteur → Traitement (Arduino) → Actionneur
`,ex:[
{q:"Conçois un arrosage automatique pour un jardin à Thiès : quels capteur, traitement et actionneur ?",r:"**Capteur** : humidité du sol. **Traitement** : Arduino compare la valeur à un seuil. **Actionneur** : un **relais** qui commande la pompe. Si le sol est sec → la pompe démarre."},
{q:"Pourquoi utiliser un relais pour commander une pompe 230 V avec un Arduino ?",r:"L'Arduino ne fournit que **5 V et quelques mA**. Le relais est un interrupteur commandé : le petit signal 5 V ferme un contact qui laisse passer le 230 V, avec une **isolation** entre les deux circuits."}]}],
quiz:[{q:"Le capteur HC-SR04 mesure :",o:["La température","La distance","La lumière","Le son"],a:1,e:"Ultrason → distance."}]});

A("entreprenariat",{chapitres:[
{t:"Fixer son prix",c:`
Un bon prix couvre les coûts, reste acceptable pour le client et laisse un bénéfice.

## Les trois méthodes
- **Par les coûts** : coût de revient + marge.
- **Par la concurrence** : se placer par rapport aux prix du marché.
- **Par la valeur** : ce que le client est prêt à payer pour le résultat.
= Prix de vente = Coût de revient × (1 + taux de marge)

## Calculer le coût d'une prestation de service
Additionner : temps passé × coût de l'heure, matériel, transport, part des charges fixes (loyer, Internet, électricité).

> Ne vends jamais à perte pour « avoir des clients » : on ne peut pas tenir longtemps.
`,ex:[
{q:"Un site vitrine te demande 10 h de travail (2 500 FCFA/h), plus 15 000 FCFA d'hébergement et de domaine. Avec 30 % de marge, quel prix ?",r:"Coût = 10 × 2 500 + 15 000 = **40 000 FCFA**. Prix = 40 000 × 1,30 = **52 000 FCFA** (on peut annoncer 50 000 ou 55 000)."}]}],
quiz:[{q:"Prix de vente avec un coût de 10 000 et 20 % de marge :",o:["10 200","12 000","8 000","20 000"],a:1,e:"10 000 × 1,2 = 12 000."}]});

A("maintenance",{chapitres:[
{t:"Portables et smartphones",c:`
## L'ordinateur portable
- Pièces souvent **soudées** (processeur, parfois la RAM).
- Ce qu'on change facilement : **SSD, RAM (si slot), batterie, clavier, écran**.
- Problème n°1 : **la chaleur**. Nettoyer les ventilateurs, changer la pâte thermique, ne pas l'utiliser sur un lit.

## La batterie lithium-ion
- Se garde mieux entre **20 % et 80 %**.
- Éviter la chaleur.
! Une batterie **gonflée** est dangereuse : ne pas la percer, ne plus la charger, la remplacer.

## Le smartphone
|Panne|Réparation|
|Écran cassé|Remplacement du bloc écran|
|Ne charge plus|Nettoyer ou changer le connecteur de charge|
|Lent, plein|Libérer de l'espace, désinstaller, réinitialiser après sauvegarde|
|Bloqué au logo|Mode récupération, réinstallation du système|
`,ex:[
{q:"Un client veut accélérer son vieux portable avec 4 Go de RAM et un disque dur. Que proposer dans l'ordre ?",r:"1. Remplacer le disque dur par un **SSD** (le gain le plus visible). 2. Passer à **8 Go de RAM** si un slot est disponible. 3. Nettoyer le système et le ventilateur."},
{q:"Le dos d'un téléphone se soulève tout seul. Que se passe-t-il ?",r:"La **batterie a gonflé**. Il faut arrêter de le charger, ne pas appuyer dessus, et **remplacer la batterie** rapidement."}]}],
quiz:[{q:"Pièce souvent soudée sur un portable :",o:["Le SSD","Le processeur","La batterie","Le clavier"],a:1,e:"Le processeur est généralement soudé."}]});

A("electricite",{chapitres:[
{t:"Moteurs et machines électriques",c:`
Un **moteur électrique** transforme l'énergie électrique en énergie **mécanique** (rotation).

## Les types de moteurs
|Moteur|Alimentation|Exemples|
|Courant continu (DC)|Piles, batteries, 5–24 V|Ventilateur de PC, jouets, robots|
|Pas à pas|Impulsions|Imprimantes, imprimantes 3D|
|Asynchrone|Alternatif 230 V ou triphasé 400 V|Pompes, ventilateurs de plafond, machines d'atelier|

## Le rendement
Une partie de l'énergie est perdue en chaleur.
= Rendement η = Puissance utile / Puissance absorbée (toujours < 1)

## Le transformateur et l'alternateur
- **Alternateur** : l'inverse du moteur, il produit du courant (centrales, groupes électrogènes).
- **Transformateur** : change la valeur d'une tension alternative.
`,ex:[
{q:"Une pompe absorbe 1 000 W et fournit 750 W de puissance utile. Calcule le rendement.",r:"η = 750 / 1000 = **0,75 = 75 %**. Les 25 % restants partent en chaleur et en frottements."}]}],
quiz:[{q:"Le rendement d'un moteur est toujours :",o:["Supérieur à 1","Égal à 1","Inférieur à 1","Négatif"],a:2,e:"Il y a toujours des pertes."}]});

## Will
Decisions taken now, predictions, promises.
- I **will** call the technician.

## Going to
Plans already decided, or evidence now.
- We **are going to** build a website for the school.

= will not = won't · Will you…? · I'm not going to… · Are you going to…?

A("bureautique",{chapitres:[
{t:"Microsoft Access : la base de données bureautique",c:`
**Access** gère des données organisées : élèves, produits, clients. C'est plus puissant qu'Excel quand les informations sont nombreuses et liées.

## Les quatre objets
|Objet|Rôle|
|Table|Stocker les données (lignes et colonnes)|
|Requête|Chercher, filtrer, calculer|
|Formulaire|Saisir facilement les données|
|État|Imprimer des listes et des bilans|

## Les bonnes pratiques
- Chaque table a une **clé primaire** (N° élève, N° produit).
- On relie les tables par des **relations** (un client → plusieurs commandes).
- On choisit le bon **type de champ** : texte court, nombre, date, monétaire, oui/non.
`,ex:[
{q:"Dans une base « Bibliothèque », quelles tables créer ?",r:"**LIVRE**(N°livre, titre, auteur), **ÉTUDIANT**(N°étudiant, nom, classe), **EMPRUNT**(N°emprunt, #N°livre, #N°étudiant, date d'emprunt, date de retour)."},
{q:"Quel objet Access utiliser pour imprimer la liste des élèves admis ?",r:"Un **état**, basé sur une **requête** qui filtre les élèves dont la moyenne est ≥ 10."}]}],
quiz:[{q:"Objet Access pour imprimer un bilan :",o:["Table","Requête","Formulaire","État"],a:3,e:"L'état."}]});

A("multimedia",{chapitres:[
{t:"La 3D et l'animation",c:`
La 3D est partout : jeux vidéo, films, publicités, architecture, sites web.

## Le pipeline 3D
1. **Modélisation** : créer la forme avec des polygones (sommets, arêtes, faces).
2. **Texturage** : appliquer couleurs et matières.
3. **Éclairage** : placer les lumières.
4. **Animation** : images clés (keyframes) dans le temps.
5. **Rendu** : calculer les images finales.

## Les logiciels
- **Blender** : gratuit et complet.
- Maya, 3ds Max, Cinema 4D : professionnels, payants.
- **Three.js** : 3D directement dans une page web (comme l'ordinateur de l'accueil de ce site).

## Les principes de l'animation
Anticipation, ralentir au début et à la fin (easing), exagération et rythme rendent un mouvement naturel.
`,ex:[
{q:"Remets dans l'ordre : rendu, modélisation, animation, texturage, éclairage.",r:"**Modélisation → texturage → éclairage → animation → rendu.**"},
{q:"Qu'est-ce qu'une image clé ?",r:"Une image où l'on **fixe une position** (ou une valeur). Le logiciel calcule automatiquement les images intermédiaires entre deux images clés."}]}],
quiz:[{q:"Logiciel 3D gratuit et complet :",o:["Photoshop","Blender","Excel","Audacity"],a:1,e:"Blender."}]});

A("francais",{chapitres:[
{t:"L'argumentation",c:`
**Argumenter**, c'est défendre une opinion (une **thèse**) avec des **arguments** et des **exemples**.

## La structure d'un paragraphe argumentatif
1. **L'argument** : l'idée qui soutient la thèse.
2. **L'explication** : pourquoi c'est vrai.
3. **L'exemple** : un fait précis.

## Les connecteurs logiques
|Pour…|Connecteurs|
|Ajouter|de plus, en outre, par ailleurs|
|Opposer|mais, cependant, pourtant, en revanche|
|Expliquer|car, en effet, puisque|
|Conclure|donc, ainsi, en conclusion|

## Les types de plan
- **Dialectique** : pour / contre / synthèse.
- **Thématique** : plusieurs aspects d'un même sujet.
`,ex:[
{q:"Écris un paragraphe argumentatif : « Le téléphone est utile pour étudier ».",r:"Exemple : « **Le téléphone est un outil d'apprentissage précieux.** En effet, il donne accès à des cours, des vidéos et des exercices à tout moment. Par exemple, un étudiant peut réviser les sous-réseaux dans le bus avec une plateforme comme celle-ci. »"}]}],
quiz:[{q:"« Cependant » sert à :",o:["Ajouter","Opposer","Conclure","Expliquer"],a:1,e:"Il marque une opposition."}]});

A("ia",{chapitres:[
{t:"Vision par ordinateur et traitement du langage",c:`
## La vision par ordinateur
Apprendre à la machine à **comprendre des images**.
- **Classification** : « cette image contient un chat ».
- **Détection d'objets** : encadrer chaque voiture sur une photo.
- **Reconnaissance faciale**, lecture de plaques, contrôle qualité en usine, diagnostic sur radios.
Outil clé : le **réseau de neurones convolutif (CNN)**.

## Le traitement du langage naturel (NLP)
Apprendre à la machine à **comprendre et produire du texte**.
- Traduction automatique, correcteur, filtre anti-spam.
- **Analyse de sentiment** : un commentaire est-il positif ou négatif ?
- **Chatbots** et assistants.
Les mots sont transformés en **nombres** (vecteurs) pour être traités.

## La reconnaissance vocale
Transformer la parole en texte (dictée vocale du téléphone), puis éventuellement répondre (assistant vocal).
`,ex:[
{q:"Pour quel domaine de l'IA classerais-tu : la dictée vocale, le tri automatique de photos, la détection de messages haineux ?",r:"Dictée vocale : **reconnaissance vocale**. Tri de photos : **vision par ordinateur**. Messages haineux : **traitement du langage (NLP)**."}]}],

A("web",{chapitres:[
{t:"Le référencement naturel (SEO)",c:`
Le **SEO** permet d'apparaître dans les premiers résultats de Google sans payer de publicité.

## Les bases techniques
- Une balise **title** unique et claire pour chaque page (moins de 60 caractères).
- Une **meta description** qui donne envie de cliquer.
- **Un seul h1** par page, puis des h2, h3 bien organisés.
- Des **URL lisibles** : /reparation-ordinateur-thies plutôt que /page?id=12.
- Des images **compressées** avec un attribut **alt**.
- Un site **rapide** et **adapté au téléphone**.

## Le contenu
- Répondre aux questions que se posent les clients.
- Utiliser les mots qu'ils tapent : « réparation téléphone Thiès ».

## La popularité
Des **liens** depuis d'autres sites, une fiche **Google Business Profile**, des avis clients.
`,ex:[
{q:"Écris le title et la meta description de la page d'accueil d'un réparateur d'ordinateurs à Thiès.",r:"Code :\n<title>Réparation d'ordinateurs à Thiès | Atelier PC Pro</title>\n<meta name=\"description\" content=\"Dépannage PC et portables à Thiès : écran, SSD, virus, Windows. Diagnostic rapide et garantie. Appelez-nous.\">"}]}],
quiz:[{q:"Combien de h1 par page ?",o:["Aucun","Un seul","Trois","Autant qu'on veut"],a:1,e:"Un seul h1 par page."}]});

A("genie-logiciel",{chapitres:[
{t:"Gestion de projet : planning, Gantt et PERT",c:`
## Découper le projet
Lister les **tâches**, leur **durée** et leurs **dépendances** (ce qui doit être fini avant).

## Le diagramme de Gantt
Un tableau où chaque tâche est une **barre** sur une ligne de temps. On voit d'un coup qui fait quoi et quand.

## Le réseau PERT et le chemin critique
On relie les tâches selon leurs dépendances. Le **chemin critique** est la suite de tâches la plus longue : un retard sur l'une d'elles retarde **tout le projet**.

|Tâche|Durée|Avant elle|
|A Cahier des charges|3 j|—|
|B Maquette|4 j|A|
|C Base de données|5 j|A|
|D Développement|10 j|B, C|
|E Tests|3 j|D|
Chemin critique : **A → C → D → E** = 3 + 5 + 10 + 3 = **21 jours**.
`,ex:[
{q:"Dans l'exemple, si la maquette (B) prend 5 jours au lieu de 4, le projet est-il retardé ?",r:"**Non.** B n'est pas sur le chemin critique : A + B = 8 jours, alors que A + C = 8 jours aussi. D peut toujours commencer au jour 8. B a donc **1 jour de marge** au départ."}]}],
quiz:[{q:"Le chemin critique est :",o:["Le plus court","Le plus long","Le plus cher","Le premier"],a:1,e:"La suite de tâches la plus longue."}]});

A("reseaux",{chapitres:[
{t:"Configurer un réseau avec Packet Tracer",c:`
**Cisco Packet Tracer** est un simulateur gratuit pour construire et tester des réseaux sans matériel.

## Configurer un poste
Bureau du PC → **IP Configuration** : adresse IP, masque, passerelle, DNS.

## Les commandes de base d'un routeur Cisco
:::

const pct = s => Math.round(100 * s.chapitres.filter((c, i) => P.done[s.id + ":" + i]).length / s.chapitres.length);

function md(src) {
  const L = src.replace(/^\n+|\n+$/g, "").split("\n"); let h = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.trim() === ":::") { const c = []; i++; while (i < L.length && L[i].trim() !== ":::") { c.push(L[i]); i++; } i++; h += `<pre><code>${esc(c.join("\n"))}</code></pre>`; continue; }
    if (l.startsWith("## ")) { h += `<h3>${inl(l.slice(3))}</h3>`; i++; continue; }
    if (l.startsWith("|")) { const rows = []; while (i < L.length && L[i].startsWith("|")) { rows.push(L[i].replace(/^\||\|$/g, "").split("|")); i++; }
      h += `<div class="tbl"><table><thead><tr>${rows[0].map(c => `<th>${inl(c.trim())}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inl(c.trim())}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
    if (l.startsWith("- ")) { const it = []; while (i < L.length && L[i].startsWith("- ")) { it.push(L[i].slice(2)); i++; } h += `<ul>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { const it = []; while (i < L.length && /^\d+\. /.test(L[i])) { it.push(L[i].replace(/^\d+\. /, "")); i++; } h += `<ol>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ol>`; continue; }
    if (l.startsWith("= ")) { h += `<div class="formula">${inl(l.slice(2))}</div>`; i++; continue; }
    if (l.startsWith("> ")) { h += `<div class="tip"><b>Astuce :</b>${inl(l.slice(2).replace(/^Astuce\s*:\s*/, ""))}</div>`; i++; continue; }
    if (l.startsWith("! ")) { h += `<div class="warn"><b>Attention :</b>${inl(l.slice(2))}</div>`; i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(## |\||- |\d+\. |= |> |! |:::)/.test(L[i])) { p.push(L[i]); i++; }
    h += `<p>${inl(p.join(" "))}</p>`;
  }
  return h;
}
const answer = r => r.startsWith("Code :") ? `<pre><code>${esc(r.replace(/^Code :\n?/, ""))}</code></pre>` : r.split("\n").map(x => `<p style="margin:0 0 6px">${inl(x)}</p>`).join("");

const app = $("#app");
function header(active) {
  return `<header class="top"><div class="wrap">
  <a class="brand" href="#accueil"><img src="${LOGO}" alt=""><b>WebMaster <span>Academy</span></b></a>
  <nav class="right nav">
    <a class="btn small ${active === "accueil" ? "cur" : ""}" href="#accueil">Accueil</a>
    <a class="btn small ${active === "emploi" ? "cur" : ""}" href="#emploi">Emploi du temps</a>
    <a class="btn small hide-sm ${active === "programme" ? "cur" : ""}" href="#programme">Matières</a>
  </nav></div></header>`;
}
const footer = () => `<footer><div class="wrap"><span>© ${new Date().getFullYear()} WebMaster Academy · Cours de 2ᵉ année DT Informatique et Webmaster · Thiès</span><span>${TEL}</span></div></footer>`;

function renderHome(anchor) {
  let idx = todayIdx, label = "Aujourd'hui"; if (idx < 0) { idx = 0; label = "Demain"; }
  const today = SUBJECTS.filter(s => s.jour === DAYS[idx]);
  app.innerHTML = header(anchor === "programme" ? "programme" : "accueil") + `
  <section class="hero3d">
    <div class="scene" id="pc"><div class="cap" id="pccap">Démarrage…</div></div>
    <div class="wrap copy">
      <div class="kicker">DT Informatique et Webmaster · 2ᵉ année · Thiès</div>
      <h1>Toute ton année d'informatique, <span class="g">en un seul endroit</span>.</h1>
      <p class="lead">${SUBJECTS.length} matières, ${nCh} chapitres expliqués simplement, ${nEx} exercices corrigés et un quiz par matière. Gratuit pour toute l'école.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn primary" href="#programme">Commencer les cours</a><a class="btn ghost" href="#emploi">Emploi du temps</a></div>
      <div class="facts"><div><b>${SUBJECTS.length}</b>matières</div><div><b>${nCh}</b>chapitres</div><div><b>${nEx}</b>exercices corrigés</div><div><b>${nQz}</b>questions de quiz</div></div>
      <div class="todaybox"><span class="d">${label} · ${DAYS[idx]}</span>${today.map(s => `<a href="#m-${s.id}" style="--c:${s.couleur}">${esc(s.nom)}<small>${s.heure}</small></a>`).join("")}</div>
    </div>
  </section>
  <section class="band" id="programme"><div class="wrap">
    <div class="sh"><div><h2>Les 12 matières</h2><p>Chaque matière explique à quoi elle sert, ce que tu sauras faire et les métiers qu'elle ouvre. Ta progression reste enregistrée sur ton téléphone.</p></div>
      <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Chercher : carte mère, sous-réseau, SI…" autocomplete="off"></label></div>
    <div class="results" id="results"></div>
    <div class="mgrid">${SUBJECTS.map((s, i) => { const p = pct(s); return `<a class="mcard" href="#m-${s.id}" style="--c:${s.couleur}">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="day">${s.jour} · ${s.heure}</span><h3>${esc(s.nom)}</h3>
      <p>${esc(s.role ? s.role.sert.split(". ")[0] + "." : s.intro)}</p>
      <div class="bar"><span style="width:${p}%"></span></div>
      <div class="foot"><span>${s.chapitres.length} chapitres · ${s.chapitres.reduce((a, c) => a + c.ex.length, 0)} exercices</span><span>${p} %</span></div></a>`; }).join("")}</div>
  </div></section>
  <section class="band white"><div class="wrap price">
    <div class="panel"><div class="kicker" style="color:var(--hibiscus)">Pour toute l'école</div><h2 style="font-size:32px;margin:8px 0 8px">Gratuit, à partager</h2>
      <p style="color:var(--muted);margin:0">Envoie le lien dans le groupe WhatsApp de ta classe. Une erreur dans un cours ou un chapitre qui manque ? Écris-nous.</p></div>
    <div class="panel"><div class="kicker" style="color:var(--hibiscus)">Contact</div><div class="big" style="margin:10px 0 14px;font-size:clamp(30px,5vw,42px)">${TEL}</div>
      <a class="btn" style="background:#25D366;border-color:#25D366;color:#062B14" href="https://wa.me/${WA}?text=${encodeURIComponent("Bonjour, à propos de WebMaster Academy :")}" target="_blank" rel="noopener">Écrire sur WhatsApp</a></div>
  </div></section>` + footer();
  const ok = mountPC($("#pc"), $("#pccap"), SUBJECTS, id => { location.hash = "m-" + id; });
  if (!ok) $("#pc").insertAdjacentHTML("beforeend", `<div class="nogl"><img src="${LOGO}" alt=""></div>`);
  $("#q").addEventListener("input", search);
  if (anchor === "programme") $("#programme").scrollIntoView(); else window.scrollTo(0, 0);
}
const IDX = []; SUBJECTS.forEach(s => s.chapitres.forEach((c, i) => IDX.push({ s, i, t: c.t, n: (c.t + " " + c.c + " " + c.ex.map(e => e.q + " " + e.r).join(" ")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "") })));
let PENDING = null;
function search(e) {
  const v = e.target.value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""), out = $("#results");
  if (v.length < 2) { out.innerHTML = ""; return; }
  const hits = IDX.filter(x => x.n.includes(v)).slice(0, 8);
  out.innerHTML = hits.length ? hits.map(x => `<a href="#m-${x.s.id}" data-ch="${x.i}"><b>${esc(x.t)}</b><br><small>${esc(x.s.nom)} · chapitre ${x.i + 1}</small></a>`).join("") : `<p style="color:var(--muted)">Aucun chapitre ne parle de « ${esc(e.target.value)} ». Essaie un autre mot.</p>`;
  out.querySelectorAll("a").forEach(a => a.onclick = () => PENDING = +a.dataset.ch);
}
function renderSchedule() {
  let h = `<table><thead><tr><th>Horaire</th>${DAYS.map((d, i) => `<th class="${i === todayIdx ? "now" : ""}">${d}</th>`).join("")}</tr></thead><tbody>`;
  HOURS.forEach(hr => { h += `<tr><td class="h">${hr}</td>`; DAYS.forEach(d => { const s = SUBJECTS.find(x => x.jour === d && x.heure === hr); h += `<td>${s ? `<a class="slot" style="--c:${s.couleur}" href="#m-${s.id}">${esc(s.nom)}</a>` : ""}</td>`; }); h += "</tr>"; });
  app.innerHTML = header("emploi") + `<section class="band"><div class="wrap"><div class="kicker" style="color:var(--hibiscus)">2ᵉ année · DT Informatique et Webmaster</div><h1 style="font-size:clamp(36px,5.4vw,56px);margin:8px 0 6px">Emploi du temps</h1><p class="sub">Touche un cours pour l'ouvrir.</p><div class="sched">${h}</tbody></table></div></div></section>` + footer();
  scrollTo(0, 0);
}
function renderSubject(s, ch) {
  const total = s.chapitres.length, isQuiz = ch === total;
  const toc = s.chapitres.map((x, i) => { const d = P.done[s.id + ":" + i]; return `<button type="button" data-i="${i}" class="${i === ch ? "on" : ""} ${d ? "done" : ""}"><span class="n">${d ? "✓" : i + 1}</span>${esc(x.t)}</button>`; }).join("") + `<button type="button" data-i="${total}" class="${isQuiz ? "on" : ""}"><span class="n">?</span>Quiz</button>`;
  let body;
  if (isQuiz) {
    body = `<div class="kick">Quiz · ${s.quiz.length} questions</div><h2>Teste-toi en ${esc(s.nom)}</h2><div class="qz">${s.quiz.map((q, qi) => `<div class="qi" data-qi="${qi}"><p>${qi + 1}. ${esc(q.q)}</p><div class="opts">${q.o.map((o, oi) => `<button type="button" data-oi="${oi}">${esc(o)}</button>`).join("")}</div><div class="expl" hidden></div></div>`).join("")}</div><div class="pager"><b id="score" style="font-size:20px"></b><button class="btn" type="button" id="redo">Recommencer</button></div>`;
  } else {
    const x = s.chapitres[ch], k = s.id + ":" + ch;
    body = `<div class="kick">Chapitre ${ch + 1} sur ${total}</div><h2>${esc(x.t)}</h2>${md(x.c)}
    <div class="exs"><h3>Exercices corrigés</h3>${x.ex.map((e, i) => `<div class="exi"><div class="q"><b>Ex. ${i + 1}</b><div>${inl(e.q)}</div></div><details><summary>Voir la correction</summary><div class="a">${answer(e.r)}</div></details></div>`).join("")}</div>
    <div class="pager">${ch > 0 ? `<button class="btn" data-go="${ch - 1}">← Précédent</button>` : "<span></span>"}<button class="btn ${P.done[k] ? "ok" : ""}" id="done">${P.done[k] ? "✓ Chapitre terminé" : "Marquer comme terminé"}</button><button class="btn primary" data-go="${ch + 1}">${ch + 1 < total ? "Chapitre suivant →" : "Passer au quiz →"}</button></div>`;
  }
  const R = s.role;
  app.innerHTML = header("programme") + `<div class="shead" style="--c:${s.couleur}"><div class="wrap"><a class="back" href="#programme">← Toutes les matières</a><h1>${esc(s.nom)}</h1><p class="intro">${esc(s.intro)}</p>
    <div class="chips"><span class="chip"><i style="background:${s.couleur}"></i>${s.jour} · ${s.heure}</span><span class="chip">${total} chapitres</span><span class="chip">${pct(s)} % terminé</span>${P.quiz[s.id] != null ? `<span class="chip">Meilleur quiz : ${P.quiz[s.id]}/${s.quiz.length}</span>` : ""}</div></div></div>
    <div class="wrap" style="padding-bottom:60px;--c:${s.couleur}">${R ? `<div class="role"><div><h3>À quoi sert cette matière ?</h3><p>${esc(R.sert)}</p></div><div><h3>Ce que tu sauras faire</h3><ul>${R.savoir.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>Les métiers</h3><ul>${R.metiers.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>` : ""}<div class="course" style="--c:${s.couleur}"><nav class="toc" aria-label="Chapitres">${toc}</nav><article class="doc">${body}</article></div></div>` + footer();
  document.querySelectorAll(".toc button,[data-go]").forEach(b => b.onclick = () => { renderSubject(s, +(b.dataset.i ?? b.dataset.go)); $(".course").scrollIntoView({ behavior: "smooth" }); });
  const d = $("#done"); if (d) d.onclick = () => { const k = s.id + ":" + ch; P.done[k] = !P.done[k]; save(); renderSubject(s, ch); };
  if (isQuiz) {
    let ans = 0, ok = 0;
    document.querySelectorAll(".qi").forEach(it => { const q = s.quiz[+it.dataset.qi]; it.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (it.dataset.done) return; it.dataset.done = 1; ans++; const oi = +b.dataset.oi;
      if (oi === q.a) { b.classList.add("ok"); ok++; } else { b.classList.add("ko"); it.querySelector(`[data-oi="${q.a}"]`).classList.add("ok"); }
      const ex = it.querySelector(".expl"); ex.hidden = false; ex.textContent = (oi === q.a ? "Bonne réponse. " : "Mauvaise réponse. ") + q.e;
      if (ans === s.quiz.length) { $("#score").textContent = `Score : ${ok} / ${s.quiz.length}`; P.quiz[s.id] = Math.max(ok, P.quiz[s.id] || 0); save(); }
    }); });
    $("#redo").onclick = () => renderSubject(s, total);
  }
}
function route() {
  const h = (location.hash || "#accueil").slice(1);
  if (h.startsWith("m-") && byId[h.slice(2)]) { renderSubject(byId[h.slice(2)], PENDING ?? 0); PENDING = null; scrollTo(0, 0); return; }
  if (h === "emploi") return renderSchedule();
  renderHome(h === "programme" ? "programme" : null);
}
addEventListener("hashchange", route);
route();
(function post() {
  let seen = false; try { seen = sessionStorage.getItem("wma-post") === "1"; sessionStorage.setItem("wma-post", "1"); } catch (e) {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const L = ["WEBMASTER ACADEMY BIOS v2.6 · Thiès", "", "Processeur ............. DT-2 Informatique  <span class=ok>OK</span>",
    "Mémoire ................ " + nCh + " chapitres chargés  <span class=ok>OK</span>", "Stockage ............... " + nEx + " exercices corrigés  <span class=ok>OK</span>",
    "Réseau ................. emploi du temps synchronisé  <span class=ok>OK</span>", "Quiz ................... " + nQz + " questions prêtes  <span class=ok>OK</span>", "", "Démarrage du système…"];
  const el = document.createElement("div"); el.id = "post"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div id="postt"></div><button class="skip" type="button">Passer</button>`; document.body.appendChild(el);
  let i = 0; const out = () => { el.classList.add("out"); setTimeout(() => el.remove(), 600); };
  el.querySelector(".skip").onclick = out;
  const tick = () => { if (i < L.length) { document.getElementById("postt").innerHTML += (L[i] || "&nbsp;") + "<br>"; i++; setTimeout(tick, 170); } else setTimeout(out, 450); };
  tick();
})();

</script>
